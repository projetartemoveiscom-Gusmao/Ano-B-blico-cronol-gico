</style></head><body><nav class="bar" aria-label="Navegação principal"><button data-resume>Onde parei</button><button data-home>Início do estudo</button><button data-week>Início da semana</button></nav><main></main><div id="toast" role="status" aria-live="polite" hidden></div><script>window.STUDY={"title": "Ano Bíblico Conceitual", "edition": "Edição integral • 365 dias", "weeks": [{"week": 1, "title": "Criação, recomeço e fé", "context": "Gênesis apresenta criação, ruptura, dilúvio e dispersão. Jó muda o cenário para a experiência de uma pessoa íntegra que sofre sem conhecer a explicação oferecida ao leitor. A aproximação é temática e tradicionalmente patriarcal, não uma datação exata. Compare quem fala, o que o narrador afirma e aquilo que os personagens apenas supõem.", "promise": "Gn 3:15 recebe uma leitura cristã de vitória sobre o mal; Gn 9:8-17 estabelece uma aliança de preservação. Em Jó, a esperança aparece ainda em forma de pergunta. Não antecipe uma solução que o personagem ainda não recebeu.", "question": "Como a dignidade humana muda nossa resposta ao sofrimento?", "cross": "Gn 3:15; Gn 9:8-17; Jó 2:3", "art": {"file": "origens.png", "grid": [1, 3], "cell": 0, "label": "Criação: representação artística"}, "context_html": "Gênesis apresenta criação, ruptura, dilúvio e dispersão. Jó muda o cenário para a experiência de uma pessoa íntegra que sofre sem conhecer a explicação oferecida ao leitor. A aproximação é temática e tradicionalmente patriarcal, não uma datação exata. Compare quem fala, o que o narrador afirma e aquilo que os personagens apenas supõem.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 3 na BKJ Fiel 1611 (requer internet)\">Gn 3:15<\/a> recebe uma leitura cristã de vitória sobre o mal; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 9 na BKJ Fiel 1611 (requer internet)\">Gn 9:8-17<\/a> estabelece uma aliança de preservação. Em Jó, a esperança aparece ainda em forma de pergunta. Não antecipe uma solução que o personagem ainda não recebeu.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 3 na BKJ Fiel 1611 (requer internet)\">Gn 3:15<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 9 na BKJ Fiel 1611 (requer internet)\">Gn 9:8-17<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 2 na BKJ Fiel 1611 (requer internet)\">Jó 2:3<\/a>"}, {"week": 2, "title": "Sabedoria no meio da dor", "context": "O diálogo de Jó prossegue, com acusações cada vez mais fortes e a entrada de Eliú. A poesia não deve ser tratada como uma série de afirmações doutrinárias igualmente aprovadas. Ao final, Deus responde com perguntas sobre a criação. A perspectiva se amplia: a justiça não pode ser reduzida a uma equação visível de prosperidade e culpa.", "promise": "Jó 19:25-27 expressa esperança em um defensor; a leitura cristã a relaciona à redenção, preservando as dificuldades do poema. Jó 28:28 identifica temor e afastamento do mal como orientação de sabedoria, não promessa de imunidade à dor.", "question": "Que explicação fácil precisamos abandonar ao acompanhar quem sofre?", "cross": "Jó 19:25-27; Jó 28:28; Jó 38:1-4", "art": {"file": "jo.png", "grid": [1, 1], "cell": 0, "label": "Jó em sofrimento: representação artística"}, "context_html": "O diálogo de Jó prossegue, com acusações cada vez mais fortes e a entrada de Eliú. A poesia não deve ser tratada como uma série de afirmações doutrinárias igualmente aprovadas. Ao final, Deus responde com perguntas sobre a criação. A perspectiva se amplia: a justiça não pode ser reduzida a uma equação visível de prosperidade e culpa.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-19/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 19 na BKJ Fiel 1611 (requer internet)\">Jó 19:25-27<\/a> expressa esperança em um defensor; a leitura cristã a relaciona à redenção, preservando as dificuldades do poema. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-28/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 28 na BKJ Fiel 1611 (requer internet)\">Jó 28:28<\/a> identifica temor e afastamento do mal como orientação de sabedoria, não promessa de imunidade à dor.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-19/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 19 na BKJ Fiel 1611 (requer internet)\">Jó 19:25-27<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-28/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 28 na BKJ Fiel 1611 (requer internet)\">Jó 28:28<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-38/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 38 na BKJ Fiel 1611 (requer internet)\">Jó 38:1-4<\/a>"}, {"week": 3, "title": "Da restauração ao chamado", "context": "O encerramento de Jó corrige os amigos e devolve convivência ao protagonista. A leitura retorna então a Gênesis, acompanhando Abraão, Sara, Agar, Isaque, Rebeca e o início da trajetória de Jacó. A promessa se desenvolve em famílias reais, marcadas por espera, medo, conflito e graça. Não confunda escolha divina com aprovação de cada comportamento narrado.", "promise": "Gn 12:1-3 anuncia bênção para outras famílias. O nascimento de Isaque em Gn 21 é cumprimento explícito da promessa a Abraão e Sara. Gl 3:6-9 amplia a conexão cristã com a bênção às nações.", "question": "Como a confiança pode conviver com responsabilidade pelos próprios erros?", "cross": "Gn 12:1-3; Gn 21:1-7; Gl 3:6-9", "art": {"file": "cenas-01.png", "grid": [2, 2], "cell": 0, "label": "Abraão e Sara: cena temática dos patriarcas"}, "context_html": "O encerramento de Jó corrige os amigos e devolve convivência ao protagonista. A leitura retorna então a Gênesis, acompanhando Abraão, Sara, Agar, Isaque, Rebeca e o início da trajetória de Jacó. A promessa se desenvolve em famílias reais, marcadas por espera, medo, conflito e graça. Não confunda escolha divina com aprovação de cada comportamento narrado.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 12 na BKJ Fiel 1611 (requer internet)\">Gn 12:1-3<\/a> anuncia bênção para outras famílias. O nascimento de Isaque em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 21 na BKJ Fiel 1611 (requer internet)\">Gn 21<\/a> é cumprimento explícito da promessa a Abraão e Sara. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/galatas-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gálatas 3 na BKJ Fiel 1611 (requer internet)\">Gl 3:6-9<\/a> amplia a conexão cristã com a bênção às nações.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 12 na BKJ Fiel 1611 (requer internet)\">Gn 12:1-3<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 21 na BKJ Fiel 1611 (requer internet)\">Gn 21:1-7<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/galatas-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gálatas 3 na BKJ Fiel 1611 (requer internet)\">Gl 3:6-9<\/a>"}, {"week": 4, "title": "Família, exílio e reconciliação", "context": "A casa de Jacó cresce em meio a rivalidade, e a história se concentra em José. A venda, a escravidão, a prisão e a administração no Egito formam um percurso de perdas e novas responsabilidades. Observe também Lia, Raquel, Diná e Tamar: suas experiências não são detalhes descartáveis na história dos homens da família.", "promise": "A presença prometida a Jacó em Gn 28:15 acompanha sua trajetória, mas não remove consequências. José reconhece preservação da vida em Gn 45:5-8. Essa leitura da providência não transforma a violência dos irmãos em um ato moralmente bom.", "question": "O que distingue reconciliação de simples esquecimento do que aconteceu?", "cross": "Gn 28:15; Gn 45:5-8; Gn 50:20", "art": {"file": "cenas-01.png", "grid": [2, 2], "cell": 0, "label": "Abraão e Sara: cena temática dos patriarcas"}, "context_html": "A casa de Jacó cresce em meio a rivalidade, e a história se concentra em José. A venda, a escravidão, a prisão e a administração no Egito formam um percurso de perdas e novas responsabilidades. Observe também Lia, Raquel, Diná e Tamar: suas experiências não são detalhes descartáveis na história dos homens da família.", "promise_html": "A presença prometida a Jacó em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-28/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 28 na BKJ Fiel 1611 (requer internet)\">Gn 28:15<\/a> acompanha sua trajetória, mas não remove consequências. José reconhece preservação da vida em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-45/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 45 na BKJ Fiel 1611 (requer internet)\">Gn 45:5-8<\/a>. Essa leitura da providência não transforma a violência dos irmãos em um ato moralmente bom.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-28/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 28 na BKJ Fiel 1611 (requer internet)\">Gn 28:15<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-45/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 45 na BKJ Fiel 1611 (requer internet)\">Gn 45:5-8<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-50/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 50 na BKJ Fiel 1611 (requer internet)\">Gn 50:20<\/a>"}, {"week": 5, "title": "De uma família a um povo liberto", "context": "Gênesis termina olhando além do Egito; Êxodo começa com opressão e resistência. Parteiras, mãe, irmã e filha de Faraó participam da preservação de Moisés. A libertação confronta poder econômico e religioso, culminando na Páscoa e na travessia do mar. O deserto inicia a aprendizagem de uma vida que já não é organizada pela escravidão.", "promise": "Gn 15:13-16 e Gn 50:24-25 antecipam aflição e saída. Êx 6:6-8 reafirma a aliança e Êx 12-14 narra a libertação. Na leitura cristã, a Páscoa encontra conexão com Cristo em 1Co 5:7, preservando sua primeira função na memória de Israel.", "question": "Que hábitos de dependência precisam mudar depois de uma libertação?", "cross": "Êx 6:6-8; Êx 12; 1Co 5:7", "art": {"file": "cenas-01.png", "grid": [2, 2], "cell": 1, "label": "Êxodo: cena temática de libertação"}, "context_html": "Gênesis termina olhando além do Egito; Êxodo começa com opressão e resistência. Parteiras, mãe, irmã e filha de Faraó participam da preservação de Moisés. A libertação confronta poder econômico e religioso, culminando na Páscoa e na travessia do mar. O deserto inicia a aprendizagem de uma vida que já não é organizada pela escravidão.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 15 na BKJ Fiel 1611 (requer internet)\">Gn 15:13-16<\/a> e <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-50/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 50 na BKJ Fiel 1611 (requer internet)\">Gn 50:24-25<\/a> antecipam aflição e saída. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 6 na BKJ Fiel 1611 (requer internet)\">Êx 6:6-8<\/a> reafirma a aliança e <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 12 na BKJ Fiel 1611 (requer internet)\">Êx 12-14<\/a> narra a libertação. Na leitura cristã, a Páscoa encontra conexão com Cristo em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-corintios-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Coríntios 5 na BKJ Fiel 1611 (requer internet)\">1Co 5:7<\/a>, preservando sua primeira função na memória de Israel.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 6 na BKJ Fiel 1611 (requer internet)\">Êx 6:6-8<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 12 na BKJ Fiel 1611 (requer internet)\">Êx 12<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-corintios-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Coríntios 5 na BKJ Fiel 1611 (requer internet)\">1Co 5:7<\/a>"}, {"week": 6, "title": "Aliança e presença no deserto", "context": "A lei é apresentada a um povo já libertado. Mandamentos, casos jurídicos e instruções do santuário organizam culto e convivência. O bezerro de ouro interrompe a sequência e expõe o desejo de substituir confiança por algo controlável. A renovação da aliança revela misericórdia sem eliminar responsabilidade; depois, ofertas e habilidades sustentam a construção.", "promise": "Êx 25:8 anuncia a intenção de habitar entre o povo; Êx 40 mostrará sua realização narrativa. Êx 34:6-7 descreve misericórdia e justiça. Hebreus desenvolve a relação do santuário com Cristo, sem autorizar alegorias arbitrárias de cada material.", "question": "Como uma comunidade pode reunir reverência, liberdade e responsabilidade?", "cross": "Êx 20:1-2; Êx 25:8; Êx 34:6-7", "art": {"file": "cenas-01.png", "grid": [2, 2], "cell": 2, "label": "Santuário no deserto: representação conceitual"}, "context_html": "A lei é apresentada a um povo já libertado. Mandamentos, casos jurídicos e instruções do santuário organizam culto e convivência. O bezerro de ouro interrompe a sequência e expõe o desejo de substituir confiança por algo controlável. A renovação da aliança revela misericórdia sem eliminar responsabilidade; depois, ofertas e habilidades sustentam a construção.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 25 na BKJ Fiel 1611 (requer internet)\">Êx 25:8<\/a> anuncia a intenção de habitar entre o povo; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-40/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 40 na BKJ Fiel 1611 (requer internet)\">Êx 40<\/a> mostrará sua realização narrativa. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-34/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 34 na BKJ Fiel 1611 (requer internet)\">Êx 34:6-7<\/a> descreve misericórdia e justiça. Hebreus desenvolve a relação do santuário com Cristo, sem autorizar alegorias arbitrárias de cada material.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-20/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 20 na BKJ Fiel 1611 (requer internet)\">Êx 20:1-2<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 25 na BKJ Fiel 1611 (requer internet)\">Êx 25:8<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-34/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 34 na BKJ Fiel 1611 (requer internet)\">Êx 34:6-7<\/a>"}, {"week": 7, "title": "Aproximação, pureza e expiação", "context": "A glória enche o tabernáculo, e Levítico explica diferentes formas de aproximação e serviço. Ofertas, consagração e pureza possuem funções que não devem ser confundidas. Impureza ritual nem sempre significa culpa moral. O Dia da Expiação dá destaque à purificação do santuário e do povo, preparando uma importante conexão com o argumento de Hebreus.", "promise": "A presença anunciada em Êx 25:8 é narrada em Êx 40:34-38. A leitura cristã de Lv 16 deve passar por Hb 9-10. A perspectiva adventista distingue o sacrifício suficiente de Cristo de seu ministério de intercessão e juízo.", "question": "Como reconhecer culpa real sem estigmatizar condições físicas ou sociais?", "cross": "Lv 16; Hb 9:11-14; Hb 10:10-14", "art": {"file": "cenas-01.png", "grid": [2, 2], "cell": 2, "label": "Santuário no deserto: representação conceitual"}, "context_html": "A glória enche o tabernáculo, e Levítico explica diferentes formas de aproximação e serviço. Ofertas, consagração e pureza possuem funções que não devem ser confundidas. Impureza ritual nem sempre significa culpa moral. O Dia da Expiação dá destaque à purificação do santuário e do povo, preparando uma importante conexão com o argumento de Hebreus.", "promise_html": "A presença anunciada em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 25 na BKJ Fiel 1611 (requer internet)\">Êx 25:8<\/a> é narrada em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-40/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 40 na BKJ Fiel 1611 (requer internet)\">Êx 40:34-38<\/a>. A leitura cristã de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/levitico-16/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Levítico 16 na BKJ Fiel 1611 (requer internet)\">Lv 16<\/a> deve passar por <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 9 na BKJ Fiel 1611 (requer internet)\">Hb 9-10<\/a>. A perspectiva adventista distingue o sacrifício suficiente de Cristo de seu ministério de intercessão e juízo.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/levitico-16/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Levítico 16 na BKJ Fiel 1611 (requer internet)\">Lv 16<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 9 na BKJ Fiel 1611 (requer internet)\">Hb 9:11-14<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-10/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 10 na BKJ Fiel 1611 (requer internet)\">Hb 10:10-14<\/a>"}, {"week": 8, "title": "Santidade que organiza a vida", "context": "Levítico termina relacionando santidade a justiça, calendário, terra e compromissos. Números começa organizando tribos, serviços e acampamento. A vida religiosa não fica confinada ao altar: alcança salários, colheitas, relações familiares e uso dos recursos. As instituições e sanções da antiga aliança precisam ser lidas em seu contexto histórico, não reproduzidas automaticamente.", "promise": "Lv 26 apresenta bênçãos e consequências para a comunidade da aliança. A bênção sacerdotal de Nm 6:24-26 invoca presença e paz. Ela não é uma fórmula mágica nem uma promessa de trajetória material idêntica para todos.", "question": "Que aspecto da nossa organização revela cuidado ou exclusão?", "cross": "Lv 19:18,33-34; Lv 25:23; Nm 6:24-26", "art": {"file": "cenas-01.png", "grid": [2, 2], "cell": 2, "label": "Santuário no deserto: representação conceitual"}, "context_html": "Levítico termina relacionando santidade a justiça, calendário, terra e compromissos. Números começa organizando tribos, serviços e acampamento. A vida religiosa não fica confinada ao altar: alcança salários, colheitas, relações familiares e uso dos recursos. As instituições e sanções da antiga aliança precisam ser lidas em seu contexto histórico, não reproduzidas automaticamente.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/levitico-26/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Levítico 26 na BKJ Fiel 1611 (requer internet)\">Lv 26<\/a> apresenta bênçãos e consequências para a comunidade da aliança. A bênção sacerdotal de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/numeros-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Números 6 na BKJ Fiel 1611 (requer internet)\">Nm 6:24-26<\/a> invoca presença e paz. Ela não é uma fórmula mágica nem uma promessa de trajetória material idêntica para todos.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/levitico-19/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Levítico 19 na BKJ Fiel 1611 (requer internet)\">Lv 19:18,33-34<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/levitico-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Levítico 25 na BKJ Fiel 1611 (requer internet)\">Lv 25:23<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/numeros-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Números 6 na BKJ Fiel 1611 (requer internet)\">Nm 6:24-26<\/a>"}, {"week": 9, "title": "Aprender confiança no caminho", "context": "A dedicação do santuário dá lugar à marcha e às tensões do deserto. Fome, sede, medo e disputas de liderança expõem a dificuldade de viver em comunidade. O fracasso diante da terra prometida não elimina instruções para uma vida futura. A leitura exige reconhecer consequências sem aplicar a cada sofrimento atual uma explicação punitiva simplista.", "promise": "A promessa da terra continua, mas uma geração recusa confiar e enfrenta consequências em Nm 14. A serpente de bronze de Nm 21 é retomada por Jesus em Jo 3:14-15. A ligação é explicitada pelo Novo Testamento, não apenas sugerida por semelhança visual.", "question": "Como distinguir um risco real de um medo que paralisa toda a comunidade?", "cross": "Nm 14:20-24; Sl 90:12; Jo 3:14-15", "art": {"file": "cenas-01.png", "grid": [2, 2], "cell": 2, "label": "Santuário no deserto: representação conceitual"}, "context_html": "A dedicação do santuário dá lugar à marcha e às tensões do deserto. Fome, sede, medo e disputas de liderança expõem a dificuldade de viver em comunidade. O fracasso diante da terra prometida não elimina instruções para uma vida futura. A leitura exige reconhecer consequências sem aplicar a cada sofrimento atual uma explicação punitiva simplista.", "promise_html": "A promessa da terra continua, mas uma geração re sué 4 na BKJ Fiel 1611 (requer internet)\">Js 4<\/a> guardam memória do que foi vivido; não substituem a fidelidade das novas gerações.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-30/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 30 na BKJ Fiel 1611 (requer internet)\">Dt 30:19-20<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/josue-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Josué 1 na BKJ Fiel 1611 (requer internet)\">Js 1:5-9<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/josue-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Josué 4 na BKJ Fiel 1611 (requer internet)\">Js 4:6-7<\/a>"}, {"week": 13, "title": "Herança recebida, fidelidade escolhida", "context": "Josué distribui a terra e convoca o povo a servir ao Senhor. Juízes revela que a memória e a fidelidade não passam automaticamente de uma geração para outra. As libertações ocorrem por meio de personagens diversos e falhos. O ciclo de opressão, clamor e socorro mostra tanto misericórdia quanto a persistência de escolhas destrutivas.", "promise": "Js 21:43-45 celebra a fidelidade às promessas, enquanto Js 23 mantém advertências. A tensão entre dom recebido e tarefa restante impede triunfalismo. Os libertadores de Juízes oferecem socorro situado; não são o cumprimento final de toda a esperança bíblica.", "question": "Como preservar memória sem idealizar o passado da comunidade?", "cross": "Js 21:43-45; Js 24:14-15; Jz 2:10-19", "art": {"file": "cenas-01.png", "grid": [2, 2], "cell": 3, "label": "Rute: cena temática de trabalho e cuidado"}, "context_html": "Josué distribui a terra e convoca o povo a servir ao Senhor. Juízes revela que a memória e a fidelidade não passam automaticamente de uma geração para outra. As libertações ocorrem por meio de personagens diversos e falhos. O ciclo de opressão, clamor e socorro mostra tanto misericórdia quanto a persistência de escolhas destrutivas.", "promise_html": "<a class=\  cuidado"}, "context_html": "O final de Juízes retrata violência crescente e colapso comunitário. Rute apresenta lealdade e cuidado no mesmo amplo período, enquanto Samuel nasce em meio à oração de Ana e à crise do sacerdócio. Não transforme personagens violentos em heróis sem avaliação; observe quem sofre, quem protege e quem reconhece responsabilidade.", "promise_html": "Rute entra na genealogia de Davi em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/rute-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Rute 4 na BKJ Fiel 1611 (requer internet)\">Rt 4:17-22<\/a> e na de Jesus em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/mateus-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 1 na BKJ Fiel 1611 (requer internet)\">Mt 1:5<\/a>. A ligação é genealógica explícita. O nascimento de Samuel responde à oração de Ana, sem se tornar garantia de que toda oração por filhos terá a mesma resposta.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/rute-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Rute 4 na BKJ Fiel 1611 (requer internet)\">Rt 4:13-22<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/mateus-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 1 na BKJ Fiel 1611 (requer internet)\">Mt 1:5<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 1 na BKJ Fiel 1611 (requer internet)\">1Sm 1:27-28<\/a>"}, {"week": 15, "title": "Liderança, aparência e coração", "context": "A arca é capturada, Samuel lidera e o povo pede um rei. Saul é escolhido, mas sua trajetória expõe desobediência e medo de perder prestígio. Davi surge como sucessor ainda sem ocupar o trono. Amizade e perseguição acompanham seu crescimento. Os salmos oferecem linguagem de oração, sem funcionar como cronologia exata de cada episódio.", "promise": "A advertência de 1Sm 8 mostra o custo de confiar no poder real. A unção de Davi em 1Sm 16 inicia uma expectativa que se realiza gradualmente. Ele ainda precisa esperar; a escolha não autoriza eliminar o rei por iniciativa própria.", "question": "Que diferença existe entre autoridade recebida e direito de controlar pessoas?", "cross": "1Sm 8:10-18; 1Sm 16:7; 1Sm 24:10-12", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 0, "label": "Davi com a lira: cena temática dos reis e salmos"}, "context_html": "A arca é capturada, Samuel lidera e o povo pede um rei. Saul é escolhido, mas sua trajetória expõe desobediência e medo de perder prestígio. Davi surge como sucessor ainda sem ocupar o trono. Amizade e perseguição acompanham seu crescimento. Os salmos oferecem linguagem de oração, sem funcionar como cronologia exata de cada episódio.", "promise_html": "A advertência de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 8 na BKJ Fiel 1611 (requer internet)\">1Sm 8<\/a> mostra o custo de confiar no poder real. A unção de Davi em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-16/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 16 na BKJ Fiel 1611 (requer internet)\">1Sm 16<\/a> inicia uma expectativa que se realiza gradualmente. Ele ainda precisa esperar; a escolha não autoriza eliminar o rei por iniciativa própria.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 8 na BKJ Fiel 1611 (requer internet)\">1Sm 8:10-18<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-16/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 16 na BKJ Fiel 1611 (requer internet)\">1Sm 16:7<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-24/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 24 na BKJ Fiel 1611 (requer internet)\">1Sm 24:10-12<\/a>"}, {"week": 16, "title": "Esperar sem se tornar opressor", "context": "Davi vive entre fuga, oportunidade de vingança e decisões ambíguas. Abigail impede derramamento de sangue; Saul termina sua trajetória em derrota. A ascensão de Davi não elimina conflitos. Salmos de refúgio, lamento e peregrinação ensinam a orar em situações diversas, preservando a distinção entre entrega da causa a Deus e retaliação particular.", "promise": "A promessa ligada à unção de Davi avança, mas o caminho permanece doloroso. Sl 130:5-8 ensina espera pela redenção. Na compreensão adventista, 1Sm 28 não legitima consulta aos mortos; deve ser lido com as proibições e a esperança de ressurreição.", "question": "Quem pode nos ajudar a interromper uma reação destrutiva?", "cross": "1Sm 25:32-34; Sl 130:5-8; Dt 18:10-12", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 0, "label": "Davi com a lira: cena temática dos reis e salmos"}, "context_html": "Davi vive entre fuga, oportunidade de vingança e decisões ambíguas. Abigail impede derramamento de sangue; Saul termina sua trajetória em derrota. A ascensão de Davi não elimina conflitos. Salmos de refúgio, lamento e peregrinação ensinam a orar em situações diversas, preservando a distinção entre entrega da causa a Deus e retaliação particular.", "promise_html": "A promessa ligada à unção de Davi avança, mas o caminho permanece doloroso. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-130/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 130 na BKJ Fiel 1611 (requer internet)\">Sl 130:5-8<\/a> ensina espera pela redenção. Na compreensão adventista, <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-28/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 28 na BKJ Fiel 1611 (requer internet)\">1Sm 28<\/a> não legitima consulta aos mortos; deve ser lido com as proibições e a esperança de ressurreição.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 25 na BKJ Fiel 1611 (requer internet)\">1Sm 25:32-34<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-130/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 130 na BKJ Fiel 1611 (requer internet)\">Sl 130:5-8<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-18/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 18 na BKJ Fiel 1611 (requer internet)\">Dt 18:10-12<\/a>"}, {"week": 17, "title": "Memória, culto e identidade", "context": "As genealogias de Crônicas situam famílias e serviços na história de Israel. Seu objetivo não é registrar cada geração de toda a humanidade, mas preservar continuidade e pertencimento. Os salmos reúnem inveja, saudade, lamento e louvor. A variedade permite que pessoas em diferentes situações encontrem palavras de oração sem fingir a mesma experiência emocional.", "promise": "A continuidade da casa de Davi em 1Cr 3 atravessa a perda do reino. É memória de esperança, não negação do exílio. Sl 78:4-7 liga o futuro à transmissão honesta da história, incluindo infidelidade e misericórdia.", "question": "Que pessoas e serviços nossa memória coletiva costuma esquecer?", "cross": "1Cr 3; Sl 73:16-17; Sl 78:4-7", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 0, "label": "Davi com a lira: cena temática dos reis e salmos"}, "context_html": "As genealogias de Crônicas situam famílias e serviços na história de Israel. Seu objetivo não é registrar cada geração de toda a humanidade, mas preservar continuidade e pertencimento. Os salmos reúnem inveja, saudade, lamento e louvor. A variedade permite que pessoas em diferentes situações encontrem palavras de oração sem fingir a mesma experiência emocional.", "promise_html": "A continuidade da casa de Davi em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-cronicas-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Crônicas 3 na BKJ Fiel 1611 (requer internet)\">1Cr 3<\/a> atravessa a perda do reino. É memória de esperança, não negação do exílio. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-78/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 78 na BKJ Fiel 1611 (requer internet)\">Sl 78:4-7<\/a> liga o futuro à transmissão honesta da história, incluindo infidelidade e misericórdia.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-cronicas-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Crônicas 3 na BKJ Fiel 1611 (requer internet)\">1Cr 3<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-73/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 73 na BKJ Fiel 1611 (requer internet)\">Sl 73:16-17<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-78/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 78 na BKJ Fiel 1611 (requer internet)\">Sl 78:4-7<\/a>"}, {"week": 18, "title": "Unidade e presença no centro", "context": "Davi é reconhecido por diferentes grupos e Jerusalém ganha centralidade. A condução da arca envolve crise, preparação e celebração. Os salmos ampliam a reflexão sobre criação, unidade, integridade e reinado divino. Compare os relatos paralelos sem transformar diferenças de seleção em problemas a serem apagados; cada livro organiza sua mensagem.", "promise": "Sl 89 recorda a promessa davídica em tensão com a crise. Sl 22 recebe releitura cristã nos relatos da paixão. Nem todo salmo real é uma previsão direta em cada detalhe: observe a maneira como o Novo Testamento utiliza a passagem.", "question": "Como a unidade pode conviver com verdade e responsabilidade?", "cross": "Sl 133; Sl 24:3-6; Sl 89:3-4", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 0, "label": "Davi com a lira: cena temática dos reis e salmos"}, "context_html": "Davi é reconhecido por diferentes grupos e Jerusalém ganha centralidade. A condução da arca envolve crise, preparação e celebração. Os salmos ampliam a reflexão sobre criação, unidade, integridade e reinado divino. Compare os relatos paralelos sem transformar diferenças de seleção em problemas a serem apagados; cada livro organiza sua mensagem.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-89/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 89 na BKJ Fiel 1611 (requer internet)\">Sl 89<\/a> recorda a promessa davídica em tensão com a crise. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-22/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 22 na BKJ Fiel 1611 (requer internet)\">Sl 22<\/a> recebe releitura cristã nos relatos da paixão. Nem todo salmo real é uma previsão direta em cada detalhe: observe a maneira como o Novo Testamento utiliza a passagem.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-133/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 133 na BKJ Fiel 1611 (requer internet)\">Sl 133<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-24/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 24 na BKJ Fiel 1611 (requer internet)\">Sl 24:3-6<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-89/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 89 na BKJ Fiel 1611 (requer internet)\">Sl 89:3-4<\/a>"}, {"week": 19, "title": "Promessa e responsabilidade real", "context": "Deus promete continuidade à casa de Davi. Vitórias, administração e bondade a Mefibosete mostram aspectos do reinado, mas o abuso contra Bate-Seba e Urias expõe sua corrupção. Natã não permite que a posição do rei esconda a verdade. A história exige distinguir graça, perdão, consequências e responsabilidade pelas pessoas feridas.", "promise": "2Sm 7 anuncia a continuidade dinástica e um horizonte duradouro. Lc 1:32-33 relaciona essa esperança a Jesus. O cumprimento messiânico não transforma os pecados dos reis em virtudes nem elimina o chamado à justiça no presente.", "question": "Como confrontar abuso de poder sem proteger a reputação do agressor?", "cross": "2Sm 7:12-16; Lc 1:32-33; 2Sm 12:7-13", "art": {"file": "cenas-02.png", "grid": sentam confissão e renovação, não um atalho para escapar de consequências. A fidelidade divina sustenta a esperança enquanto a família vive perdas reais. A promessa não funciona como proteção de líderes contra prestação de contas.", "question": "Que sinal concreto distingue arrependimento de defesa da própria imagem?", "cross": "Sl 32:1-5; Sl 51:10-17; 2Sm 13:19-22", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 0, "label": "Davi com a lira: cena temática dos reis e salmos"}, "context_html": "Os salmos de confissão acompanham uma história familiar em ruptura. Tamar sofre violência, a omissão agrava a crise e Absalão promove rebelião. O retorno de Davi não resolve todas as tensões. A leitura deve manter as vítimas visíveis e reconhecer que perdão não é exigência de silêncio, esquecimento ou reconciliação sem segurança.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-32/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 32 na BKJ Fiel 1611 (requer internet)\">Sl 32<\/a> e <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-51/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 51 na BKJ Fiel 1611 (requer internet)\">Sl 51<\/a> apresentam confissão e renovação, não um atalho para escapar de consequências. A fidelidade divina sustenta a esperança enquanto a família vive perdas reais. A promessa não funciona como proteção de líderes contra prestação de contas.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-32/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 32 na BKJ Fiel 1611 (requer internet)\">Sl 32:1-5<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-51/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 51 na BKJ Fiel 1611 (requer internet)\">Sl 51:10-17<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-13/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 13 na BKJ Fiel 1611 (requer internet)\">2Sm 13:19-22<\/a>"}, {"week": 21, "title": "Preparar o futuro com humildade", "context": "A retrospectiva do reinado inclui cânticos, crises e organização do serviço. Davi reconhece limites e reúne recursos para uma obra que Salomão realizará. Porteiros, músicos e administradores recebem lugar na narrativa. O encerramento recorda que até aquilo que oferecemos foi antes recebido, enfraquecendo o orgulho ligado à generosidade.", "promise": "1Cr 28:6-10 liga a tarefa de Salomão à fidelidade. Sl 110 é retomado em Hb 7 para explicar o sacerdócio de Cristo. A conexão não depende de identificar todos os detalhes do rei histórico com a atuação de Jesus.", "question": "Como servir a um futuro que talvez não traga reconhecimento pessoal?", "cross": "1Cr 29:14; Sl 110:4; Hb 7:17", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 0, "label": "Davi com a lira: cena temática dos reis e salmos"}, "context_html": "A retrospectiva do reinado inclui cânticos, crises e organização do serviço. Davi reconhece limites e reúne recursos para uma obra que Salomão realizará. Porteiros, músicos e administradores recebem lugar na narrativa. O encerramento recorda que até aquilo que oferecemos foi antes recebido, enfraquecendo o orgulho ligado à generosidade.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-cronicas-28/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Crônicas 28 na BKJ Fiel 1611 (requer internet)\">1Cr 28:6-10<\/a> liga a tarefa de Salomão à fidelidade. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-110/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 110 na BKJ Fiel 1611 (requer internet)\">Sl 110<\/a> é retomado em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 7 na BKJ Fiel 1611 (requer internet)\">Hb 7<\/a> para explicar o sacerdócio de Cristo. A conexão não depende de identificar todos os detalhes do rei histórico com a atuação de Jesus.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-cronicas-29/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Crônicas 29 na BKJ Fiel 1611 (requer internet)\">1Cr 29:14<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-110/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 110 na BKJ Fiel 1611 (requer internet)\">Sl 110:4<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 7 na BKJ Fiel 1611 (requer internet)\">Hb 7:17<\/a>"}, {"week": 22, "title": "Sabedoria, palavra e amor", "context": "Salomão assume o trono e pede discernimento. Salmos, Cantares e Provérbios oferecem gêneros diferentes: oração, poesia amorosa e orientação sapiencial. Não os leia como um único tipo de texto. A sabedoria precisa ser testada em justiça, fidelidade e relações; conhecer máximas não garante que seu leitor ou autor sempre as pratique.", "promise": "1Rs 3:5-14 apresenta o pedido e a resposta divina a Salomão. Sl 72 descreve um ideal de governo justo, maior que a realização de um rei falho. Sl 119 valoriza orientação, mas não promete que o justo nunca enfrentará aflição.", "question": "Como diferenciar uma promessa de uma observação geral de sabedoria?", "cross": "1Rs 3:9-12; Sl 72:1-4; Pv 3:5-6", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 0, "label": "Davi com a lira: cena temática dos reis e salmos"}, "context_html": "Salomão assume o trono e pede discernimento. Salmos, Cantares e Provérbios oferecem gêneros diferentes: oração, poesia amorosa e orientação sapiencial. Não os leia como um único tipo de texto. A sabedoria precisa ser testada em justiça, fidelidade e relações; conhecer máximas não garante que seu leitor ou autor sempre as pratique.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 3 na BKJ Fiel 1611 (requer internet)\">1Rs 3:5-14<\/a> apresenta o pedido e a resposta divina a Salomão. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-72/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 72 na BKJ Fiel 1611 (requer internet)\">Sl 72<\/a> descreve um ideal de governo justo, maior que a realização de um rei falho. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-119/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 119 na BKJ Fiel 1611 (requer internet)\">Sl 119<\/a> valoriza orientação, mas não promete que o justo nunca enfrentará aflição.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 3 na BKJ Fiel 1611 (requer internet)\">1Rs 3:9-12<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-72/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 72 na BKJ Fiel 1611 (requer internet)\">Sl 72:1-4<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/proverbios-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Provérbios 3 na BKJ Fiel 1611 (requer internet)\">Pv 3:5-6<\/a>"}, {"week": 23, "title": "O caráter nas pequenas decisões", "context": "Provérbios relaciona desejos, companhias, fala, trabalho e justiça. Suas máximas oferecem padrões de discernimento, não garantias mecânicas de resultado. Leia conselhos aparentemente opostos considerando a situação a que respondem. A perspectiva de Jó e Eclesiastes impede concluir que toda pobreza é culpa e que toda prosperidade prova aprovação divina.", "promise": "A linguagem de caminho e colheita mostra consequências frequentes das escolhas. Isso não equivale a prometer controle sobre todos os acontecimentos. O fruto do Espírito em Gl 5:22-23 oferece uma conexão cristã de caráter, não um cumprimento preditivo de cada provérbio.", "question": "Qual hábito pequeno está formando o caráter que teremos amanhã?", "cross": "Pv 4:23; Pv 15:1; Pv 18:13; Gl 5:22-23", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 0, "label": "Davi com a lira: cena temática dos reis e salmos"}, "context_html": "Provérbios relaciona desejos, companhias, fala, trabalho e justiça. Suas máximas oferecem padrões de discernimento, não garantias mecânicas de resultado. Leia conselhos aparentemente opostos considerando a situação a que respondem. A perspectiva de Jó e Eclesiastes impede concluir que toda pobreza é culpa e que toda prosperidade prova aprovação divina.", "promise_html": "A linguagem de caminho e colheita mostra consequências frequentes das escolhas. Isso não equivale a prometer controle sobre todos os acontecimentos. O fruto do Espírito em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/galatas-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gálatas 5 na BKJ Fiel 1611 (requer internet)\">Gl 5:22-23<\/a> oferece uma conexão cristã de caráter, não um cumprimento preditivo de cada provérbio.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/proverbios-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Provérbios 4 na BKJ Fiel 1611 (requer internet)\">Pv 4:23<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/proverbios-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Provérbios 15 na BKJ Fiel 1611 (requer internet)\">Pv 15:1<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/proverbios-18/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Provérbios 18 na BKJ Fiel 1611 (requer internet)\">Pv 18:13<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/galatas-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gálatas 5 na BKJ Fiel 1611 (requer internet)\">Gl 5:22-23<\/a>"}, {"week": 24, "title": "O templo e a vida que o cerca", "context": "A construção e dedicação do templo mobilizam riqueza, trabalho e oração. Salomão reconhece que Deus não cabe no edifício. Os salmos de louvor lembram cuidado dos frágeis e grandeza do Criador. As advertências após a dedicação impedem pensar que uma estrutura religiosa torna a comunidade automaticamente fiel ou segura.", "promise": "1Rs 8 retoma a promessa davídica na dedicação. 2Cr 7 associa resposta divina a arrependimento e fidelidade de Israel. A aplicação atual não transforma um país moderno em Israel nem garante prosperidade a quem financia uma construção religiosa.", "question": "Nosso investimento em estruturas corresponde ao cuidado das pessoas?", "cross": "1Rs 8:27,41-43; 2Cr 7:14; Sl 146:7-9", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 1, "label": "Templo: representação conceitual da monarquia"}, "context_html": "A construção e dedicação do templo mobilizam riqueza, trabalho e oração. Salomão reconhece que Deus não cabe no edifício. Os salmos de louvor lembram cuidado dos frágeis e grandeza do Criador. As advertências após a dedicação impedem pensar que uma estrutura religiosa torna a comunidade automaticamente fiel ou segura.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 8 na BKJ Fiel 1611 (requer internet)\">1Rs 8<\/a> retoma a promessa davídica na dedicação. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 7 na BKJ Fiel 1611 (requer internet)\">2Cr 7<\/a> associa resposta divina a arrependimento e fidelidade de Israel. A aplicação atual não transforma um país moderno em Israel nem garante prosperidade a quem financia uma construção religiosa.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 8 na BKJ Fiel 1611 (requer internet)\">1Rs 8:27,41-43<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 7 na BKJ Fiel 1611 (requer internet)\">2Cr 7:14<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-146/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 146 na BKJ Fiel 1611 (requer internet)\">Sl 146:7-9<\/a>"}, {"week": 25, "title": "Quando o brilho esconde fragilidade", "context": "Provérbios e Eclesiastes confrontam limites humanos enquanto a história de Salomão caminha para desvio e divisão. O sucesso não produz maturidade automática. A ruptura do reino tem causas políticas e espirituais; lideranças que desprezam pedidos legítimos e manipulam o culto aprofundam a crise. Sabedoria precisa ser vivida, não apenas admirada.", "promise": "A promessa de 2Sm 7 continua sendo referência, mas os reis são responsabilizados por sua conduta. Eclesiastes não anuncia prosperidade ilimitada: convida a reconhecer o Criador e receber a vida sem transformar conquistas em absolutos.", "question": "Que custo oculto pode acompanhar uma conquista aparentemente brilhante?", "cross": "Ec 12:13-14; 1Rs 11:9-13; 1Rs 12:6-14", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 1, "label": "Templo: representação conceitual da monarquia"}, "context_html": "Provérbios e Eclesiastes confrontam limites humanos enquanto a história de Salomão caminha para desvio e divisão. O sucesso não produz maturidade automática. A ruptura do reino tem causas políticas e espirituais; lideranças que desprezam pedidos legítimos e manipulam o culto aprofundam a crise. Sabedoria precisa ser vivida, não apenas admirada.", "promise_html": "A promessa de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 7 na BKJ Fiel 1611 (requer internet)\">2Sm 7<\/a> continua sendo referência, mas os reis são responsabilizados por sua conduta. Eclesiastes não anuncia prosperidade ilimitada: convida a reconhecer o Criador e receber a vida sem transformar conquistas em absolutos.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/eclesiastes-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Eclesiastes 12 na BKJ Fiel 1611 (requer internet)\">Ec 12:13-14<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 11 na BKJ Fiel 1611 (requer internet)\">1Rs 11:9-13<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 12 na BKJ Fiel 1611 (requer internet)\">1Rs 12:6-14<\/a>"}, {"week": 26, "title": "Profetas diante do poder", "context": "Os reinos seguem trajetórias distintas de reforma, instabilidade e abuso. Elias confronta a idolatria, mas também enfrenta esgotamento e recebe cuidado. A vinha de Nabote expõe injustiça institucional. Micaías recusa adaptar sua mensagem ao desejo do rei. A palavra profética não existe para confirmar automaticamente decisões de quem governa.", "promise": "1Rs 17-19 mostra provisão e presença em situações específicas. Não converta milagres em garantias universais de resultado. A preservação de Joás em 2Cr 22-23 mantém continuidade dinástica, com participação decisiva de pessoas cujo serviço foi discreto.", "question": "Como distinguir uma palavra fiel de uma mensagem feita para agradar?", "cross": "1Rs 19:5-8; 1Rs 21:19; 1Rs 22:14", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 1, "label": "Templo: representação conceitual da monarquia"}, "context_html": "Os reinos seguem trajetórias distintas de reforma, instabilidade e abuso. Elias confronta a idolatria, mas também enfrenta esgotamento e recebe cuidado. A vinha de Nabote expõe injustiça institucional. Micaías recusa adaptar sua mensagem ao desejo do rei. A palavra profética não existe para confirmar automaticamente decisões de quem governa.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-17/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 17 na BKJ Fiel 1611 (requer internet)\">1Rs 17-19<\/a> mostra provisão e presença em situações específicas. Não converta milagres em garantias universais de resultado. A preservação de Joás em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-22/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 22 na BKJ Fiel 1611 (requer internet)\">2Cr 22-23<\/a> mantém continuidade dinástica, com participação decisiva de pessoas cujo serviço foi discreto.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-19/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 19 na BKJ Fiel 1611 (requer internet)\">1Rs 19:5-8<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 21 na BKJ Fiel 1611 (requer internet)\">1Rs 21:19<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-22/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 22 na BKJ Fiel 1611 (requer internet)\">1Rs 22:14<\/a>"}, {"week": 27, "title": "Graça e justiça além das fronteiras", "context": "Eliseu sucede Elias e atende necessidades de famílias e governantes. Naamã, estrangeiro, recebe cura; Jonas se incomoda com a misericórdia para Nínive. Reis prosperam e falham, mostrando que êxito político não garante fidelidade. O conjunto confronta a ideia de que a graça pertence exclusivamente a um grupo ou pode ser vendida.", "promise": "A restauração em 2Rs 5 é um ato de graça, não recompensa por superioridade nacional. Jonas mostra que a resposta humana pode alterar o desfecho anunciado de juízo. Profecia de advertência chama ao retorno; não é sempre uma previsão incondicional.", "question": "Desejamos para os outros a mesma misericórdia que pedimos para nós?", "cross": "2Rs 5:14-16; Jn 3:10; Jn 4:10-11", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 1, "label": "Templo: representação conceitual da monarquia"}, "context_html": "Eliseu sucede Elias e atende necessidades de famílias e governantes. Naamã, estrangeiro, recebe cura; Jonas se incomoda com a misericórdia para Nínive. Reis prosperam e falham, mostrando que êxito político não garante fidelidade. O conjunto confronta a ideia de que a graça pertence exclusivamente a um grupo ou pode ser vendida.", "promise_html": "A restauração em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-reis-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Reis 5 na BKJ Fiel 1611 (requer internet)\">2Rs 5<\/a> é um ato de graça, não recompensa por superioridade nacional. Jonas mostra que a resposta humana pode alterar o desfecho anunciado de juízo. Profecia de advertência chama ao retorno; não é sempre uma previsão incondicional.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-reis-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Reis 5 na BKJ Fiel 1611 (requer internet)\">2Rs 5:14-16<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jonas-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jonas 3 na BKJ Fiel 1611 (requer internet)\">Jn 3:10<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jonas-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jonas 4 na BKJ Fiel 1611 (requer internet)\">Jn 4:10-11<\/a>"}, {"week": 28, "title": "Religião confrontada pela justiça", "context": "Isaías, Amós e Miqueias expõem a distância entre culto e vida. O cenário inclui pressões imperiais e a queda do reino do norte. Esperanças de um governante justo convivem com denúncias de exploração. Não transforme os profetas apenas em fontes de previsões; eles chamam sua própria geração a ouvir, arrepender-se e cuidar do vulnerável.", "promise": "Is 9 e Is 11 alimentam a esperança davídica. Mq 5:2 é retomado em Mt 2:5-6 em relação a Belém. A leitura cristã do cumprimento não elimina o apelo presente de Mq 6:8 por justiça, misericórdia e humildade.", "question": "Que injustiça o nosso costume religioso pode estar deixando invisível?", "cross": "Is 1:16-18; Am 5:24; Mq 6:8; Mt 2:5-6", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 1, "label": "Templo: representação conceitual da monarquia"}, "context_html": "Isaías, Amós e Miqueias expõem a distância entre culto e vida. O cenário inclui pressões imperiais e a queda do reino do norte. Esperanças de um governante justo convivem com denúncias de exploração. Não transforme os profetas apenas em fontes de previsões; eles chamam sua própria geração a ouvir, arrepender-se e cuidar do vulnerável.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 9 na BKJ Fiel 1611 (requer internet)\">Is 9<\/a> e <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 11 na BKJ Fiel 1611 (requer internet)\">Is 11<\/a> alimentam a esperança davídica. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/miqueias-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Miquéias 5 na BKJ Fiel 1611 (requer internet)\">Mq 5:2<\/a> é retomado em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/mateus-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 2 na BKJ Fiel 1611 (requer internet)\">Mt 2:5-6<\/a> em relação a Belém. A leitura cristã do cumprimento não elimina o apelo presente de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/miqueias-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Miquéias 6 na BKJ Fiel 1611 (requer internet)\">Mq 6:8<\/a> por justiça, misericórdia e humildade.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 1 na BKJ Fiel 1611 (requer internet)\">Is 1:16-18<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/amos-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Amós 5 na BKJ Fiel 1611 (requer internet)\">Am 5:24<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/miqueias-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Miquéias 6 na BKJ Fiel 1611 (requer internet)\">Mq 6:8<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/mateus-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 2 na BKJ Fiel 1611 (requer internet)\">Mt 2:5-6<\/a>"}, {"week": 29, "title": "Impérios, reforma e amor ferido", "context": "Oráculos contra nações mostram que nenhum poder está acima da justiça. Ezequias promove reforma, enquanto Oseias descreve a aliança em imagens de amor ferido e retorno. As promessas precisam ser lidas em seu contexto comunitário. Metáforas conjugais não autorizam controle abusivo ou exigência de permanência em situações de violência.", "promise": "Os 14:1-4 anuncia cura da infidelidade em resposta ao retorno. Is 25:8 aponta para vitória sobre a morte, retomada em 1Co 15:54. A ligação cristã amplia a esperança sem transformar todo detalhe profético em descrição do mesmo momento futuro.", "question": "Como manter esperança sem usar promessas para evitar responsabilidade?", "cross": "Os 14:1-4; Is 25:8; 1Co 15:54", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 1, "label": "Templo: representação conceitual da monarquia"}, "context_html": "Oráculos contra nações mostram que nenhum poder está acima da justiça. Ezequias promove reforma, enquanto Oseias descreve a aliança em imagens de amor ferido e retorno. As promessas precisam ser lidas em seu contexto comunitário. Metáforas conjugais não autorizam controle abusivo ou exigência de permanência em situações de violência.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/oseias-14/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Oséias 14 na BKJ Fiel 1611 (requer internet)\">Os 14:1-4<\/a> anuncia cura da infidelidade em resposta ao retorno. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 25 na BKJ Fiel 1611 (requer internet)\">Is 25:8<\/a> aponta para vitória sobre a morte, retomada em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-corintios-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Coríntios 15 na BKJ Fiel 1611 (requer internet)\">1Co 15:54<\/a>. A ligação cristã amplia a esperança sem transformar todo detalhe profético em descrição do mesmo momento futuro.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/oseias-14/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Oséias 14 na BKJ Fiel 1611 (requer internet)\">Os 14:1-4<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 25 na BKJ Fiel 1611 (requer internet)\">Is 25:8<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-corintios-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Coríntios 15 na BKJ Fiel 1611 (requer internet)\">1Co 15:54<\/a>"}, {"week": 30, "title": "Consolo e o serviço do Servo", "context": "A ameaça assíria e a oração de Ezequias são lidas em paralelo. Depois, o horizonte de Isaías se amplia para consolo, retorno e missão do Servo. A grandeza do Criador contrasta com ídolos fabricados. A linguagem profética combina situações históricas, poesia e esperança; não deve ser reduzida a um calendário linear de acontecimentos.", "promise": "Is 40 consola; Is 44-45 menciona Ciro; Is 52-53 descreve o Servo sofredor. At 8:30-35 relaciona o Servo a Jesus. Distinga retorno histórico, releitura messiânica e esperança final, em vez de fundir todos os horizontes.", "question": "Como o serviço de Cristo muda nossa maneira de exercer poder?", "cross": "Is 40:28-31; Is 53; At 8:30-35", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 1, "label": "Templo: representação conceitual da monarquia"}, "context_html": "A ameaça assíria e a oração de Ezequias são lidas em paralelo. Depois, o horizonte de Isaías se amplia para consolo, retorno e missão do Servo. A grandeza do Criador contrasta com ídolos fabricados. A linguagem profética combina situações históricas, poesia e esperança; não deve ser reduzida a um calendário linear de acontecimentos.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-40/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 40 na BKJ Fiel 1611 (requer internet)\">Is 40<\/a> consola; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-44/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 44 na BKJ Fiel 1611 (requer internet)\">Is 44-45<\/a> menciona Ciro; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-52/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 52 na BKJ Fiel 1611 (requer internet)\">Is 52-53<\/a> descreve o Servo sofredor. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/atos-dos-apostolos-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Atos dos Apóstolos 8 na BKJ Fiel 1611 (requer internet)\">At 8:30-35<\/a> relaciona o Servo a Jesus. Distinga retorno histórico, releitura messiânica e esperança final, em vez de fundir todos os horizontes.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-40/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 40 na BKJ Fiel 1611 (requer internet)\">Is 40:28-31<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-53/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 53 na BKJ Fiel 1611 (requer internet)\">Is 53<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/atos-dos-apostolos-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Atos dos Apóstolos 8 na BKJ Fiel 1611 (requer internet)\">At 8:30-35<\/a>"}, {"week": 31, "title": "Renovação que alcança coração e justiça", "context": "Isaías encerra com convite, justiça, sábado e nova criação. Os relatos de Ezequias e Manassés mostram livramento, orgulho e retorno. Naum confronta Nínive, e Josias responde à lei reencontrada. A mudança precisa ultrapassar cerimônias e edifícios: ela deve alcançar relações, prioridades e disposição de ouvir a verdade.", "promise": "Is 61 é aplicado por Jesus à sua missão em Lc 4:16-21. Is 65-66 dialoga com Ap 21-22, com diferenças que precisam ser respeitadas. A esperança de restauração convoca justiça presente, especialmente em Is 58.", "question": "Que mudança visível acompanha nossa resposta à palavra?", "cross": "Is 58:6-14; Lc 4:16-21; 2Rs 22:11-13", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 1, "label": "Templo: representação conceitual da monarquia"}, "context_html": "Isaías encerra com convite, justiça, sábado e nova criação. Os relatos de Ezequias e Manassés mostram livramento, orgulho e retorno. Naum confronta Nínive, e Josias responde à lei reencontrada. A mudança precisa ultrapassar cerimônias e edifícios: ela deve alcançar relações, prioridades e disposição de ouvir a verdade.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-61/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 61 na BKJ Fiel 1611 (requer internet)\">Is 61<\/a> é aplicado por Jesus à sua missão em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 4 na BKJ Fiel 1611 (requer internet)\">Lc 4:16-21<\/a>. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-65/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 65 na BKJ Fiel 1611 (requer internet)\">Is 65-66<\/a> dialoga com <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/apocalipse-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Apocalipse 21 na BKJ Fiel 1611 (requer internet)\">Ap 21-22<\/a>, com diferenças que precisam ser respeitadas. A esperança de restauração convoca justiça presente, especialmente em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-58/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 58 na BKJ Fiel 1611 (requer internet)\">Is 58<\/a>.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-58/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 58 na BKJ Fiel 1611 (requer internet)\">Is 58:6-14<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 4 na BKJ Fiel 1611 (requer internet)\">Lc 4:16-21<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-reis-22/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Reis 22 na BKJ Fiel 1611 (requer internet)\">2Rs 22:11-13<\/a>"}, {"week": 32, "title": "A palavra que confronta a falsa paz", "context": "Sofonias e Jeremias anunciam juízo, retorno e esperança. A vocação de Jeremias não elimina medo, lamento e conflito. O templo é confrontado quando serve de amuleto para uma sociedade injusta. Sinais como o vaso do oleiro mostram que a resposta humana importa; a advertência não deve ser lida como fatalismo inevitável em todos os casos.", "promise": "Jr 1:8 promete presença ao profeta, não ausência de oposição. Jr 18:7-10 explicita a relação entre anúncio e resposta. A promessa precisa ser distinguida de qualquer aplicação pessoal que imponha ao leitor a mesma vocação de Jeremias.", "question": "Queremos ouvir a verdade mesmo quando ela desfaz uma falsa tranquilidade?", "cross": "Jr 1:6-9; Jr 7:3-7; Jr 18:7-10", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 2, "label": "Exílio: cena temática de perda e esperança"}, "context_html": "Sofonias e Jeremias anunciam juízo, retorno e esperança. A vocação de Jeremias não elimina medo, lamento e conflito. O templo é confrontado quando serve de amuleto para uma sociedade injusta. Sinais como o vaso do oleiro mostram que a resposta humana importa; a advertência não deve ser lida como fatalismo inevitável em todos os casos.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jeremias-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jeremias 1 na BKJ Fiel 1611 (requer internet)\">Jr 1:8<\/a> promete presença ao profeta, não ausência de oposição. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jeremias-18/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jeremias 18 na BKJ Fiel 1611 (requer internet)\">Jr 18:7-10<\/a> explicita a relação entre anúncio e resposta. A promessa precisa ser distinguida de qualquer aplicação pessoal que imponha ao leitor a mesma vocação de Jeremias.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jeremias-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jeremias 1 na BKJ Fiel 1611 (requer internet)\">Jr 1:6-9<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jeremias-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jeremias 7 na BKJ Fiel 1611 (requer internet)\">Jr 7:3-7<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jeremias-18/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jeremias 18 na BKJ Fiel 1611 (requer internet)\">Jr 18:7-10<\/a>"}, {"week": 33, "title": "Esperança quando a cidade cai", "context": "Jeremias enfrenta falsas promessas, prisão e a queda de Jerusalém. A compra do campo aponta para futuro em meio ao cerco, enquanto a nova aliança anuncia transformação interior. Os salmos de lamento dão voz à ruína. Observe Ebede-Meleque: seu cuidado concreto contrasta com autoridades que tentam silenciar o profeta.", "promise": "Jr 29:10-14 se dirige a uma comunidade em longa espera. Jr 31:31-34 é retomado em Hb 8 como promessa de nova aliança. O retorno anunciado não autoriza prometer realização imediata de todo projeto individual.", "question": "Que ação de esperança podemos realizar sem negar a gravidade da crise?", "cross": "Jr 29:4-14; Jr 31:31-34; Hb 8:8-12", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 2, "label": "Exílio: cena temática de perda e esperança"}, "context_html": "Jeremias enfrenta falsas promessas, prisão e a queda de Jerusalém. A compra do campo aponta para futuro em meio ao cerco, enquanto a nova aliança anuncia transformação interior. Os salmos de lamento dão voz à ruína. Observe Ebede-Meleque: seu cuidado concreto contrasta com autoridades que tentam silenciar o profeta.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jeremias-29/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jeremias 29 na BKJ Fiel 1611 (requer internet)\">Jr 29:10-14<\/a> se dirige a uma comunidade em longa espera. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jeremias-31/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jeremias 31 na BKJ Fiel 1611 (requer internet)\">Jr 31:31-34<\/a> é retomado em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 8 na BKJ Fiel 1611 (requer internet)\">Hb 8<\/a> como promessa de nova aliança. O retorno anunciado não autoriza prometer realização imediata de todo projeto individual.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jeremias-29/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jeremias 29 na BKJ Fiel 1611 (requer internet)\">Jr 29:4-14<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jeremias-31/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jeremias 31 na BKJ Fiel 1611 (requer internet)\">Jr 31:31-34<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 8 na BKJ Fiel 1611 (requer internet)\">Hb 8:8-12<\/a>"}, {"week": 34, "title": "Lamento que permanece diante de Deus", "context": "Habacuque pergunta como a justiça pode operar por meio de poderes violentos. Jeremias acompanha os sobreviventes e anuncia juízo às nações. Lamentações transforma ruína em poesia de dor, memória e pedido de restauração. O conjunto ensina a não silenciar perguntas nem forçar um encerramento emocional que a experiência ainda não alcançou.", "promise": "Hc 2:4 é retomado no Novo Testamento ao falar da fé. Lm 3:22-24 recorda misericórdia em meio à perda. São fundamentos de esperança, não garantias de que a colheita voltará imediatamente ou de que o luto será breve.", "question": "Como oferecer esperança sem exigir que alguém pare de lamentar?", "cross": "Hc 2:4; Hc 3:17-19; Lm 3:22-24", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 2, "label": "Exílio: cena temática de perda e esperança"}, "context_html": "Habacuque pergunta como a justiça pode operar por meio de poderes violentos. Jeremias acompanha os sobreviventes e anuncia juízo às nações. Lamentações transforma ruína em poesia de dor, memória e pedido de restauração. O conjunto ensina a não silenciar perguntas nem forçar um encerramento emocional que a experiência ainda não alcançou.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/habacuque-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Habacuque 2 na BKJ Fiel 1611 (requer internet)\">Hc 2:4<\/a> é retomado no Novo Testamento ao falar da fé. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lamentacoes-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lamentações 3 na BKJ Fiel 1611 (requer internet)\">Lm 3:22-24<\/a> recorda misericórdia em meio à perda. São fundamentos de esperança, não garantias de que a colheita voltará imediatamente ou de que o luto será breve.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/habacuque-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Habacuque 2 na BKJ Fiel 1611 (requer internet)\">Hc 2:4<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/habacuque-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Habacuque 3 na BKJ Fiel 1611 (requer internet)\">Hc 3:17-19<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lamentacoes-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lamentações 3 na BKJ Fiel 1611 (requer internet)\">Lm 3:22-24<\/a>"}, {"week": 35, "title": "Deus encontra seu povo no exílio", "context": "Ezequiel recebe visões fora de Jerusalém. O profeta denuncia idolatria e falsa segurança, mas também anuncia novo coração. A linguagem simbólica, por vezes severa, exige contexto e cuidado. Não transforme metáforas em justificativas de violência doméstica, nem visões em descrições técnicas de máquinas ou acontecimentos modernos.", "promise": "Ez 11:19-20 anuncia transformação interior. Ez 18:21-32 insiste na possibilidade de retorno e na responsabilidade pessoal. A esperança não depende apenas de mudar de lugar: inclui mudança na resposta a Deus e ao próximo.", "question": "Que transformação interior tornaria um recomeço mais verdadeiro?", "cross": "Ez 11:19-20; Ez 18:30-32; Ez 20:12", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 2, "label": "Exílio: cena temática de perda e esperança"}, "context_html": "Ezequiel recebe visões fora de Jerusalém. O profeta denuncia idolatria e falsa segurança, mas também anuncia novo coração. A linguagem simbólica, por vezes severa, exige contexto e cuidado. Não transforme metáforas em justificativas de violência doméstica, nem visões em descrições técnicas de máquinas ou acontecimentos modernos.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ezequiel-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ezequiel 11 na BKJ Fiel 1611 (requer internet)\">Ez 11:19-20<\/a> anuncia transformação interior. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ezequiel-18/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ezequiel 18 na BKJ Fiel 1611 (requer internet)\">Ez 18:21-32<\/a> insiste na possibilidade de retorno e na responsabilidade pessoal. A esperança não depende apenas de mudar de lugar: inclui mudança na resposta a Deus e ao próximo.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ezequiel-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ezequiel 11 na BKJ Fiel 1611 (requer internet)\">Ez 11:19-20<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ezequiel-18/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ezequiel 18 na BKJ Fiel 1611 (requer internet)\">Ez 18:30-32<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ezequiel-20/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ezequiel 20 na BKJ Fiel 1611 (requer internet)\">Ez 20:12<\/a>"}, {"week": 36, "title": "Do juízo à vida renovada", "context": "A denúncia alcança Jerusalém, Tiro, Egito e lideranças que abandonam o rebanho. Ossos secos representam a condição desesperada d 34:11-16<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ezequiel-37/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ezequiel 37 na BKJ Fiel 1611 (requer internet)\">Ez 37:11-14<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-10/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 10 na BKJ Fiel 1611 (requer internet)\">Jo 10:11-16<\/a>"}, {"week": 37, "title": "Presença, Espírito e juízo", "context": "Ezequiel termina com rio de vida e a presença do Senhor. Joel anuncia retorno e Espírito. Daniel apresenta fidelidade sob impérios e visões de reinos julgados por Deus. A ordem ajustada do plano coloca Daniel 7-8 antes da queda de Belsazar. As interpretações proféticas devem ser identificadas como tais, sem confundi-las com palavras explícitas do texto.", "promise": "At 2 retoma Jl 2 no Pentecostes. Na interpretação adventista, Dn 8:14, em conexão com Dn 9, fundamenta a compreensão do juízo e do ministério celestial, incluindo 1844. O número do ano não aparece no versículo; resulta dessa leitura profética e não fixa a volta de Jesus.", "question": "Como estudar profecia de modo que cresçam confiança, humildade e fidelidade?", "cross": "Jl 2:28-32; At 2:16-21; Dn 7:13-14; Dn 8:14", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 2, "label": "Exílio: cena temática de perda e esperança"}, "context_html": "Ezequiel termina com rio de vida e a presença do Senhor. Joel anuncia retorno e Espírito. Daniel apresenta fidelidade sob impérios e visões de reinos julgados por Deus. A ordem ajustada do plano coloca <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/daniel-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Daniel 7 na BKJ Fiel 1611 (requer internet)\">Daniel 7-8<\/a> antes da queda de Belsazar. As interpretações proféticas devem ser identificadas como tais, sem confundi-las com palavras explícitas do texto.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/atos-dos-apostolos-2/\" target=\"_blank\" \" rel=\"noopener\" title=\"Abrir Ageu 2 na BKJ Fiel 1611 (requer internet)\">Ag 2:4-5<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/zacarias-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Zacarias 9 na BKJ Fiel 1611 (requer internet)\">Zc 9:9<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/daniel-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Daniel 12 na BKJ Fiel 1611 (requer internet)\">Dn 12:2-3<\/a>"}, {"week": 39, "title": "Palavra, justiça e continuidade", "context": "Ester termina com memória do livramento. Esdras e Neemias reorganizam ensino, cidade e culto, enfrentando também desigualdade interna. Malaquias denuncia deslealdade e aparência religiosa. A reconstrução de muros precisa acompanhar a reconstrução de relações. Medidas específicas de uma comunidade antiga não devem ser reproduzidas como discriminação contra estrangeiros hoje.", "promise": "Ml 3:1 e Ml 4:5-6 preparam uma expectativa de mensageiro; os Evangelhos relacionam João Batista à preparação do caminho. O retorno do exílio é significativo, mas não encerra a necessidade de renovação e da esperança messiânica.", "question": "Que manutenção espiritual e social precisa continuar depois de uma reforma?", "cross": "Ed 7:10; Ne 8:8-10; Ml 3:1; Lc 1:16-17", "art": {"file": "cenas-02.png", "grid": [2, 2], "cell": 3, "label": "Reconstrução: cena temática do retorno"}, "context_html": "Ester termina com memória do livramento. Esdras e Neemias reorganizam ensino, cidade e culto, enfrentando também desigualdade interna. Malaquias denuncia deslealdade e aparência religiosa. A reconstrução de muros precisa acompanhar a reconstrução de relações. Medidas específicas de uma comunidade antiga não devem ser reproduzidas como discriminação contra estrangeiros hoje.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/malaquias-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Malaquias 3 na BKJ Fiel 1611 (requer internet)\">Ml 3:1<\/a> e <a class=\"bib
