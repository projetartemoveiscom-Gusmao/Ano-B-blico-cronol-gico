 false, "title": "Fidelidade na escolha do caminho", "nodes": [{"ref": "Dt 11", "text": "Bênção e responsabilidade são colocadas diante do povo.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 11 na BKJ Fiel 1611 (requer internet)\">Dt 11<\/a>"}, {"ref": "Dt 12", "text": "O culto é orientado em contraste com práticas locais.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 12 na BKJ Fiel 1611 (requer internet)\">Dt 12<\/a>"}, {"ref": "Dt 13", "text": "A sedução religiosa é avaliada pela fidelidade a Deus.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-13/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 13 na BKJ Fiel 1611 (requer internet)\">Dt 13<\/a>"}], "explain": "Nem todo sinal impressionante autentica uma mensagem. As sanções antigas não legitimam coerção religiosa privada no presente.", "question": "Avalio uma mensagem pelo espetáculo ou pelo conteúdo?", "action": "Confira uma afirmação religiosa no contexto bíblico.", "cross": "Dt 13:1-4", "links": [{"label": "Deuteronômio 11", "url": "https://bkjfiel.com.br/deuteronomio-11/"}, {"label": "Deuteronômio 12", "url": "https://bkjfiel.com.br/deuteronomio-12/"}, {"label": "Deuteronômio 13", "url": "https://bkjfiel.com.br/deuteronomio-13/"}], "explain_html": "Nem todo sinal impressionante autentica uma mensagem. As sanções antigas não legitimam coerção religiosa privada no presente.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-13/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 13 na BKJ Fiel 1611 (requer internet)\">Dt 13:1-4<\/a>"}, {"day": 75, "week": 11, "weekday": 5, "reading": "Deuteronômio 14-16", "passages": [["Deuteronômio", "14-16"]], "extra": false, "title": "Generosidade no calendário", "nodes": [{"ref": "Dt 14", "text": "Alimentação e dízimos distinguem a vida comunitária.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-14/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 14 na BKJ Fiel 1611 (requer internet)\">Dt 14<\/a>"}, {"ref": "Dt 15", "text": "Remissão e ajuda ao pobre limitam dureza econômica.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 15 na BKJ Fiel 1611 (requer internet)\">Dt 15<\/a>"}, {"ref": "Dt 16", "text": "As festas incluem alegria compartilhada.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-16/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 16 na BKJ Fiel 1611 (requer internet)\">Dt 16<\/a>"}], "explain": "O calendário não beneficia apenas quem possui terras. Servos, estrangeiros, órfãos e viúvas devem participar da celebração.", "question": "Quem fica de fora das minhas comemorações?", "action": "Inclua alguém em um gesto de hospitalidade.", "cross": "Dt 15:7-11", "links": [{"label": "Deuteronômio 14", "url": "https://bkjfiel.com.br/deuteronomio-14/"}, {"label": "Deuteronômio 15", "url": "https://bkjfiel.com.br/deuteronomio-15/"}, {"label": "Deuteronômio 16", "url": "https://bkjfiel.com.br/deuteronomio-16/"}], "explain_html": "O calendário não beneficia apenas quem possui terras. Servos, estrangeiros, órfãos e viúvas devem participar da celebração.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 15 na BKJ Fiel 1611 (requer internet)\">Dt 15:7-11<\/a>"}, {"day": 76, "week": 11, "weekday": 6, "reading": "Deuteronômio 17-20", "passages": [["Deuteronômio", "17-20"]], "extra": false, "title": "Poder sujeito à justiça", "nodes": [{"ref": "Dt 17", "text": "Juízes e rei recebem limites.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-17/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 17 na BKJ Fiel 1611 (requer internet)\">Dt 17<\/a>"}, {"ref": "Dt 18", "text": "O povo é chamado a ouvir a palavra profética.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-18/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 18 na BKJ Fiel 1611 (requer internet)\">Dt 18<\/a>"}, {"ref": "Dt 19-20", "text": "Refúgio, testemunho e guerra recebem normas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-19/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 19 na BKJ Fiel 1611 (requer internet)\">Dt 19-20<\/a>"}], "explain": "O rei não fica acima da lei. Justiça e testemunho exigem cuidado com evidência e responsabilidade, não apenas confiança na autoridade.", "question": "Aceito limites quando tenho poder?", "action": "Revise uma decisão ouvindo quem pode ser afetado.", "cross": "Dt 17:18-20", "links": [{"label": "Deuteronômio 17", "url": "https://bkjfiel.com.br/deuteronomio-17/"}, {"label": "Deuteronômio 18", "url": "https://bkjfiel.com.br/deuteronomio-18/"}, {"label": "Deuteronômio 19", "url": "https://bkjfiel.com.br/deuteronomio-19/"}, {"label": "Deuteronômio 20", "url": "https://bkjfiel.com.br/deuteronomio-20/"}], "explain_html": "O rei não fica acima da lei. Justiça e testemunho exigem cuidado com evidência e responsabilidade, não apenas confiança na autoridade.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-17/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 17 na BKJ Fiel 1611 (requer internet)\">Dt 17:18-20<\/a>"}, {"day": 77, "week": 11, "weekday": 7, "reading": "Deuteronômio 21-23", "passages": [["Deuteronômio", "21-23"]], "extra": false, "title": "Dignidade em casos difíceis", "nodes": [{"ref": "Dt 21", "text": "Conflitos familiares e sociais recebem normas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 21 na BKJ Fiel 1611 (requer internet)\">Dt 21<\/a>"}, {"ref": "Dt 22", "text": "Responsabilidade pelo próximo alcança situações concretas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-22/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 22 na BKJ Fiel 1611 (requer internet)\">Dt 22<\/a>"}, {"ref": "Dt 23", "text": "A comunidade recebe regras de convivência.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-23/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 23 na BKJ Fiel 1611 (requer internet)\">Dt 23<\/a>"}], "explain": "Essas leis pertencem a uma sociedade antiga com instituições diferentes das atuais. Procure o cuidado com responsabilidade e vulnerabilidade sem reproduzir punições ou desigualdades.", "question": "Percebo quem é vulnerável em uma regra?", "action": "Faça uma escolha que proteja a dignidade de alguém.", "cross": "Dt 22:1-4", "links": [{"label": "Deuteronômio 21", "url": "https://bkjfiel.com.br/deuteronomio-21/"}, {"label": "Deuteronômio 22", "url": "https://bkjfiel.com.br/deuteronomio-22/"}, {"label": "Deuteronômio 23", "url": "https://bkjfiel.com.br/deuteronomio-23/"}], "explain_html": "Essas leis pertencem a uma sociedade antiga com instituições diferentes das atuais. Procure o cuidado com responsabilidade e vulnerabilidade sem reproduzir punições ou desigualdades.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-22/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 22 na BKJ Fiel 1611 (requer internet)\">Dt 22:1-4<\/a>"}, {"day": 78, "week": 12, "weekday": 1, "reading": "Deuteronômio 24-27", "passages": [["Deuteronômio", "24-27"]], "extra": false, "title": "Justiça para quem tem menos", "nodes": [{"ref": "Dt 24", "text": "Salários, penhores e colheita envolvem proteção social.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-24/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 24 na BKJ Fiel 1611 (requer internet)\">Dt 24<\/a>"}, {"ref": "Dt 25", "text": "Pesos honestos e limites ao castigo são exigidos.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 25 na BKJ Fiel 1611 (requer internet)\">Dt 25<\/a>"}, {"ref": "Dt 26-27", "text": "Gratidão e compromisso acompanham a entrada na terra.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-26/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 26 na BKJ Fiel 1611 (requer internet)\">Dt 26-27<\/a>"}], "explain": "A memória de ter sido estrangeiro deve mudar o tratamento do necessitado. A fidelidade aparece em salários pagos e medidas honestas.", "question": "Minha gratidão modifica minhas práticas econômicas?", "action": "Quite uma obrigação ou corrija uma medida injusta.", "cross": "Dt 24:14-22", "links": [{"label": "Deuteronômio 24", "url": "https://bkjfiel.com.br/deuteronomio-24/"}, {"label": "Deuteronômio 25", "url": "https://bkjfiel.com.br/deuteronomio-25/"}, {"label": "Deuteronômio 26", "url": "https://bkjfiel.com.br/deuteronomio-26/"}, {"label": "Deuteronômio 27", "url": "https://bkjfiel.com.br/deuteronomio-27/"}], "explain_html": "A memória de ter sido estrangeiro deve mudar o tratamento do necessitado. A fidelidade aparece em salários pagos e medidas honestas.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-24/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 24 na BKJ Fiel 1611 (requer internet)\">Dt 24:14-22<\/a>"}, {"day": 79, "week": 12, "weekday": 2, "reading": "Deuteronômio 28, 29", "passages": [["Deuteronômio", "28, 29"]], "extra": false, "title": "A seriedade da ruptura", "nodes": [{"ref": "Dt 28:1-14", "text": "Bênçãos acompanham a fidelidade da aliança.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-28/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 28 na BKJ Fiel 1611 (requer internet)\">Dt 28:1-14<\/a>"}, {"ref": "Dt 28:15-68", "text": "A ruptura é descrita em consequências graves.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-28/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 28 na BKJ Fiel 1611 (requer internet)\">Dt 28:15-68<\/a>"}, {"ref": "Dt 29", "text": "A renovação alcança presentes e futuras gerações.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-29/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 29 na BKJ Fiel 1611 (requer internet)\">Dt 29<\/a>"}], "explain": "O discurso interpreta a vida nacional à luz da aliança. Não o reduza a uma fórmula individual de saúde e riqueza.", "question": "Que consequências coletivas minhas escolhas produzem?", "action": "Assuma responsabilidade por um compromisso comum.", "cross": "Dt 29:29", "links": [{"label": "Deuteronômio 28", "url": "https://bkjfiel.com.br/deuteronomio-28/"}, {"label": "Deuteronômio 29", "url": "https://bkjfiel.com.br/deuteronomio-29/"}], "explain_html": "O discurso interpreta a vida nacional à luz da aliança. Não o reduza a uma fórmula individual de saúde e riqueza.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-29/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 29 na BKJ Fiel 1611 (requer internet)\">Dt 29:29<\/a>"}, {"day": 80, "week": 12, "weekday": 3, "reading": "Deuteronômio 30, 31", "passages": [["Deuteronômio", "30, 31"]], "extra": false, "title": "Escolher a vida e preparar sucessores", "nodes": [{"ref": "Dt 30", "text": "Retorno, restauração e escolha da vida são anunciados.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-30/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 30 na BKJ Fiel 1611 (requer internet)\">Dt 30<\/a> er internet)\">1Sm 18<\/a>"}, {"ref": "1Sm 19-20", "text": "Mical e Jônatas participam de sua proteção.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-19/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 19 na BKJ Fiel 1611 (requer internet)\">1Sm 19-20<\/a>"}, {"ref": "Sl 11; Sl 59", "text": "A oração busca refúgio diante da perseguição.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 11 na BKJ Fiel 1611 (requer internet)\">Sl 11<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-59/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 59 na BKJ Fiel 1611 (requer internet)\">Sl 59<\/a>"}], "explain": "A amizade de Jônatas tem custo porque contraria a ambição do pai. Os salmos ajudam a ouvir o medo sem legitimar vingança pessoal.", "question": "Consigo celebrar o crescimento de outra pessoa?", "action": "Reconheça sinceramente uma conquista alheia.", "cross": "1Sm 20:16-17", "links": [{"label": "1 Samuel 18", "url": "https://bkjfiel.com.br/1-samuel-18/"}, {"label": "1 Samuel 19", "url": "https://bkjfiel.com.br/1-samuel-19/"}, {"label": "1 Samuel 20", "url": "https://bkjfiel.com.br/1-samuel-20/"}, {"label": "Salmos 11", "url": "https://bkjfiel.com.br/salmos-11/"}, {"label": "Salmos 59", "url": "https://bkjfiel.com.br/salmos-59/"}], "explain_html": "A amizade de Jônatas tem custo porque contraria a ambição do pai. Os salmos ajudam a ouvir o medo sem legitimar vingança pessoal.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-20/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 20 na BKJ Fiel 1611 (requer internet)\">1Sm 20:16-17<\/a>"}, {"day": 104, "week": 15, "weekday": 6, "reading": "1 Samuel 21-24", "passages": [["1 Samuel", "21-24"]], "extra": false, "title": "Fugir sem tomar vingança", "nodes": [{"ref": "1Sm 21-22", "text": "Davi foge; sacerdotes sofrem a violência de Saul.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 21 na BKJ Fiel 1611 (requer internet)\">1Sm 21-22<\/a>"}, {"ref": "1Sm 23", "text": "Ele socorre Queila e continua perseguido.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-23/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 23 na BKJ Fiel 1611 (requer internet)\">1Sm 23<\/a>"}, {"ref": "1Sm 24", "text": "Poupa Saul na caverna.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-24/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 24 na BKJ Fiel 1611 (requer internet)\">1Sm 24<\/a>"}], "explain": "A oportunidade de ferir não equivale a autorização moral. A fuga de Davi também envolve escolhas difíceis e consequências para terceiros.", "question": "Uso a oportunidade como desculpa para retaliar?", "action": "Escolha uma resposta que interrompa a escalada do conflito.", "cross": "1Sm 24:10-12", "links": [{"label": "1 Samuel 21", "url": "https://bkjfiel.com.br/1-samuel-21/"}, {"label": "1 Samuel 22", "url": "https://bkjfiel.com.br/1-samuel-22/"}, {"label": "1 Samuel 23", "url": "https://bkjfiel.com.br/1-samuel-23/"}, {"label": "1 Samuel 24", "url": "https://bkjfiel.com.br/1-samuel-24/"}], "explain_html": "A oportunidade de ferir não equivale a autorização moral. A fuga de Davi também envolve escolhas difíceis e consequências para terceiros.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-samuel-24/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Samuel 24 na BKJ Fiel 1611 (requer internet)\">1Sm 24:10-12<\/a>"}, {"day": 105, "week": 15, "weekday": 7, "reading": "Salmos 7, 27, 31, 34, 52", "passages": [["Salmos", "7, 27, 31, 34, 52"]], "extra": false, "title": "Refúgio em diferentes vozes", "nodes": [{"ref": "Sl 7; Sl 27", "text": "A oração pede justiça e presença.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel. tle": "Uma casa prometida", "nodes": [{"ref": "2Sm 7:1-17", "text": "Deus responde ao desejo de Davi de construir.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 7 na BKJ Fiel 1611 (requer internet)\">2Sm 7:1-17<\/a>"}, {"ref": "2Sm 7:18-29", "text": "Davi recebe a promessa em oração.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 7 na BKJ Fiel 1611 (requer internet)\">2Sm 7:18-29<\/a>"}, {"ref": "1Cr 17", "text": "O relato paralelo reforça a continuidade da dinastia.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-cronicas-17/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Crônicas 17 na BKJ Fiel 1611 (requer internet)\">1Cr 17<\/a>"}], "explain": "A promessa desloca o foco da obra que Davi faria para aquilo que Deus fará. O Novo Testamento relaciona a esperança davídica ao reinado de Jesus.", "question": "Escuto antes de definir o que farei para Deus?", "action": "Transforme um projeto em oração humilde.", "cross": "Lc 1:32-33", "links": [{"label": "2 Samuel 7", "url": "https://bkjfiel.com.br/2-samuel-7/"}, {"label": "1 Crônicas 17", "url": "https://bkjfiel.com.br/1-cronicas-17/"}], "explain_html": "A promessa desloca o foco da obra que Davi faria para aquilo que Deus fará. O Novo Testamento relaciona a esperança davídica ao reinado de Jesus.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 1 na BKJ Fiel 1611 (requer internet)\">Lc 1:32-33<\/a>"}, {"day": 128, "week": 19, "weekday": 2, "reading": "Salmos 25, 29, 33, 36, 39", "passages": [["Salmos", "25, 29, 33, 36, 39"]], "extra": false, "title": "Ensina-me o caminho", "nodes": [{"ref": "Sl 25", "text": "A oração pede direção e perdão.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-25/\" tar  129, "week": 19, "weekday": 3, "reading": "2 Samuel 8-9; 1 Crônicas 18", "passages": [["2 Samuel", "8-9"], ["1 Crônicas", "18"]], "extra": false, "title": "Vitória e bondade pessoal", "nodes": [{"ref": "2Sm 8; 1Cr 18", "text": "As vitórias e a administração são apresentadas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 8 na BKJ Fiel 1611 (requer internet)\">2Sm 8<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-cronicas-18/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Crônicas 18 na BKJ Fiel 1611 (requer internet)\">1Cr 18<\/a>"}, {"ref": "2Sm 9:1-8", "text": "Davi procura um descendente de Jônatas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 9 na BKJ Fiel 1611 (requer internet)\">2Sm 9:1-8<\/a>"}, {"ref": "2Sm 9:9-13", "text": "Mefibosete recebe sustento e lugar à mesa.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 9 na BKJ Fiel 1611 (requer internet)\">2Sm 9:9-13<\/a>"}], "explain": "A aliança com Jônatas produz cuidado concreto por uma pessoa vulnerável. Mefibosete não se reduz à deficiência; possui história e dignidade.", "question": "Minha lealdade se expressa em cuidado prático?", "action": "Honre um compromisso antigo de ajuda.", "cross": "2Sm 9:7", "links": [{"label": "2 Samuel 8", "url": "https://bkjfiel.com.br/2-samuel-8/"}, {"label": "2 Samuel 9", "url": "https://bkjfiel.com.br/2-samuel-9/"}, {"label": "1 Crônicas 18", "url": "https://bkjfiel.com.br/1-cronicas-18/"}], "explain_html": "A aliança com Jônatas produz cuidado concreto por uma pessoa vulnerável. Mefibosete não se reduz à deficiência; possui história e dignidade.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 9 na BKJ Fiel 1611 (requer internet)\">2Sm 9:7<\/a>"}, {"day": 130, "week": 19, "weekday": 4, "reading": "Salmos 50, 53, 60, 75", "passages": [["Salmos", "50, 53, 60, 75"]], "extra": false, "title": "Deus não precisa de aparência religiosa", "nodes": [{"ref": "Sl 50", "text": "O culto é confrontado pela verdade.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-50/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 50 na BKJ Fiel 1611 (requer internet)\">Sl 50<\/a>"}, {"ref": "Sl 53; Sl 60", "text": "Corrupção e crise provocam reflexão.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-53/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 53 na BKJ Fiel 1611 (requer internet)\">Sl 53<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-60/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 60 na BKJ Fiel 1611 (requer internet)\">Sl 60<\/a>"}, {"ref": "Sl 75", "text": "O julgamento divino limita a arrogância.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-75/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 75 na BKJ Fiel 1611 (requer internet)\">Sl 75<\/a>"}], "explain": "Ofertas não compensam mentira e injustiça. A oração em tempos de derrota também convida a abandonar confiança exclusiva em poder humano.", "question": "Uso práticas religiosas para encobrir incoerências?", "action": "Repare uma contradição entre palavra e comportamento.", "cross": "Sl 50:14-23", "links": [{"label": "Salmos 50", "url": "https://bkjfiel.com.br/salmos-50/"}, {"label": "Salmos 53", "url": "https://bkjfiel.com.br/salmos-53/"}, {"label": "Salmos 60", "url": "https://bkjfiel.com.br/salmos-60/"}, {"label": "Salmos 75", "url": "https://bkjfiel.com.br/salmos-75/"}], "explain_html": "Ofertas não compensam mentira e injustiça. A oração em tempos de derrota também convida a abandonar confiança exclusiva em poder humano.", "cross_html": "<a class=\"bible-ref\" href=\"  dependência sem transformar todo projeto pessoal em causa divina.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-20/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 20 na BKJ Fiel 1611 (requer internet)\">Sl 20:7<\/a>"}, {"day": 132, "week": 19, "weekday": 6, "reading": "Salmos 65-67, 69-70", "passages": [["Salmos", "65-67, 69-70"]], "extra": false, "title": "Gratidão que alcança povos", "nodes": [{"ref": "Sl 65", "text": "A terra e suas colheitas despertam louvor.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-65/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 65 na BKJ Fiel 1611 (requer internet)\">Sl 65<\/a>"}, {"ref": "Sl 66-67", "text": "A bênção é relacionada ao testemunho entre nações.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-66/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 66 na BKJ Fiel 1611 (requer internet)\">Sl 66-67<\/a>"}, {"ref": "Sl 69-70", "text": "A angústia pede socorro urgente.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-69/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 69 na BKJ Fiel 1611 (requer internet)\">Sl 69-70<\/a>"}], "explain": "A gratidão e o lamento pertencem ao mesmo repertório de fé. A bênção de uma comunidade tem horizonte de serviço às demais.", "question": "Desejo bênção apenas para meu grupo?", "action": "Ore e aja em favor de alguém de outro contexto.", "cross": "Sl 67:1-2", "links": [{"label": "Salmos 65", "url": "https://bkjfiel.com.br/salmos-65/"}, {"label": "Salmos 66", "url": "https://bkjfiel.com.br/salmos-66/"}, {"label": "Salmos 67", "url": "https://bkjfiel.com.br/salmos-67/"}, {"label": "Salmos 69", "url": "https://bkjfiel.com.br/salmos-69/"}, {"label": "Salmos 70", "url": "https://bkjfiel.com.br/salmos-70/"}], "explain_html": "A gratidão e o lamento pertencem ao mesmo repertório de fé. A bênção de uma comunidade tem horizonte de serviço às demais.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-67/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 67 na BKJ Fiel 1611 (requer internet)\">Sl 67:1-2<\/a>"}, {"day": 133, "week": 19, "weekday": 7, "reading": "2 Samuel 11, 12; 1 Crônicas 20", "passages": [["2 Samuel", "11, 12"], ["1 Crônicas", "20"]], "extra": false, "title": "Poder, encobrimento e confronto", "nodes": [{"ref": "2Sm 11", "text": "Davi toma Bate-Seba e planeja a morte de Urias.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 11 na BKJ Fiel 1611 (requer internet)\">2Sm 11<\/a>"}, {"ref": "2Sm 12", "text": "Natã o confronta e as consequências são anunciadas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 12 na BKJ Fiel 1611 (requer internet)\">2Sm 12<\/a>"}, {"ref": "1Cr 20", "text": "O relato paralelo destaca campanhas militares.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-cronicas-20/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Crônicas 20 na BKJ Fiel 1611 (requer internet)\">1Cr 20<\/a>"}], "explain": "A culpa pertence às escolhas de Davi, que detém poder. Não culpabilize Bate-Seba nem use o perdão para eliminar responsabilidade e reparação.", "question": "Aceito confronto quando meu poder prejudica alguém?", "action": "Ouça uma crítica sem preparar defesa imediata.", "cross": "2Sm 12:7-13", "links": [{"label": "2 Samuel 11", "url": "https://bkjfiel.com.br/2-samuel-11/"}, {"label": "2 Samuel 12", "url": "https://bkjfiel.com.br/2-samuel-12/"}, {"label": "1 Crônicas 20", "url": "https://bkjfiel.com.br/1-cronicas-20/"}], "explain_html": "A culpa pertence às escolhas de Davi, que detém poder. Não culpabilize Bate-Seba nem use o perdão para eliminar responsabilidade e reparação.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-samuel-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Samuel 12 na BKJ Fiel 1611 (requer internet)\">2Sm 12:7-13<\/a>"}, {"day": 134, "week": 20, "weekday": 1, "reading": "Salmos 32, 51, 86, 122", "passages": [["Salmos", "32, 51, 86, 122"]], "extra": false, "title": "Arrependimento que diz a verdade", "nodes": [{"ref": "Sl 32", "text": "O silêncio sobre a culpa é rompido pela confissão.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-32/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 32 na BKJ Fiel 1611 (requer internet)\">Sl 32<\/a>"}, {"ref": "Sl 51", "text": "O coração quebrantado pede renovação.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-51/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 51 na BKJ Fiel 1611 (requer internet)\">Sl 51<\/a>"}, {"ref": "Sl 86; Sl 122", "text": "Misericórdia e paz orientam a oração.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-86/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 86 na BKJ Fiel 1611 (requer internet)\">Sl 86<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-122/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 122 na BKJ Fiel 1611 (requer internet)\">Sl 122<\/a>"}], "explain": "O arrependimento bíblico não é mera vergonha por ter sido descoberto. Ele reconhece o mal e deseja transformação, mantendo atenção às pessoas feridas.", "question": "Quero mudar ou apenas aliviar minha culpa?", "action": "Nomeie a falta e um passo de reparação.", "cross": "Sl 51:10-17", "links": [{"label": "Salmos 32", "url": "https://bkjfiel.com.br/salmos-32/"}, {"label": "Salmos 51", "url": "https://bkjfiel.com.br/salmos-51/"}, {"label": "Salmos 86", "url": "https://bkjfiel.com.br/salmos-86/"}, {"label": "Salmos 122", "url": "https://bkjfiel.com.br/salmos-122/"}], "explain_html": "O arrependimento bíblico não é mera vergonha por ter sido descoberto. Ele reconhece o mal e deseja transformação, .br/1-reis-5/"}, {"label": "1 Reis 6", "url": "https://bkjfiel.com.br/1-reis-6/"}, {"label": "2 Crônicas 2", "url": "https://bkjfiel.com.br/2-cronicas-2/"}, {"label": "2 Crônicas 3", "url": "https://bkjfiel.com.br/2-cronicas-3/"}], "explain_html": "A arquitetura não substitui a aliança. O leitor deve perceber tanto a beleza da obra quanto o trabalho e as decisões políticas envolvidos em realizá-la.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 6 na BKJ Fiel 1611 (requer internet)\">1Rs 6:12-13<\/a>"}, {"day": 163, "week": 24, "weekday": 2, "reading": "1 Reis 7; 2 Crônicas 4", "passages": [["1 Reis", "7"], ["2 Crônicas", "4"]], "extra": false, "title": "Beleza e responsabilidade", "nodes": [{"ref": "1Rs 7:1-12", "text": "O palácio amplia o cenário da construção.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 7 na BKJ Fiel 1611 (requer internet)\">1Rs 7:1-12<\/a>"}, {"ref": "1Rs 7:13-51", "text": "Artesãos e utensílios recebem descrição detalhada.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 7 na BKJ Fiel 1611 (requer internet)\">1Rs 7:13-51<\/a>"}, {"ref": "2Cr 4", "text": "O relato paralelo destaca objetos do culto.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 4 na BKJ Fiel 1611 (requer internet)\">2Cr 4<\/a>"}], "explain": "A habilidade artística participa do serviço, mas riqueza visual não é medida automática de fidelidade. O texto permite observar escala, trabalho e prioridades.", "question": "Minha busca de beleza serve à comunhão?", "action": "Use uma habilidade para facilitar o serviço de outros.", "cross": "2Cr 4:11", "links": [{"label": "1 Reis 7", "url": "https://bkjfiel.com.br/1-reis-7/"}, {"label": "2 Crônicas 4", "url": "https://bkjfiel.com.br/2-cronicas-4/"}], "explain_html": "A habilidade artística participa do serviço, mas riqueza visual não é medida automática de fidelidade. O texto permite observar escala, trabalho e prioridades.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 4 na BKJ Fiel 1611 (requer internet)\">2Cr 4:11<\/a>"}, {"day": 164, "week": 24, "weekday": 3, "reading": "1 Reis 8; 2 Crônicas 5", "passages": [["1 Reis", "8"], ["2 Crônicas", "5"]], "extra": false, "title": "Deus não cabe em um edifício", "nodes": [{"ref": "1Rs 8:1-21; 2Cr 5", "text": "A arca é conduzida ao templo.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 8 na BKJ Fiel 1611 (requer internet)\">1Rs 8:1-21<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 5 na BKJ Fiel 1611 (requer internet)\">2Cr 5<\/a>"}, {"ref": "1Rs 8:22-53", "text": "Salomão ora por perdão e escuta.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 8 na BKJ Fiel 1611 (requer internet)\">1Rs 8:22-53<\/a>"}, {"ref": "1Rs 8:54-66", "text": "A dedicação envolve bênção e celebração.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 8 na BKJ Fiel 1611 (requer internet)\">1Rs 8:54-66<\/a>"}], "explain": "A própria oração reconhece que os céus não contêm Deus. O templo é lugar de referência para oração, não mecanismo para controlar sua presença.", "question": "Confundo o lugar de culto com o próprio Deus?", "action": "Ore por pessoas além de sua comunidade.", "cross": "1Rs 8:27,41-43", "links": [{"label": "1 Reis 8", "url": "https://bkjfiel.com.br/1-reis-8/"}, {"label": "2 Crônicas 5", "url": "https://bkjfiel.com.br/2-cronicas-5/"}], "explain_html": "A própria oração reconhece que os céus não contêm Deus. O templo é lugar de referência para oração, não mecanismo para controlar sua presença.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 8 na BKJ Fiel 1611 (requer internet)\">1Rs 8:27,41-43<\/a>"}, {"day": 165, "week": 24, "weekday": 4, "reading": "2 Crônicas 6-7; Salmos 136", "passages": [["2 Crônicas", "6-7"], ["Salmos", "136"]], "extra": false, "title": "Dedicação e responsabilidade futura", "nodes": [{"ref": "2Cr 6", "text": "A oração inclui crises, arrependimento e estrangeiros.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 6 na BKJ Fiel 1611 (requer internet)\">2Cr 6<\/a>"}, {"ref": "2Cr 7", "text": "A resposta envolve promessa e advertência.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 7 na BKJ Fiel 1611 (requer internet)\">2Cr 7<\/a>"}, {"ref": "Sl 136", "text": "A misericórdia é lembrada repetidamente.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-136/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 136 na BKJ Fiel 1611 (requer internet)\">Sl 136<\/a>"}], "explain": "A promessa de restauração de Crônicas é dirigida à comunidade da aliança. Aplicá-la hoje exige evitar transformar qualquer Estado moderno em Israel antigo.", "question": "Meu pedido de restauração inclui mudança concreta?", "action": "Associe uma oração a uma atitude de justiça.", "cross": "2Cr 7:14", "links": [{"label": "2 Crônicas 6", "url": "https://bkjfiel.com.br/2-cronicas-6/"}, {"label": "2 Crônicas 7", "url": "https://bkjfiel.com.br/2-cronicas-7/"}, {"label": "Salmos 136", "url": "https://bkjfiel.com.br/salmos-136/"}], "explain_htm Salmos 149", "url": "https://bkjfiel.com.br/salmos-149/"}, {"label": "Salmos 150", "url": "https://bkjfiel.com.br/salmos-150/"}], "explain_html": "O louvor final do Saltério inclui justiça, cura e acolhimento. Música e compaixão não são atividades concorrentes.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-146/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 146 na BKJ Fiel 1611 (requer internet)\">Sl 146:7-9<\/a>"}, {"day": 167, "week": 24, "weekday": 6, "reading": "1 Reis 9; 2 Crônicas 8", "passages": [["1 Reis", "9"], ["2 Crônicas", "8"]], "extra": false, "title": "Prosperidade sob advertência", "nodes": [{"ref": "1Rs 9:1-9", "text": "Deus responde à dedicação com condições e advertências.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 9 na BKJ Fiel 1611 (requer internet)\">1Rs 9:1-9<\/a>"}, {"ref": "1Rs 9:10-28", "text": "Obras e comércio expandem o reino.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 9 na BKJ Fiel 1611 (requer internet)\">1Rs 9:10-28<\/a>"}, {"ref": "2Cr 8", "text": "Administração e culto são apresentados em paralelo.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 8 na BKJ Fiel 1611 (requer internet)\">2Cr 8<\/a>"}], "explain": "A expansão econômica não cancela a responsabilidade espiritual. Leia os detalhes de trabalho e poder sem confundir êxito político com aprovação total.", "question": "O sucesso está enfraquecendo meu autoexame?", "action": "Avalie o custo humano de uma conquista.", "cross": "1Rs 9:4-9", "links": [{"label": "1 Reis 9", "url": "https://bkjfiel.com.br/1-reis-9/"}, {"label": "2 Crônicas 8", "url": "https://bkjfiel.com.br/2-cronicas-8/"}], "explain_html": "A expansão econômica não cancela a responsabilidade espiritual. Leia os detalhes de trabalho e poder sem confundir êxito político com aprovação total.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-reis-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Reis 9 na BKJ Fiel 1611 (requer internet)\">1Rs 9:4-9<\/a>"}, {"day": 168, "week": 24, "weekday": 7, "reading": "Provérbios 25, 26", "passages": [["Provérbios", "25, 26"]], "extra": false, "title": "Medida, oportunidade e fala", "nodes": [{"ref": "Pv 25", "text": "A palavra adequada e o domínio próprio são valorizados.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/proverbios-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Provérbios 25 na BKJ Fiel 1611 (requer internet)\">Pv 25<\/a>"}, {"ref": "Pv 26:1-12", "text": "A insensatez exige discernimento na resposta.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/proverbios-26/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Provérbios 26 na BKJ Fiel 1611 (requer internet)\">Pv 26:1-12<\/a>"}, {"ref": "Pv 26:13-28", "text": "Preguiça, intriga e dissimulação são expostas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/proverbios-26/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Provérbios 26 na BKJ Fiel 1611 (requer internet)\">Pv 26:13-28<\/a>"}], "explain": "Conselhos aparentemente opostos podem atender situações diferentes. Os versos sobre responder ao insensato pedem julgamento contextual, não contradição simplista.", "question": "É hora de falar, calar ou perguntar?", "action": "Evite alimentar uma discussão sem propósito.", "cross": "Pv 26:4-5", "links": [{"label": "Provérbios 25", "url": "https://bkjfiel.com.br/proverbios-25/"}, {"label": "Provérbios 26", "url": "https://bkjfiel.com.br/proverbios-26/"}], "explain_html": "Conselhos aparentemente opostos podem atender situações diferentes. Os versos sobre responder ao insensato pedem julgamento contextual, não contradição simplista.", "cross_html": "<a class=\"bible-ref "bible-ref\" href=\"https://bkjfiel.com.br/isaias-58/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 58 na BKJ Fiel 1611 (requer internet)\">Is 58<\/a>"}], "explain": "A devoção não pode substituir o cuidado do faminto e do oprimido. Na perspectiva adventista, o sábado integra comunhão, alegria e fidelidade ao Criador.", "question": "Meu sacrifício religioso ajuda alguém de fato?", "action": "Compartilhe alimento ou tempo de cuidado.", "cross": "Is 58:6-14", "links": [{"label": "Isaías 54", "url": "https://bkjfiel.com.br/isaias-54/"}, {"label": "Isaías 55", "url": "https://bkjfiel.com.br/isaias-55/"}, {"label": "Isaías 56", "url": "https://bkjfiel.com.br/isaias-56/"}, {"label": "Isaías 57", "url": "https://bkjfiel.com.br/isaias-57/"}, {"label": "Isaías 58", "url": "https://bkjfiel.com.br/isaias-58/"}], "explain_html": "A devoção não pode substituir o cuidado do faminto e do oprimido. Na perspectiva adventista, o sábado integra comunhão, alegria e fidelidade ao Criador.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-58/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 58 na BKJ Fiel 1611 (requer internet)\">Is 58:6-14<\/a>"}, {"day": 212, "week": 31, "weekday": 2, "reading": "Isaías 59-63", "passages": [["Isaías", "59-63"]], "extra": false, "title": "Luz para uma comunidade restaurada", "nodes": [{"ref": "Is 59", "text": "A injustiça rompe relações e exige redenção.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-59/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 59 na BKJ Fiel 1611 (requer internet)\">Is 59<\/a>"}, {"ref": "Is 60-61", "text": "Luz, missão e boas-novas anunciam restauração.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-60/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 60 na BKJ Fiel 1611 (requer internet)\">Is 60-61<\/a>"}, {"ref": "Is 62-63", "text": "Esperança e clamor por intervenção convivem.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-62/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 62 na BKJ Fiel 1611 (requer internet)\">Is 62-63<\/a>"}], "explain": "Jesus aplica Isaías 61 à sua missão em Lucas. A promessa não dispensa ação presente em favor dos quebrantados.", "question": "Que boa notícia minha presença leva a alguém?", "action": "Pratique uma forma concreta de acolhimento.", "cross": "Lc 4:16-21", "links": [{"label": "Isaías 59", "url": "https://bkjfiel.com.br/isaias-59/"}, {"label": "Isaías 60", "url": "https://bkjfiel.com.br/isaias-60/"}, {"label": "Isaías 61", "url": "https://bkjfiel.com.br/isaias-61/"}, {"label": "Isaías 62", "url": "https://bkjfiel.com.br/isaias-62/"}, {"label": "Isaías 63", "url": "https://bkjfiel.com.br/isaias-63/"}], "explain_html": "Jesus aplica <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-61/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 61 na BKJ Fiel 1611 (requer internet)\">Isaías 61<\/a> à sua missão em Lucas. A promessa não dispensa ação presente em favor dos quebrantados.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 4 na BKJ Fiel 1611 (requer internet)\">Lc 4:16-21<\/a>"}, {"day": 213, "week": 31, "weekday": 3, "reading": "Isaías 64-66", "passages": [["Isaías", "64-66"]], "extra": false, "title": "Nova criação e humildade", "nodes": [{"ref": "Is 64", "text": "O povo clama reconhecendo necessidade de transformação.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-64/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 64 na BKJ Fiel 1611 (requer internet)\">Is 64<\/a>"}, {"ref": "Is 65", "text": "Juízo e promessa de nova criação são apresentados.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-65/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 65 na BKJ Fiel 1611 (requer internet)\">Is 65<\/a>"}, {"ref": "Is 66", "text": "Culto, humildade e reunião dos povos encerram o livro.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-66/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 66 na BKJ Fiel 1611 (requer internet)\">Is 66<\/a>"}], "explain": "As imagens devem ser comparadas com Apocalipse, sem exigir que cada detalhe descreva o mesmo estágio da história. O horizonte final é comunhão restaurada.", "question": "Minha esperança futura modifica minha vida presente?", "action": "Cuide hoje de algo que expressa vida e reconciliação.", "cross": "Is 66:2; Ap 21:1-4", "links": [{"label": "Isaías 64", "url": "https://bkjfiel.com.br/isaias-64/"}, {"label": "Isaías 65", "url": "https://bkjfiel.com.br/isaias-65/"}, {"label": "Isaías 66", "url": "https://bkjfiel.com.br/isaias-66/"}], "explain_html": "As imagens devem ser comparadas com Apocalipse, sem exigir que cada detalhe descreva o mesmo estágio da história. O horizonte final é comunhão restaurada.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/isaias-66/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Isaías 66 na BKJ Fiel 1611 (requer internet)\">Is 66:2<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/apocalipse-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Apocalipse 21 na BKJ Fiel 1611 (requer internet)\">Ap 21:1-4<\/a>"}, {"day": 214, "week": 31, "weekday": 4, "reading": "2 Reis 20, 21", "passages": [["2 Reis", "20, 21"]], "extra": false, "title": "Depois do livramento", "nodes": [{"ref": "2Rs 20", "text": "Ezequias é curado, mas exibe seus tesouros.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-reis-20/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Reis 20 na BKJ Fiel 1611 (requer internet)\">2Rs 20<\/a>"}, {"ref": "2Rs 21:1-18", "text": "Manassés intensifica a infidelidade.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-reis-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Reis 21 na BKJ Fiel 1611 (requer internet)\">2Rs 21:1-18<\/a>"}, {"ref": "2Rs 21:19-26", "text": "Amom continua o desvio e é assassinado.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-reis-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Reis 21 na BKJ Fiel 1611 (requer internet)\">2Rs 21:19-26<\/a>"}], "explain": "O legado de um reinado não controla as escolhas do seguinte. A narrativa recorda que continuidade institucional pode coexistir com ruptura espiritual.", "question": "Que valores estou realmente transmitindo?", "action": "Converse sobre uma convicção por meio de exemplo concreto.", "cross": "2Rs 21:10-15", "links": [{"label": "2 Reis 20", "url": "https://bkjfiel.com.br/2-reis-20/"}, {"label": "2 Reis 21", "url": "https://bkjfiel.com.br/2-reis-21/"}], "explain_html": "O legado de um reinado não controla as escolhas do seguinte. A narrativa recorda que continuidade institucional pode coexistir com ruptura espiritual.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-reis-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Reis 21 na BKJ Fiel 1611 (requer internet)\">2Rs 21:10-15<\/a>"}, {"day": 215, "week": 31, "weekday": 5, "reading": "2 Crônicas 32, 33", "passages": [["2 Crônicas", "32, 33"]], "extra": false, "title": "Humilhação que abre retorno", "nodes": [{"ref": "2Cr 32", "text": "Ezequias enfrenta crise, cura e orgulho.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-32/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 32 na BKJ Fiel 1611 (requer internet)\">2Cr 32<\/a>"}, {"ref": "2Cr 33:1-20", "text": "Manassés se humilha e busca restaurar o culto.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-33/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 33 na BKJ Fiel 1611 (requer internet)\">2Cr 33:1-20<\/a>"}, {"ref": "2Cr 33:21-25", "text": "Amom recusa o mesmo caminho.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-33/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 33 na BKJ Fiel 1611 (requer internet)\">2Cr 33:21-25<\/a>"}], "explain": "Crônicas acrescenta o arrependimento de Manassés ao retrato de Reis. A possibilidade de retorno não apaga o impacto prolongado das escolhas anteriores.", "question": "Acredito em mudança sem eliminar responsabilidade?", "action": "Apoie um processo sério de reparação.", "cross": "2Cr 33:12-16", "links": [{"label": "2 Crônicas 32", "url": "https://bkjfiel.com.br/2-cronicas-32/"}, {"label": "2 Crônicas 33", "url": "https://bkjfiel.com.br/2-cronicas-33/"}], "explain_html": "Crônicas acrescenta o arrependimento de Manassés ao retrato de Reis. A possibilidade de retorno não apaga o impacto prolongado das escolhas anteriores.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-33/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 33 na BKJ Fiel 1611 (requer internet)\">2Cr 33:12-16<\/a>"}, {"day": 216, "week": 31, "weekday": 6, "reading": "Naum 1-3", "passages": [["Naum", "1-3"]], "extra": false, "title": "O fim da cidade opressora", "nodes": [{"ref": "Na 1", "text": "O caráter divino combina paciência e justiça.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/naum-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Naum 1 na BKJ Fiel 1611 (requer internet)\">Na 1<\/a>"}, {"ref": "Na 2", "text": "A queda de Nínive é descrita poeticamente.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/naum-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Naum 2 na BKJ Fiel 1611 (requer internet)\">Na 2<\/a>"}, {"ref": "Na 3", "text": "Crueldade e exploração explicam a acusação.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/naum-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Naum 3 na BKJ Fiel 1611 (requer internet)\">Na 3<\/a>"}], "explain": "Naum anuncia juízo sobre um poder opressor. A linguagem não autoriza ódio étnico contra pessoas de qualquer nação atual.", "question": "Minha indignação combate opressão ou desumaniza povos?", "action": "Distinga ações injustas da dignidade das pessoas.", "cross": "Na 1:7", "links": [{"label": "Naum 1", "url": "https://bkjfiel.com.br/naum-1/"}, {"label": "Naum 2", "url": "https://bkjfiel.com.br/naum-2/"}, {"label": "Naum 3", "url": "https://bkjfiel.com.br/naum-3/"}], "explain_html": "Naum anuncia juízo sobre um poder opressor. A linguagem não autoriza ódio étnico contra pessoas de qualquer nação atual.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/naum-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Naum 1 na BKJ Fiel 1611 (requer internet)\">Na 1:7<\/a>"}, {"day": 217, "week": 31, "weekday": 7, "reading": "2 Reis 22-23; 2 Crônicas 34-35", "passages": [["2 Reis", "22-23"], ["2 Crônicas", "34-35"]], "extra": false, "title": "A palavra reencontrada", "nodes": [{"ref": "2Rs 22; 2Cr 34", "text": "O livro da lei é encontrado e Josias responde.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-reis-22/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Reis 22 na BKJ Fiel 1611 (requer internet)\">2Rs 22<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-34/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 34 na BKJ Fiel 1611 (requer internet)\">2Cr 34<\/a>"}, {"ref": "2Rs 23", "text": "A reforma alcança práticas e lugares de culto.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-reis-23/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Reis 23 na BKJ Fiel 1611 (requer internet)\">2Rs 23<\/a>"}, {"ref": "2Cr 35", "text": "A Páscoa é celebrada; o rei morre em batalha.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-cronicas-35/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Crônicas 35 na BKJ Fiel 1611 (requer internet)\">2Cr 35<\/a>"}], "explain": "Ouvir a palavra produz mudança visível. A reforma é significativa, mas não elimina automaticamente todas as consequências de uma história de infidelidade.", "question": "O que faço quando a Escritura confronta meu costume?", "action": "Mude uma prática à luz de algo compreendido na leitura.", "cross": "2Rs 22:11-13", "links": [{"label": "2 Reis 22", "url": "https://bkjfiel.com.br/2-reis-22/"}, {"label": "2 Reis 23", "url": "https://bkjfiel.com.br/2-reis-23/"}, {"label": "2 Crônicas 34", "url": "https://bkjfiel.com.br/2-cronicas-34/"}, {"label": "2 Crônicas 35", "url": "https://bkjfiel.com.br/2-cronicas-35/"}], "explain_html": "Ouvir a palavra produz mudança visível. A reforma é significativa, mas não elimina automaticamente todas as consequências de uma história de infidelidade.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-reis-22/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Reis 22 na BKJ Fiel 1611 (requer internet)\">2Rs 22:11-13<\/a>"}, {"day": 218, "week": 32, "weekday": 1, "reading": "Sofonias 1-3", "passages": [["Sofonias", "1-3"]], "extra": false, "title": "Juízo que chama à humildade", "nodes": [{"ref": "Sf 1", "text": "O dia do Senhor confronta falsa segurança.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/sofonias-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Sofonias 1 na BKJ Fiel 1611 (requer internet)\">Sf 1<\/a>"}, {"ref": "Sf 2", "text": "Humildade e busca de justiça são convocadas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/sofonias-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Sofonias 2 na BKJ Fiel 1611 (requer internet)\">Sf 2<\/a>"}, {"ref": "Sf 3", "text": "A denúncia de Jerusalém se abre à restauração.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/sofonias-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Sofonias 3 na BKJ Fiel 1611 (requer internet)\">Sf 3<\/a>"}], "explain": "O anúncio do juízo não serve apenas para falar dos outros. A comunidade que ouve a mensagem também é cha  class=\"bible-ref\" href=\"https://bkjfiel.com.br/esdras-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Esdras 1 na BKJ Fiel 1611 (requer internet)\">Ed 1<\/a>"}, {"ref": "Ed 2", "text": "Famílias e servidores são contados.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/esdras-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Esdras 2 na BKJ Fiel 1611 (requer internet)\">Ed 2<\/a>"}, {"ref": "Ed 3", "text": "Altar e fundamentos do templo reúnem alegria e choro.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/esdras-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Esdras 3 na BKJ Fiel 1611 (requer internet)\">Ed 3<\/a>"}], "explain": "A mesma obra pode despertar alegria e saudade. A comunidade precisa acolher diferentes memórias ao reconstruir sua vida.", "question": "Aceito que outras pessoas sintam diferente no recomeço?", "action": "Ouça a memória de alguém mais velho.", "cross": "Ed 3:11-13", "links": [{"label": "Esdras 1", "url": "https://bkjfiel.com.br/esdras-1/"}, {"label": "Esdras 2", "url": "https://bkjfiel.com.br/esdras-2/"}, {"label": "Esdras 3", "url": "https://bkjfiel.com.br/esdras-3/"}], "explain_html": "A mesma obra pode despertar alegria e saudade. A comunidade precisa acolher diferentes memórias ao reconstruir sua vida.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/esdras-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Esdras 3 na BKJ Fiel 1611 (requer internet)\">Ed 3:11-13<\/a>"}, {"day": 262, "week": 38, "weekday": 3, "reading": "Esdras 4-6; Salmos 137", "passages": [["Esdras", "4-6"], ["Salmos", "137"]], "extra": false, "title": "Reconstrução sob oposição", "nodes": [{"ref": "Ed 4", "text": "A oposição é narrada com episódios de diferentes reinados.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/esdras-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Esdras 4 na BKJ Fiel 1611 (requer internet)\">Ed 4<\/a>"}, {"ref": "Ed 5-6", "text": "A obra é retomada e o templo concluído.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/esdras-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Esdras 5 na BKJ Fiel 1611 (requer internet)\">Ed 5-6<\/a>"}, {"ref": "Sl 137", "text": "O exílio é lembrado em um lamento intenso.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-137/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 137 na BKJ Fiel 1611 (requer internet)\">Sl 137<\/a>"}], "explain": "Esdras 4 reúne documentos que antecipam conflitos posteriores; a sequência não é inteiramente linear. O salmo expressa trauma, não ordem de violência para o leitor.", "question": "Consigo reconstruir sem negar o trauma?", "action": "Reconheça uma dor antiga e uma possibilidade atual.", "cross": "Ed 6:14-16", "links": [{"label": "Esdras 4", "url": "https://bkjfiel.com.br/esdras-4/"}, {"label": "Esdras 5", "url": "https://bkjfiel.com.br/esdras-5/"}, {"label": "Esdras 6", "url": "https://bkjfiel.com.br/esdras-6/"}, {"label": "Salmos 137", "url": "https://bkjfiel.com.br/salmos-137/"}], "explain_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/esdras-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Esdras 4 na BKJ Fiel 1611 (requer internet)\">Esdras 4<\/a> reúne documentos que antecipam conflitos posteriores; a sequência não é inteiramente linear. O salmo expressa trauma, não ordem de violência para o leitor.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/esdras-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Esdras 6 na BKJ Fiel 1611 (requer internet)\">Ed 6:14-16<\/a>"}, {"day": 263, "week": 38, "weekday": 4, "reading": "Ageu 1, 2", "passages": [["Ageu", "1, 2"]], "extra": false, "title": "Prioridades em uma comunidade cansada", "nodes": [{"ref": "Ag 1", "text": "O povo é chamado a considerar seus caminhos.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ageu-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ageu 1 na BKJ Fiel 1611 (requer internet)\">Ag 1<\/a>"}, {"ref": "Ag 2:1-9", "text": "Os que lamentam a obra pequena recebem encorajamento.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ageu-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ageu 2 na BKJ Fiel 1611 (requer internet)\">Ag 2:1-9<\/a>"}, {"ref": "Ag 2:10-23", "text": "Santidade e esperança são reafirmadas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ageu-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ageu 2 na BKJ Fiel 1611 (requer internet)\">Ag 2:10-23<\/a>"}], "explain": "Ageu relaciona prioridades, culto e reconstrução. Não use o livro como fórmula para exigir doações ou explicar toda dificuldade financeira por falta de contribuição.", "question": "Minhas prioridades correspondem ao que digo valorizar?", "action": "Reserve tempo para uma responsabilidade negligenciada.", "cross": "Ag 1:5-8", "links": [{"label": "Ageu 1", "url": "https://bkjfiel.com.br/ageu-1/"}, {"label": "Ageu 2", "url": "https://bkjfiel.com.br/ageu-2/"}], "explain_html": "Ageu relaciona prioridades, culto e reconstrução. Não use o livro como fórmula para exigir doações ou explicar toda dificuldade financeira por falta de contribuição.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ageu-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ageu 1 na BKJ Fiel 1611 (requer internet)\">Ag 1:5-8<\/a>"}, {"day": 264, "week": 38, "weekday": 5, "reading": "Zacarias 1-7", "passages": [["Zacarias", "1-7"]], "extra": false, "title": "Visões para encorajar a reconstrução", "nodes": [{"ref": "Zc 1-2", "text": "Retorno e proteção são anunciados.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/zacarias-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Zacarias 1 na BKJ Fiel 1611 (requer internet)\">Zc 1-2<\/a>"}, {"ref": "Zc 3-4", "text": "Purificação e Espírito sustentam o serviço.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/zacarias-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Zacarias 3 na BKJ Fiel 1611 (requer internet)\">Zc 3-4<\/a>"}, {"ref": "Zc 5-7", "text": "A renovação inclui justiça, não apenas ritos.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/zacarias-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Zacarias 5 na BKJ Fiel 1611 (requer internet)\">Zc 5-7<\/a>"}], "explain": "As visões oferecem esperança à comunidade pós-exílica. A pergunta sobre jejum recebe resposta ética: ouvir, fazer justiça e exercer misericórdia.", "question": "Quero mudar rituais sem mudar relações?", "action": "Pratique uma forma concreta de misericórdia.", "cross": "Zc 4:6; Zc 7:9-10", "links": [{"label": "Zacarias 1", "url": "https://bkjfiel.com.br/zacarias-1/"}, {"label": "Zacarias 2", "url": "https://bkjfiel.com.br/zacarias-2/"}, {"label": "Zacarias 3", "url": "https://bkjfiel.com.br/zacarias-3/"}, {"label": "Zacarias 4", "url": "https://bkjfiel.com.br/zacarias-4/"}, {"label": "Zacarias 5", "url": "https://bkjfiel.com.br/zacarias-5/"}, {"label": "Zacarias 6", "url": "https://bkjfiel.com.br/zacarias-6/"}, {"label": "Zacarias 7", "url": "https://bkjfiel.com.br/zacarias-7/"}], "explain_html": "As visões oferecem esperança à comunidade pós-exílica. A pergunta sobre jejum recebe resposta ética: ouvir, fazer justiça e exercer misericórdia.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/zacarias-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Zacarias 4 na BKJ Fiel 1611 (requer internet)\">Zc 4:6<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/zacarias-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Zacarias 7 na BKJ Fiel 1611 (requer internet)\">Zc 7:9-10<\/a>"}, {"day": 265, "week": 38, "weekday": 6, "reading": "Zacarias 8-14", "passages": [["Zacarias", "8-14"]], "extra": false, "title": "O rei humilde e a esperança aberta", "nodes": [{"ref": "Zc 8", "text": "A restauração convoca verdade e paz.", "ref_htm .br/mateus-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 21 na BKJ Fiel 1611 (requer internet)\">Mt 21:4-5<\/a>"}, {"day": 266, "week": 38, "weekday": 7, "reading": "Ester 1-5", "passages": [["Ester", "1-5"]], "extra": false, "title": "Coragem em uma corte perigosa", "nodes": [{"ref": "Et 1-2", "text": "Ester entra no ambiente da corte persa.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ester-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ester 1 na BKJ Fiel 1611 (requer internet)\">Et 1-2<\/a>"}, {"ref": "Et 3", "text": "Hamã planeja destruir os judeus.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ester-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ester 3 na BKJ Fiel 1611 (requer internet)\">Et 3<\/a>"}, {"ref": "Et 4-5", "text": "Ester decide interceder e inicia sua estratégia.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ester-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ester 4 na BKJ Fiel 1611 (requer internet)\">Et 4-5<\/a>"}], "explain": "O livro mostra vulnerabilidade e risco sob poder imperial. A decisão de Ester reúne coragem, prudência e solidariedade, sem garantir controle do resultado.", "question": "Como uso uma posição de acesso para proteger outros?", "action": "Apoie alguém que não consegue ser ouvido.", "cross": "Et 4:13-16", "links": [{"label": "Ester 1", "url": "https://bkjfiel.com.br/ester-1/"}, {"label": "Ester 2", "url": "https://bkjfiel.com.br/ester-2/"}, {"label": "Ester 3", "url": "https://bkjfiel.com.br/ester-3/"}, {"label": "Ester 4", "url": "https://bkjfiel.com.br/ester-4/"}, {"label": "Ester 5", "url": "https://bkjfiel.com.br/ester-5/"}], "explain_html": "O livro mostra vulnerabilidade e risco sob poder imperial. A decisão de Ester reúne coragem, prudência e solidariedade, sem garantir controle do resultado.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ester-4/\" target=\"_blank\" rel=\"noopener\" title= emias", "1-5"]], "extra": false, "title": "Reconstruir muros e relações", "nodes": [{"ref": "Ne 1-2", "text": "Neemias ora, planeja e examina a cidade.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/neemias-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Neemias 1 na BKJ Fiel 1611 (requer internet)\">Ne 1-2<\/a>"}, {"ref": "Ne 3-4", "text": "O trabalho é compartilhado sob oposição.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/neemias-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Neemias 3 na BKJ Fiel 1611 (requer internet)\">Ne 3-4<\/a>"}, {"ref": "Ne 5", "text": "A exploração entre irmãos precisa ser corrigida.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/neemias-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Neemias 5 na BKJ Fiel 1611 (requer internet)\">Ne 5<\/a>"}], "explain": "Não basta erguer muros enquanto a comunidade explora seus pobres. A reconstrução física exige coerência econômica e justiça interna.", "question": "Meu projeto melhora estruturas e relações?", "action": "Corrija uma prática que sobrecarrega alguém.", "cross": "Ne 5:9-12", "links": [{"label": "Neemias 1", "url": "https://bkjfiel.com.br/neemias-1/"}, {"label": "Neemias 2", "url": "https://bkjfiel.com.br/neemias-2/"}, {"label": "Neemias 3", "url": "https://bkjfiel.com.br/neemias-3/"}, {"label": "Neemias 4", "url": "https://bkjfiel.com.br/neemias-4/"}, {"label": "Neemias 5", "url": "https://bkjfiel.com.br/neemias-5/"}], "explain_html": "Não basta erguer muros enquanto a comunidade explora seus pobres. A reconstrução física exige coerência econômica e justiça interna.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/neemias-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Neemias 5 na BKJ Fiel 1611 (requer internet)\">Ne 5:9-12<\/a>"}, {"day": 270, "week": 39, "weekday": 4, "reading": "Neemias 6, 7", "passages": [["Neemias", "6, 7"]], "extra": false, "title": "Discernimento diante eu ambiente habitual.", "cross": "Lc 5:10-11", "links": [{"label": "Mateus 4", "url": "https://bkjfiel.com.br/mateus-4/"}, {"label": "Lucas 4", "url": "https://bkjfiel.com.br/lucas-4/"}, {"label": "Lucas 5", "url": "https://bkjfiel.com.br/lucas-5/"}, {"label": "João 1", "url": "https://bkjfiel.com.br/joao-1/"}], "explain_html": "A missão reúne palavra e cuidado. Resistir à tentação não é usar textos como fórmulas, mas confiar no Pai dentro do sentido das Escrituras.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 5 na BKJ Fiel 1611 (requer internet)\">Lc 5:10-11<\/a>"}, {"day": 279, "week": 40, "weekday": 6, "reading": "João 2-4", "passages": [["João", "2-4"]], "extra": false, "title": "Encontros que ultrapassam barreiras", "nodes": [{"ref": "Jo 2", "text": "Caná e o templo revelam aspectos da missão.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 2 na BKJ Fiel 1611 (requer internet)\">Jo 2<\/a>"}, {"ref": "Jo 3", "text": "Nicodemos ouve sobre novo nascimento.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 3 na BKJ Fiel 1611 (requer internet)\">Jo 3<\/a>"}, {"ref": "Jo 4", "text": "A samaritana e um oficial encontram Jesus.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 4 na BKJ Fiel 1611 (requer internet)\">Jo 4<\/a>"}], "explain": "Jesus conversa com pessoas de lugares e condições diversas. A água viva aponta para um dom que não depende de prestígio ou pertencimento étnico.", "question": "Que barreira impede uma conversa respeitosa?", "action": "Escute alguém de um contexto diferente do seu.", "cross": "Jo 4:23-26", "links": [{"label": "João 2", "url": "https://bkjfiel.com.br/joao-2/"}, {"label": "João 3", "url": "https://bkjfi : "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/marcos-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Marcos 2 na BKJ Fiel 1611 (requer internet)\">Mc 2:27-28<\/a>"}, {"day": 281, "week": 41, "weekday": 1, "reading": "João 5", "passages": [["João", "5"]], "extra": false, "title": "Vida e autoridade do Filho", "nodes": [{"ref": "Jo 5:1-18", "text": "A cura junto ao tanque provoca controvérsia.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 5 na BKJ Fiel 1611 (requer internet)\">Jo 5:1-18<\/a>"}, {"ref": "Jo 5:19-30", "text": "Jesus fala de sua relação com o Pai e da ressurreição.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 5 na BKJ Fiel 1611 (requer internet)\">Jo 5:19-30<\/a>"}, {"ref": "Jo 5:31-47", "text": "Testemunhos e Escrituras apontam para ele.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 5 na BKJ Fiel 1611 (requer internet)\">Jo 5:31-47<\/a>"}], "explain": "Conhecer textos sem acolher aquele a quem eles testemunham esvazia a leitura. O capítulo reúne cuidado concreto e afirmações sobre vida e juízo.", "question": "Minha leitura me torna mais próximo de Cristo e das pessoas?", "action": "Una o estudo de hoje a um gesto de cuidado.", "cross": "Jo 5:39-40", "links": [{"label": "João 5", "url": "https://bkjfiel.com.br/joao-5/"}], "explain_html": "Conhecer textos sem acolher aquele a quem eles testemunham esvazia a leitura. O capítulo reúne cuidado concreto e afirmações sobre vida e juízo.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 5 na BKJ Fiel 1611 (requer internet)\">Jo 5:39-40<\/a>"}, {"day": 282, "week": 41, "weekday": 2, "reading": "Mateus 12:1-21; Marcos 3; Lucas 6", "passages": [["Mateus", "12:1-21"], ["Marcos", "3"], ["Lucas", "6"]], "extra": false, "title": "O bem no centro do discipulado", "nodes": [{"ref": "Mt 12:1-21", "text": "Misericórdia e serviço do Servo orientam a missão.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/mateus-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 12 na BKJ Fiel 1611 (requer internet)\">Mt 12:1-21<\/a>"}, {"ref": "Mc 3", "text": "Cura, escolha dos doze e oposição se entrelaçam.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/marcos-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Marcos 3 na BKJ Fiel 1611 (requer internet)\">Mc 3<\/a>"}, {"ref": "Lc 6", "text": "Jesus ensina amor, discernimento e prática.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 6 na BKJ Fiel 1611 (requer internet)\">Lc 6<\/a>"}], "explain": "As comparações mostram ênfases de cada evangelista. O chamado ao amor dos inimigos não elimina limites protetivos nem exige tolerar abuso.", "question": "Minha fé produz misericórdia concreta?", "action": "Faça o bem sem exigir reconhecimento.", "cross": "Lc 6:27-36", "links": [{"label": "Mateus 12", "url": "https://bkjfiel.com.br/mateus-12/"}, {"label": "Marcos 3", "url": "https://bkjfiel.com.br/marcos-3/"}, {"label": "Lucas 6", "url": "https://bkjfiel.com.br/lucas-6/"}], "explain_html": "As comparações mostram ênfases de cada evangelista. O chamado ao amor dos inimigos não elimina limites protetivos nem exige tolerar abuso.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 6 na BKJ Fiel 1611 (requer internet)\">Lc 6:27-36<\/a>"}, {"day": 283, "week": 41, "weekday": 3, "reading": "Mateus 5-7", "passages": [["Mateus", "5-7"]], "extra": false, "title": "Ouvir e construir sobre a rocha", "nodes": [{"ref": "Mt 5", "text": "O reino alcança caráter e relações.", "ref_html": "<a class=\"b ulo de Jesus não basta se recusamos o caminho de serviço. A cruz não legitima abuso imposto por outra pessoa.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/marcos-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Marcos 8 na BKJ Fiel 1611 (requer internet)\">Mc 8:34-35<\/a>"}, {"day": 294, "week": 42, "weekday": 7, "reading": "Mateus 17; Marcos 9; Lucas 9:28-62", "passages": [["Mateus", "17"], ["Marcos", "9"], ["Lucas", "9:28-62"]], "extra": false, "title": "Glória que conduz ao serviço", "nodes": [{"ref": "Mt 17; Mc 9", "text": "A transfiguração revela Jesus e chama à escuta.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/mateus-17/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 17 na BKJ Fiel 1611 (requer internet)\">Mt 17<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/marcos-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Marcos 9 na BKJ Fiel 1611 (requer internet)\">Mc 9<\/a>"}, {"ref": "Lc 9:28-50", "text": "Cura e discussões sobre grandeza se sucedem.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 9 na BKJ Fiel 1611 (requer internet)\">Lc 9:28-50<\/a>"}, {"ref": "Lc 9:51-62", "text": "O caminho a Jerusalém exige decisão.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 9 na BKJ Fiel 1611 (requer internet)\">Lc 9:51-62<\/a>"}], "explain": "A experiência no monte não afasta os discípulos das necessidades no vale. O relato corrige rivalidade e desejo de responder à rejeição com destruição.", "question": "Minha experiência espiritual melhora meu serviço?", "action": "Ajude alguém em uma necessidade que vinha adiando.", "cross": "Lc 9:46-48", "links": [{"label": "Mateus 17", "url": "https://bkjfiel.com.br/mateus-17/"}, {"label": "Marcos 9", "url": "https://bkjfiel.com.br/marcos-9/"}, {"label": "Lucas 9", "url": "https:/ in_html": "A carta combina doutrina e cuidado concreto. Textos sobre papéis na comunidade exigem leitura contextual e não legitimam desvalorização de mulheres ou exploração financeira.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-timoteo-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Timóteo 4 na BKJ Fiel 1611 (requer internet)\">1Tm 4:12<\/a>"}, {"day": 353, "week": 51, "weekday": 3, "reading": "Tito 1-3", "passages": [["Tito", "1-3"]], "extra": false, "title": "Graça que educa", "nodes": [{"ref": "Tt 1", "text": "Liderança e ensino devem resistir à incoerência.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/tito-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Tito 1 na BKJ Fiel 1611 (requer internet)\">Tt 1<\/a>"}, {"ref": "Tt 2", "text": "A vida cotidiana deve corresponder à graça.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/tito-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Tito 2 na BKJ Fiel 1611 (requer internet)\">Tt 2<\/a>"}, {"ref": "Tt 3", "text": "Misericórdia recebida produz boas obras.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/tito-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Tito 3 na BKJ Fiel 1611 (requer internet)\">Tt 3<\/a>"}], "explain": "Boas obras são fruto da salvação, não seu preço. A graça educa desejos e relações, em vez de oferecer apenas uma identidade religiosa.", "question": "Que fruto concreto minha gratidão produz?", "action": "Faça o bem sem transformar o gesto em mérito.", "cross": "Tt 3:4-8", "links": [{"label": "Tito 1", "url": "https://bkjfiel.com.br/tito-1/"}, {"label": "Tito 2", "url": "https://bkjfiel.com.br/tito-2/"}, {"label": "Tito 3", "url": "https://bkjfiel.com.br/tito-3/"}], "explain_html": "Boas obras são fruto da salvação, não seu preço. A graça educa desejos e relações, em vez de oferecer apenas uma identidade religiosa.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/tito-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Tito 3 na BKJ Fiel 1611 (requer internet)\">Tt 3:4-8<\/a>"}, {"day": 354, "week": 51, "weekday": 4, "reading": "1 Pedro 1-5", "passages": [["1 Pedro", "1-5"]], "extra": false, "title": "Esperança em meio à pressão", "nodes": [{"ref": "1Pe 1-2", "text": "Nova vida e identidade orientam o testemunho.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-pedro-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Pedro 1 na BKJ Fiel 1611 (requer internet)\">1Pe 1-2<\/a>"}, {"ref": "1Pe 3-4", "text": "Sofrimento e resposta respeitosa são considerados.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-pedro-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Pedro 3 na BKJ Fiel 1611 (requer internet)\">1Pe 3-4<\/a>"}, {"ref": "1Pe 5", "text": "Liderança e vigilância concluem a exortação.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-pedro-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Pedro 5 na BKJ Fiel 1611 (requer internet)\">1Pe 5<\/a>"}], "explain": "As orientações a pessoas vulneráveis em estruturas antigas não aprovam abuso. A esperança deve sustentar dignidade, proteção e uma resposta que não multiplique o mal.", "question": "Dou razão da esperança com mansidão?", "action": "Explique uma convicção sem hostilidade.", "cross": "1Pe 3:15-16", "links": [{"label": "1 Pedro 1", "url": "https://bkjfiel.com.br/1-pedro-1/"}, {"label": "1 Pedro 2", "url": "https://bkjfiel.com.br/1-pedro-2/"}, {"label": "1 Pedro 3", "url": "https://bkjfiel.com.br/1-pedro-3/"}, {"label": "1 Pedro 4", "url": "https://bkjfiel.com.br/1-pedro-4/"}, {"label": "1 Pedro 5", "url": "https://bkjfiel.com.br/1-pedro-5/"}], "explain_html": "As orientações a pessoas vulneráveis em estruturas antigas não aprovam abuso. A esperança deve sustentar dignidade, proteção e uma resposta que não multiplique o mal.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-pedro-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Pedro 3 na BKJ Fiel 1611 (requer internet)\">1Pe 3:15-16<\/a>"}, {"day": 355, "week": 51, "weekday": 5, "reading": "Hebreus 1-6", "passages": [["Hebreus", "1-6"]], "extra": false, "title": "O Filho e o acesso a Deus", "nodes": [{"ref": "Hb 1-2", "text": "A grandeza do Filho se une à solidariedade humana.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 1 na BKJ Fiel 1611 (requer internet)\">Hb 1-2<\/a>"}, {"ref": "Hb 3-4", "text": "Fidelidade e descanso convocam perseverança.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 3 na BKJ Fiel 1611 (requer internet)\">Hb 3-4<\/a>"}, {"ref": "Hb 5-6", "text": "Sacerdócio e maturidade orientam o crescimento.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 5 na BKJ Fiel 1611 (requer internet)\">Hb 5-6<\/a>"}], "explain": "Jesus é apresentado como aquele que compreende a fragilidade humana. Advertências sérias não devem ser usadas para afastar quem busca arrependimento e auxílio.", "question": "Procuro ajuda com confiança ou escondo minha necessidade?", "action": "Ore com sinceridade por uma área de fraqueza.", "cross": "Hb 4:14-16", "links": [{"label": "Hebreus 1", "url": "https://bkjfiel.com.br/hebreus-1/"}, {"label": "Hebreus 2", "url": "https://bkjfiel.com.br/hebreus-2/"}, {"label": "Hebreus 3", "url": "https://bkjfiel.com.br/hebreus-3/"}, {"label": "Hebreus 4", "url": "https://bkjfiel.com.br/hebreus-4/"}, {"label": "Hebreus 5", "url": "https://bkjfiel.com.br/hebreus-5/"}, {"label": "Hebreus 6", "url": "https://bkjfiel.com.br/hebreus-6/"}], "explain_html": "Jesus é apresentado como aquele que compreende a fragilidade humana. Advertências sérias não devem ser usadas para afastar quem busca arrependimento e auxílio.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 4 na BKJ Fiel 1611 (requer internet)\">Hb 4:14-16<\/a>"}, {"day": 356, "week": 51, "weekday": 6, "reading": "Hebreus 7-10", "passages": [["Hebreus", "7-10"]], "extra": false, "title": "Um sacrifício suficiente", "nodes": [{"ref": "Hb 7", "text": "O sacerdócio de Cristo é explicado.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 7 na BKJ Fiel 1611 (requer internet)\">Hb 7<\/a>"}, {"ref": "Hb 8-9", "text": "Nova aliança e santuário esclarecem sua mediação.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 8 na BKJ Fiel 1611 (requer internet)\">Hb 8-9<\/a>"}, {"ref": "Hb 10", "text": "O sacrifício único fundamenta confiança e perseverança.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-10/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 10 na BKJ Fiel 1611 (requer internet)\">Hb 10<\/a>"}], "explain": "Na perspectiva adventista, a mediação celestial aplica os benefícios da entrega de Cristo. Ela não significa repetir ou tornar insuficiente o sacrifício da cruz.", "question": "Minha confiança está em Cristo ou no meu desempenho?", "action": "Aproxime-se de Deus com gratidão e sinceridade.", "cross": "Hb 10:19-25", "links": [{"label": "Hebreus 7", "url": "https://bkjfiel.com.br/hebreus-7/"}, {"label": "Hebreus 8", "url": "https://bkjfiel.com.br/hebreus-8/"}, {"label": "Hebreus 9", "url": "https://bkjfiel.com.br/hebreus-9/"}, {"label": "Hebreus 10", "url": "https://bkjfiel.com.br/hebreus-10/"}], "explain_html": "Na perspectiva adventista, a mediação celestial aplica os benefícios da entrega de Cristo. Ela não significa repetir ou tornar insuficiente o sacrifício da cruz.", "cross_html": "<a class=\"b
