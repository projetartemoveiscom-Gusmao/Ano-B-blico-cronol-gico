iel 1611 (requer internet)\">Hb 11:35-40<\/a>"}, {"day": 358, "week": 52, "weekday": 1, "reading": "2 Timóteo 1-4", "passages": [["2 Timóteo", "1-4"]], "extra": false, "title": "Guardar e transmitir a palavra", "nodes": [{"ref": "2Tm 1", "text": "Timóteo é encorajado a não se envergonhar.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-timoteo-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Timóteo 1 na BKJ Fiel 1611 (requer internet)\">2Tm 1<\/a>"}, {"ref": "2Tm 2-3", "text": "Fidelidade, ensino e Escritura orientam o serviço.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-timoteo-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Timóteo 2 na BKJ Fiel 1611 (requer internet)\">2Tm 2-3<\/a>"}, {"ref": "2Tm 4", "text": "Paulo enfrenta o fim com esperança.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-timoteo-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Timóteo 4 na BKJ Fiel 1611 (requer internet)\">2Tm 4<\/a>"}], "explain": "Transmitir a fé exige caráter, paciência e conteúdo. A despedida reconhece solidão e confiança, sem transformar o ministro em alguém sem necessidades.", "question": "Que legado de ensino e cuidado estou deixando?", "action": "Compartilhe um aprendizado com paciência.", "cross": "2Tm 3:14-17", "links": [{"label": "2 Timóteo 1", "url": "https://bkjfiel.com.br/2-timoteo-1/"}, {"label": "2 Timóteo 2", "url": "https://bkjfiel.com.br/2-timoteo-2/"}, {"label": "2 Timóteo 3", "url": "https://bkjfiel.com.br/2-timoteo-3/"}, {"label": "2 Timóteo 4", "url": "https://bkjfiel.com.br/2-timoteo-4/"}], "explain_html": "Transmitir a fé exige caráter, paciência e conteúdo. A despedida reconhece solidão e confiança, sem transformar o ministro em alguém sem necessidades.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-timoteo-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Timóteo 3 na BKJ Fiel 1611 (requer internet)\">2Tm 3:14-17<\/a>"}, {"day ssets/jo.png", "origens.png": "./assets/origens.png", "pergaminho.png": "./assets/pergaminho.png"}};</script><script>(()=>{'use strict';
const DATA=window.STUDY,KEY='ano-biblico-completo-v1',main=document.querySelector('main'),toast=document.querySelector('#toast');let timer,saveTimer,installEvent,route={type:'home'},frozen=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={version:1,completed:[],notes:{},bookmark:null},storage=true;
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.version===1)state=clean(old);}catch{storage=false;}
function clean(x){return {version:1,completed:[...new Set((Array.isArray(x.completed)?x.completed:[]).filter(n=>Number.isInteger(n)&&n>=1&&n<=365))],notes:Object.fromEntries(Object.entries(x.notes||{}).filter(([k,v])=>/^\d+$/.test(k)&&+k>=1&&+k<=365&&typeof v==='string').map(([k,v])=>[k,v.slice(0,30000)])),bookmark:x.bookmark&&Number.isInteger(x.bookmark.day)&&x.bookmark.day>=1&&x.bookmark.day<=365?{day:x.bookmark.day,y:Math.max(0,Math.min(100000,Number(x.bookmark.y)||0))}:null};}

function mark(){if(route.type==='day'&&!frozen){state.bookmark={day:route.id,y:scrollY};persist();}}
function art(w){const a=w.art,[cols,rows]=a.grid,x=a.cell%cols,y=Math.floor(a.cell/cols),posx=cols===1?0:x/(cols-1)*100,posy=rows===1?0:y/(rows-1)*100;return `<figure><div class="art" role="img" aria-label="${esc(a.label)}" style="background-image:url('${DATA.images[a.file]}');background-size:${cols*100}% ${rows*100}%;background-position:${posx}% ${posy}%;aspect-ratio:${a.file==='jo.png'?'2/1':a.file==='origens.png'?'2/1':'3/2'}"></div><figcaption>${esc(a.label)} · imagem gerada por IA</figcaption></figure>`;}
const weeks=n=>DATA.weeks[n-1],days=n=>DATA.days[n-1];

function dayCard(d){return `<a class="day-card" href="#dia-${d.day}"><span class="number">${String(d.day).padStart(3,'0')}</span><div><strong>${esc(d.title)}</strong><small>${esc(d.reading)}</small></div>${state.completed.includes(d.day)?'<span aria-label="Concluído">✓</span>':''}</a>`;}
function home(){return `<header><p class="eyebrow">365 dias · 66 livros · uma caminhada</p><h1>Ano Bíblico<br>Conceitual</h1><p class="lead">Leia com atenção. Compreenda as conexões. Leve a Palavra à vida.</p><div class="progress"><strong>${state.completed.length} de 365 dias concluídos</strong><progress max="365" value="${state.completed.length}" aria-label="Progresso anual"></progress></div><button class="primary" data-resume>${state.bookmark?'Continuar de onde parei':'Começar o dia 1'}</button></header><section class="hint"><strong>Seus atalhos de leitura</strong><p>A Bíblia abre em outra aba. Retorne a esta aba e toque em “Onde parei”. Anotações e progresso ficam neste navegador; faça uma cópia pelo botão ao final.</p><p id="install-help">${location.protocol==='file:'?'Esta versão abre como arquivo. A instalação no Android requer a versão publicada em endereço seguro.':'No Android, use o menu do navegador para adicionar à tela inicial, quando disponível.'}</p><button id="install" hidden>Instalar aplicativo</button><p id="offline-status"></p></section><section><h2>Encontre sua leitura</h2><label for="search">Busque por livro, tema ou número do dia</label><input id="search" type="search" placeholder="Ex.: Jó, perdão, 120" autocomplete="off"><div id="results" aria-live="polite"></div></section><section><h2>As 52 semanas</h2><div class="week-grid">${DATA.weeks.map(w=>`<a class="week-card" href="#semana-${w.week}"><span>Semana ${String(w.week).padStart(2,'0')}</span><strong>${esc(w.title)}</strong><small>Dias ${(w.week-1)*7+1} a ${w.week*7}</small></a>`).join('')}</div><a class="final-day" href="#dia-365">Dia 365 · Tudo se faz novo →</a></section><section><h2>Suas anotações</h2><p>Uma cópia permite guardar ou transferir progresso e anotações. Nada é enviado a outra pessoa.</p><button data-export>Guardar minhas anotações</button><label class="file-button">Abrir uma cópia salva<input type="file" id="import" accept="application/json,.json"></label></section><section><h2>Como ler este plano</h2><p>São 52 semanas e um dia de conclusão. Comece em qualquer data. A ordem é aproximada e inclui agrupamentos temáticos; não pretende fixar a data de cada salmo, profecia ou carta.</p><p>Mapas selecionam eixos da leitura. Comentários são autorais e distinguem texto, interpretação e aplicação. A perspectiva adventista é identificada nas conexões. O hebraico do pergaminho é decorativo, não uma transcrição validada.</p><p>Referências: <a href="https://bkjfiel.com.br/" target="_blank" rel="noopener">King James Fiel 1611</a> e <a href="https://adventist.org/en/beliefs" target="_blank" rel="noopener">crenças adventistas</a>. Material independente de estudo, não publicação oficial da Igreja.</p></section>`;}
function week(w){return `<p class="eyebrow">Semana ${w.week} · visão do percurso</p><h1>${esc(w.title)}</h1>${art(w)}<p class="lead">${w.context_html}</p><div class="day-list">${DATA.days.filter(d=>d.week===w.week&&!d.extra).map(dayCard).join('')}</div>${w.week===52?dayCard(days(365)):''}<section class="hint"><h2>Promessas e conexões</h2><p>${w.promise_html}</p><p>${w.cross_html}</p></section><section><h2>Revise a semana</h2><p>${esc(w.question)}</p><p>Compare dois dias: o que mudou na narrativa ou no argumento? Registre uma conclusão apoiada em uma referência e uma atitude possível para a próxima semana.</p></section><div class="pager">${w.week>1?`<a href="#semana-${w.week-1}">← Semana anterior</a>`:''}${w.week<52?`<a href="#semana-${w.week+1}">Próxima semana →</a>`:''}</div>`;}
function day(d){const w=weeks(d.week);return `<p class="eyebrow">${d.extra?'Conclusão do ano':`Semana ${d.week} · dia da semana ${d.weekday}`} · Dia ${d.day}/365</p><h1>${esc(d.title)}</h1><p class="reading">${esc(d.reading)}</p><div class="chapters">${d.links.map(readingLink).join('')}</div><p class="micro">Os links abrem capítulos inteiros. Siga os versículos indicados quando houver leitura parcial.</p>${d.day===4||d.day===7?art(weeks(2)):art(w)}<section id="mapa"><h2>Mapa conceitual</h2><p class="micro">As setas acompanham a leitura, sem impor datas ou uma sequência única a relatos paralelos.</p><ol class="map">${d.nodes.map(n=>`<li><p>${esc(n.text)}</p><div class="refs">${n.ref_html}</div></li>`).join('')}</ol></section><section id="explicacao"><h2>Compreenda a leitura</h2><p>${d.explain_html}</p></section><section class="hint" id="conexao"><h2>${d.focus_html?'Conexão para aprofundar':'Conexão com o conjunto da semana'}</h2><p>${d.focus_html||w.promise_html}</p><p>${d.cross_html}</p>${d.caution_html?`<h3>Cuidado na interpretação</h3><p>${d.caution_html}</p>`:''}</section><section id="vida"><h2>Leve à vida</h2><h3>Para refletir</h3><p>${esc(d.question)}</p><h3>Uma atitude para hoje</h3><p>${esc(d.action)}</p></section><section id="registro"><label for="note">Minha descoberta, minha oração e meu próximo passo</label><textarea id="note" rows="7" placeholder="Registre suas anotações…">${esc(state.notes[d.day]||'')}</textarea><label class="check"><input id="done" type="checkbox" ${state.completed.includes(d.day)?'checked':''}> Concluí a leitura bíblica e o estudo deste dia</label><p class="micro">${storage?'Salvo neste navegador quando você escreve ou marca a leitura.':'O armazenamento está indisponível. Guarde uma cópia antes de fechar.'}</p></section><div class="pager">${d.day>1?`<a href="#dia-${d.day-1}">← Dia anterior</a>`:''}${d.day<365?`<a href="#dia-${d.day+1}">Próximo dia →</a>`:'<a href="#inicio">Voltar ao ano completo →</a>'}</div>`;}
function parse(hash){let m;if((m=/^#dia-(\d+)$/.exec(hash))&&+m[1]>=1&&+m[1]<=365)return {type:'day',id:+m[1]};if((m=/^#semana-(\d+)$/.exec(hash))&&+m[1]>=1&&+m[1]<=52)return {type:'week',id:+m[1]};return {type:'home'};}
function render(){frozen=true;route=parse(location.hash);main.innerHTML=route.type==='day'?day(days(route.id)):route.type==='week'?week(weeks(route.id)):home();document.querySelector('[data-week]').disabled=route.type==='home'&&!state.bookmark;document.title=(route.type==='day'?`Dia ${route.id} · ${days(route.id).title}`:route.type==='week'?`Semana ${route.id}`:'Ano Bíblico Conceitual');window.scrollTo(0,0);setTimeout(()=>{frozen=false;},150);if(route.type==='home')setupInstall();}
function resume(){const b=state.bookmark;if(!b){location.hash='#dia-1';return;}const dest='#dia-'+b.day;frozen=true;if(location.hash!==dest){location.hash=dest;}else render();setTimeout(()=>{window.scrollTo(0,b.y);frozen=false;},220);}
document.addEventListener('click',e=>{const target=e.target;if(target.closest('[data-resume]')){resume();return;}if(target.closest('[data-home]')){mark();location.hash='#inicio';return;}if(target.closest('[data-week]')){const n=route.type==='week'?route.id:route.type==='day'?days(route.id).week:state.bookmark?days(state.bookmark.day).week:1;mark();location.hash='#semana-'+n;return;}const a=target.closest('a');if(a){if(a.classList.contains('bible-ref')){mark();tell('A Bíblia abre em outra aba. Volte a esta aba para continuar.');}else if(a.getAttribute('href')?.startsWith('#'))mark();}if(target.closest('[data-export]')){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='minhas-anotacoes-ano-biblico.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}if(target.closest('#install')&&installEvent){installEvent.prompt();installEvent=null;}});
document.addEventListener('input',e=>{if(e.target.id==='note'&&route.type==='day'){state.notes[route.id]=e.target.value;clearTimeout(saveTimer);saveTimer=setTimeout(persist,250);}if(e.target.id==='search'){const raw=e.target.value.trim(),q=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();document.querySelector('#results').innerHTML=q?DATA.days.filter(d=>(/^\d+$/.test(q)?d.day===+q:(d.title+' '+d.reading).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q))).map(dayCard).join('')||'<p>Nenhuma leitura encontrada.</p>':'';}});
document.addEventListener('change',async e=>{if(e.target.id==='done'&&route.type==='day'){state.completed=state.completed.filter(n=>n!==route.id);if(e.target.checked)state.completed.push(route.id);persist();}if(e.target.id==='import'){const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(incoming.version!==1||!Array.isArray(incoming.completed)||!incoming.notes)throw Error();const v=clean(incoming);if(!confirm('Unir esta cópia às suas anotações? Nos dias com texto nas duas versões, ficará o texto da cópia.'))return;state=clean({version:1,completed:[...state.completed,...v.completed],notes:{...state.notes,...v.notes},bookmark:v.bookmark||state.bookmark});persist();render();tell('Cópia importada.');}catch{tell('Este arquivo não é uma cópia válida das anotações.');}}});
let scrollTimer;addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(mark,350);},{passive:true});addEventListener('pagehide',()=>{clearTimeout(saveTimer);mark();persist();});addEventListener('hashchange',render);
function setupInstall(){const btn=document.querySelector('#install');if(btn&&installEvent)btn.hidden=false;const s=document.querySelector('#offline-status');if(s&&location.protocol!=='file:')s.textContent=window.offlineReady?'Conteúdo do estudo disponível sem internet neste aparelho. A Bíblia externa precisa de conexão.':'Preparando o conteúdo para leitura sem internet…';}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;setupInstall();});
document.documentElement.style.setProperty('--paper',`url('${DATA.images['pergaminho.png']}')`);render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{window.offlineReady=true;setupInstall();}).catch(()=>{const s=document.querySelector('#offline-status');if(s)s.textContent='Não foi possível preparar a leitura sem internet. Tente novamente com conexão.';});}
window.yearStudy={parse,clean};
if(document.modelContext?.registerTool){
 const lifecycle=new AbortController();
 const defs=[
  {name:'read_study_progress',title:'Consultar progresso de leitura',description:'Consulta os dias concluídos e o último ponto salvo neste navegador, sem incluir anotações pessoais.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw Error('Informe um objeto vazio.');return {completed:[...state.completed],total:365,bookmark:state.bookmark?{...state.bookmark}:null};}},
  {name:'open_study_day',title:'Abrir um dia do estudo',description:'Guarda o ponto atual e abre na tela um dia de 1 a 365. Não marca a leitura como concluída.',inputSchema:{type:'object',properties:{day:{type:'integer',minimum:1,maximum:365}},required:['day'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},async execute(input){if(!input||Object.keys(input).some(k=>k!=='day')||!Number.isInteger(input.day)||input.day<1||input.day>365)throw Error('O dia deve ser um inteiro de 1 a 365.');mark();location.hash='#dia-'+input.day;render();return {day:input.day,title:days(input.day).title,reading:days(input.day).reading};}}
 ];
 for(const tool of defs){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}}
 addEventListener('pagehide',e=>{if(!e.persisted)lifecycle.abort();});
}
})();
</script></body></html>
