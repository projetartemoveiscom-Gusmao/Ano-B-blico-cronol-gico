ener\" title=\"Abrir Lucas 9 na BKJ Fiel 1611 (requer internet)\">Lc 9:35<\/a>"}, {"week": 43, "title": "O Pastor procura os perdidos", "context": "Jesus ensina sobre os pequenos, o perdão, a oração e o uso dos recursos. O bom Pastor contrasta com quem explora o rebanho. Parábolas de reencontro mostram alegria pela restauração e confrontam ressentimento. Leia-as por sua finalidade principal, evitando transformar cada detalhe narrativo em uma descrição literal do mundo espiritual.", "promise": "Jo 10 desenvolve a promessa pastoral de Ez 34. As parábolas de Lc 15 mostram acolhimento, não uma previsão a ser datada. Na leitura adventista, Lc 16:19-31 ensina sobre resposta e compaixão, sem funcionar como descrição literal do estado dos mortos.", "question": "Alegramo-nos quando a graça alcança alguém que considerávamos distante?", "cross": "Ez 34:11-16; Jo 10:11; Lc 15:20-32", "art": {"file": "cenas-03.png", "grid": [2, 2], "cell": 0, "label": "Jesus ensinando: representação artística"}, "context_html": "Jesus ensina sobre os pequenos, o perdão, a oração e o uso dos recursos. O bom Pastor contrasta com quem explora o rebanho. Parábolas de reencontro mostram alegria pela restauração e confrontam ressentimento. Leia-as por sua finalidade principal, evitando transformar cada detalhe narrativo em uma descrição literal do mundo espiritual.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-10/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 10 na BKJ Fiel 1611 (requer internet)\">Jo 10<\/a> desenvolve a promessa pastoral de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ezequiel-34/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ezequiel 34 na BKJ Fiel 1611 (requer internet)\">Ez 34<\/a>. As parábolas de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 15 na BKJ Fiel 1611 (requer internet)\">Lc 15<\/a> mostram acolhimento, não uma previsão a ser datada. Na leitura adventista, <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-16/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 16 na BKJ Fiel 1611 (requer internet)\">Lc 16:19-31<\/a> ensina sobre resposta e compaixão, sem funcionar como descrição literal do estado dos mortos.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/ezequiel-34/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Ezequiel 34 na BKJ Fiel 1611 (requer internet)\">Ez 34:11-16<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-10/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 10 na BKJ Fiel 1611 (requer internet)\">Jo 10:11<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 15 na BKJ Fiel 1611 (requer internet)\">Lc 15:20-32<\/a>"}, {"week": 44, "title": "O rei humilde caminha para Jerusalém", "context": "A ressurreição de Lázaro intensifica esperança e oposição. Jesus acolhe crianças, confronta a confiança na riqueza e redefine grandeza como serviço. A entrada em Jerusalém e os debates no templo aproximam a paixão. Zaqueu exemplifica uma resposta em que graça e reparação material caminham juntas.", "promise": "Jo 11 oferece um sinal da autoridade de Jesus sobre a morte. A entrada em Jerusalém retoma Zc 9:9. As promessas se realizam por um rei humilde, cujo caminho inclui entrega, não domínio segundo as expectativas políticas de seus seguidores.", "question": "Que reparação concreta pode expressar a graça que recebemos?", "cross": "Jo 11:25-26; Zc 9:9; Mc 10:43-45", "art": {"file": "cenas-03.png", "grid": [2, 2], "cell": 0, "label": "Jesus ensinando: representação artística"}, "context_html": "A ressurreição de Lázaro intensifica esperança e oposição. Jesus acolhe crianças, confronta a confiança na riqueza e redefine grandeza como serviço. A entrada em Jerusalém e os debates no templo aproximam a paixão. Zaqueu exemplifica uma resposta em que graça e reparação material ca zes vazias: imagem simbólica da paixão"}, "context_html": "Discursos sobre crise e vigilância são seguidos pela ceia, oração e prisão. A esperança futura se traduz em cuidado dos pequenos e responsabilidade presente. O lava-pés redefine autoridade e prepara o mandamento do amor. A despedida inclui promessa do Espírito e oração por unidade, sem abolir a verdade ou a consciência.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-14/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 14 na BKJ Fiel 1611 (requer internet)\">Jo 14-16<\/a> promete o Consolador, cuja atuação se tornará central em Atos. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/mateus-24/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 24 na BKJ Fiel 1611 (requer internet)\">Mt 24<\/a> afirma a vinda de Cristo e impede marcar dia e hora. A espera fiel de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/mateus-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 25 na BKJ Fiel 1611 (requer internet)\">Mt 25<\/a> é ativa: acolhe, alimenta e serve, sem comprar salvação por obras.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/mateus-24/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 24 na BKJ Fiel 1611 (requer internet)\">Mt 24:36<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/mateus-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Mateus 25 na BKJ Fiel 1611 (requer internet)\">Mt 25:35-40<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-13/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 13 na BKJ Fiel 1611 (requer internet)\">Jo 13:14-15<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-14/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 14 na BKJ Fiel 1611 (requer internet)\">Jo 14:16-17<\/a>"}, {"week": 46, "title": "Da cruz ao testemunho", "context": "A paixão é narrada por vozes complementares. A ressurreição restaura discípulos e inaugura a missão que Atos acompanha. A cruz não autoriza culpa coletiva contra judeus: Jesus e os primeiros cristãos pertencem ao contexto judaico. O Espírito forma uma comunidade de palavra, oração e partilha, que também precisa corrigir desigualdades internas.", "promise": "Os anúncios da paixão encontram realização nos relatos da morte e ressurreição. At 2 retoma a promessa do Espírito e Jl 2. A ressurreição é fundamento da esperança cristã; a missão prossegue com acompanhamento, justiça e cuidado concreto.", "question": "Como o anúncio da ressurreição transforma nossa vida em comunidade?", "cross": "Lc 24:44-49; At 1:8; At 2:16-21,42-47", "art": {"file": "cenas-03.png", "grid": [2, 2], "cell": 2, "label": "Túmulo vazio: representação artística da ressurreição"}, "context_html": "A paixão é narrada por vozes complementares. A ressurreição restaura discípulos e inaugura a missão que Atos acompanha. A cruz não autoriza culpa coletiva contra judeus: Jesus e os primeiros cristãos pertencem ao contexto judaico. O Espírito forma uma comunidade de palavra, oração e partilha, que também precisa corrigir desigualdades internas.", "promise_html": "Os anúncios da paixão encontram realização nos relatos da morte e ressurreição. <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/atos-dos-apostolos-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Atos dos Apóstolos 2 na BKJ Fiel 1611 (requer internet)\">At 2<\/a> retoma a promessa do Espírito e <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joel-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Joel 2 na BKJ Fiel 1611 (requer internet)\">Jl 2<\/a>. A ressurreição é fundamento da esperança cristã; a missão prossegue com acompanhamento, justiça e cuidado concreto.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/lucas-24/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Lucas 24 na BKJ Fiel 1611 (requer internet)\">Lc 24:44-49<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/atos-dos-apostolos-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Atos dos Apóstolos 1 na BKJ Fiel 1611 (requer internet)\">At 1:8<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/atos-dos-apostolos-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Atos dos Apóstolos 2 na BKJ Fiel 1611 (requer internet)\">At 2:16-21,42-47<\/a>"}, {"week": 47, "title": "Graça que atravessa fronteiras", "context": "Saulo é chamado e Cornélio é acolhido. A igreja aprende a reconhecer a ação de Deus entre gentios, debate critérios de pertencimento e continua a missão. Tiago e Gálatas iluminam aspectos complementares: uma fé viva produz frutos, mas os frutos não compram aceitação divina. A liberdade cristã é chamada a servir.", "promise": "A bênção às nações de Gn 12 é retomada em Gl 3. At 15 discerne a inclusão dos gentios à luz da Escritura e da ação do Espírito. A comunidade não precisa impor toda a identidade étnica de Israel como condição de salvação em Cristo.", "question": "Como unir fidelidade doutrinária, acolhimento e amor prático?", "cross": "At 10:34-35; At 15:8-11; Gl 3:6-9; Tg 2:14-17", "art": {"file": "cenas-03.png", "grid": [2, 2], "cell": 3, "label": "Paulo escrevendo: cena temática das cartas apostólicas"}, "context_html": "Saulo é chamado e Cornélio é acolhido. A igreja aprende a reconhecer a ação de Deus entre gentios, debate critérios de pertencimento e continua a missão. Tiago e Gálatas iluminam aspectos complementares: uma fé viva produz frutos, mas os frutos não compram aceitação divina. A liberdade cristã é chamada a servir.", "promise_html": "A bênção às nações de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 12 na BKJ Fiel 1611 (requer internet)\">Gn 12<\/a> é retomada em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/galatas-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gálatas 3 na BKJ Fiel 1611 (requer internet)\">Gl 3<\/a>. <a class=\"bible-ref\" href=\"https://  apostólicas"}, "context_html": "Viagens missionárias mostram diálogo, trabalho e oposição. Cartas a Tessalônica e Corinto respondem a esperança confusa, divisões, questões de consciência e uso dos dons. Não trate cartas como frases soltas: identifique o problema, acompanhe o argumento e observe como a solução procura edificar a comunidade inteira.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-tessalonicenses-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Tessalonicenses 4 na BKJ Fiel 1611 (requer internet)\">1Ts 4:13-18<\/a> relaciona a esperança dos mortos à volta de Cristo e à ressurreição. Os dons de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-corintios-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Coríntios 12 na BKJ Fiel 1611 (requer internet)\">1Co 12-14<\/a> servem à edificação no amor, não são certificados de superioridade espiritual ou promessa de experiência idêntica para todos.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-tessalonicenses-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Tessalonicenses 4 na BKJ Fiel 1611 (requer internet)\">1Ts 4:13-18<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-corintios-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Coríntios 12 na BKJ Fiel 1611 (requer internet)\">1Co 12:22-26<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-corintios-13/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Coríntios 13 na BKJ Fiel 1611 (requer internet)\">1Co 13<\/a>"}, {"week": 49, "title": "Ressurreição, reconciliação e graça", "context": "Paulo relaciona a esperança futura ao serviço atual e expõe a fragilidade do ministério. A generosidade deve ser voluntária e transparente. Romanos começa desmontando a pretensão de superioridade de qualquer grupo: todos precisam da graça. Leia seus argumentos em blocos, evitando usar uma frase para condenar outros e isentar a si mesmo.", "promise": "1Co 15 apresenta continuidade, não apenas à observação do passado.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/romanos-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Romanos 12 na BKJ Fiel 1611 (requer internet)\">Rm 12:18-21<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/efesios-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Efésios 2 na BKJ Fiel 1611 (requer internet)\">Ef 2:14-18<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/filemom-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Filemom 1 na BKJ Fiel 1611 (requer internet)\">Fm 1:15-17<\/a>"}, {"week": 51, "title": "Perseverança, cuidado e mediação", "context": "As cartas orientam liderança, relações e esperança em condições de pressão. Hebreus apresenta a superioridade e a solidariedade do Filho, explicando sacerdócio, aliança e sacrifício. A fé de Hebreus 11 inclui livramentos e sofrimentos. O cuidado pastoral deve acolher fragilidade sem transformar exortações em instrumentos de medo ou controle.", "promise": "Hb 8 retoma Jr 31, e Hb 9-10 relaciona o santuário à obra de Cristo. Na compreensão adventista, seu ministério celestial aplica os benefícios do sacrifício único e suficiente. A intercessão não repete a cruz nem depende de méritos humanos.", "question": "Como a confiança no ministério de Cristo fortalece serviço e perseverança?", "cross": "Hb 4:14-16; Hb 8:8-12; Hb 10:10-14", "art": {"file": "cenas-03.png", "grid": [2, 2], "cell": 3, "label": "Paulo escrevendo: cena temática das cartas apostólicas"}, "context_html": "As cartas orientam liderança, relações e esperança em condições de pressão. Hebreus apresenta a superioridade e a solidariedade do Filho, explicando sacerdócio, aliança e sacrifício. A fé de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 11 na BKJ Fiel 1611 (requer internet)\">Hebreus 11<\/a> inclui livramentos e sofrimentos. O cuidado pastoral deve acolher fragilidade sem transformar exortações em instrumentos de medo ou controle.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 8 na BKJ Fiel 1611 (requer internet)\">Hb 8<\/a> retoma <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jeremias-31/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jeremias 31 na BKJ Fiel 1611 (requer internet)\">Jr 31<\/a>, e <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 9 na BKJ Fiel 1611 (requer internet)\">Hb 9-10<\/a> relaciona o santuário à obra de Cristo. Na compreensão adventista, seu ministério celestial aplica os benefícios do sacrifício único e suficiente. A intercessão não repete a cruz nem depende de méritos humanos.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 4 na BKJ Fiel 1611 (requer internet)\">Hb 4:14-16<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 8 na BKJ Fiel 1611 (requer internet)\">Hb 8:8-12<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-10/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 10 na BKJ Fiel 1611 (requer internet)\">Hb 10:10-14<\/a>"}, {"week": 52, "title": "Fidelidade até a esperança final", "context": "As últimas cartas unem verdade, amor, discernimento e perseverança. Apocalipse começa com Cristo e igrejas concretas, depois apresenta o conflito por símbolos bíblicos. A leitura adventista historicista deve ser identificada como interpretação e não confundida com cada detalhe explícito da visão. Evite sensacionalismo e hostilidade contra indivíduos de outras crenças.", "promise": "Ap 14:6-12 relaciona evangelho, juízo e adoração ao Criador na compreensão adventista. O dia 365 completará a leitura com a queda de Babilônia, a vitória de Cristo e a nova criação. Esperança final não autoriza marcar datas nem abandonar o serviço presente.", "question": "O estudo profético tem aumentado nosso amor, humildade e fidelidade?", "cross": "2Tm 3:14-17; 1Jo 3:16-18; Ap 14:6-12", "art": {"file": "cenas-03.png", "grid": [2, 2], "cell": 3, "label": "Paulo escrevendo: cena temática das cartas apostólicas"}, "context_html": "As últimas cartas unem verdade, amor, discernimento e perseverança. Apocalipse começa com Cristo e igrejas concretas, depois apresenta o conflito por símbolos bíblicos. A leitura adventista historicista deve ser identificada como interpretação e não confundida com cada detalhe explícito da visão. Evite sensacionalismo e hostilidade contra indivíduos de outras crenças.", "promise_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/apocalipse-14/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Apocalipse 14 na BKJ Fiel 1611 (requer internet)\">Ap 14:6-12<\/a> relaciona evangelho, juízo e adoração ao Criador na compreensão adventista. O dia 365 completará a leitura com a queda de Babilônia, a vitória de Cristo e a nova criação. Esperança final não autoriza marcar datas nem abandonar o serviço presente.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/2-timoteo-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 2 Timóteo 3 na BKJ Fiel 1611 (requer internet)\">2Tm 3:14-17<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-joao-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 João 3 na BKJ Fiel 1611 (requer internet)\">1Jo 3:16-18<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/apocalipse-14/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Apocalipse 14 na BKJ Fiel 1611 (requer internet)\">Ap 14:6-12<\/a>"}], "days": [{"day": 1, "week": 1, "weekday": 1, "reading": "Gênesis 1-3", "passages": [["Gênesis", "1-3"]], "extra": false, "title": "Criados para a comunhão", "explain": "Gênesis 1 apresenta a criação em uma sequência ampla; Gênesis 2 aproxima o olhar da vida humana no jardim. A responsabilidade pelo mundo nasce antes da queda. Em Gênesis 3, o mal compromete as relações com Deus, com o outro e com a terra. As consequências não apagam a dignidade recebida na criação.", "question": "O que muda em minhas relações quando reconheço a outra pessoa como imagem de Deus?", "action": "Escolha uma atitude de cuidado com uma pessoa ou com o ambiente e pratique-a hoje.", "cross": "Êx 20:8-11; Rm 5:12-19; Ap 12:9", "focus": "Perspectiva adventista: a criação em seis dias e o descanso no sétimo fundamentam a compreensão do sábado. A leitura cristã de Gn 3:15 reconhece uma primeira promessa de vitória sobre o mal, desenvolvida à luz de Cristo; o versículo não nomeia Jesus explicitamente.", "caution": "Não confunda dignidade com desempenho: a imagem de Deus não depende de sucesso, riqueza ou produtividade.", "intro": "A história começa com a bondade de Deus, a dignidade humana e uma relação rompida pela desconfiança.", "nodes": [{"ref": "Gn 1:1-25", "text": "Deus cria. A vida recebe ordem, propósito e bondade.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 1 na BKJ Fiel 1611 (requer internet)\">Gn 1:1-25<\/a>"}, {"ref": "Gn 1:26-31; 2:15", "text": "Humanidade recebe uma vocação. Homem e mulher refletem a imagem de Deus e recebem responsabilidade pela criação.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 1 na BKJ Fiel 1611 (requer internet)\">Gn 1:26-31<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 2 na BKJ Fiel 1611 (requer internet)\">2:15<\/a>"}, {"ref": "Gn 2:1-3", "text": "Deus abençoa o sétimo dia. Descanso, santificação e comunhão fazem parte do mundo criado.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 2 na BKJ Fiel 1611 (requer internet)\">Gn 2:1-3<\/a>"}, {"ref": "Gn 3:1-13", "text": "A desconfiança rompe a relação. A desobediência traz vergonha, medo, acusações e afastamento.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 3 na BKJ Fiel 1611 (requer internet)\">Gn 3:1-13<\/a>"}, {"ref": "Gn 3:14-24", "text": "Deus confronta e preserva esperança. Há consequências reais, mas Deus procura o casal e anuncia conflito e vitória sobre a serpente.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 3 na BKJ Fiel 1611 (requer internet)\">Gn 3:14-24<\/a>"}], "links": [{"label": "Gênesis 1", "url": "https://bkjfiel.com.br/genesis-1/"}, {"label": "Gênesis 2", "url": "https://bkjfiel.com.br/genesis-2/"}, {"label": "Gênesis 3", "url": "https://bkjfiel.com.br/genesis-3/"}], "explain_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 1 na BKJ Fiel 1611 (requer internet)\">Gênesis 1<\/a> apresenta a criação em uma sequência ampla; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 2 na BKJ Fiel 1611 (requer internet)\">Gênesis 2<\/a> aproxima o olhar da vida humana no jardim. A responsabilidade pelo mundo nasce antes da queda. Em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 3 na BKJ Fiel 1611 (requer internet)\">Gênesis 3<\/a>, o mal compromete as relações com Deus, com o outro e com a terra. As consequências não apagam a dignidade recebida na criação.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-20/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 20 na BKJ Fiel 1611 (requer internet)\">Êx 20:8-11<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/romanos-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Romanos 5 na BKJ Fiel 1611 (requer internet)\">Rm 5:12-19<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/apocalipse-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Apocalipse 12 na BKJ Fiel 1611 (requer internet)\">Ap 12:9<\/a>", "focus_html": "Perspectiva adventista: a criação em seis dias e o descanso no sétimo fundamentam a compreensão do sábado. A leitura cristã de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 3 na BKJ Fiel 1611 (requer internet)\">Gn 3:15<\/a> reconhece uma primeira promessa de vitória sobre o mal, desenvolvida à luz de Cristo; o versículo não nomeia Jesus explicitamente.", "caution_html": "Não confunda dignidade com desempenho: a imagem de Deus não depende de sucesso, riqueza ou produtividade."}, {"day": 2, "week": 1, "weekday": 2, "reading": "Gênesis 4-7", "passages": [["Gênesis", "4-7"]], "extra": false, "title": "Quando a violência se espalha", "explain": "A pergunta sobre o irmão atravessa o capítulo 4: o pecado tem efeitos sociais. O avanço de atividades humanas não impede a expansão da violência. Em Gênesis 6, a preservação de Noé é apresentada junto à graça divina e à sua resposta obediente. A arca é parte de uma história de juízo e preservação, não uma fórmula de imunidade a toda dificuldade.", "question": "Que sinais de ressentimento ou indiferença preciso enfrentar antes que prejudiquem alguém?", "action": "Interrompa uma atitude de hostilidade: procure uma forma respeitosa de reparar, dialogar ou estabelecer limites.", "cross": "Hb 11:4-7; 1Jo 3:11-18", "focus": "Observe a ordem do relato: a graça de Deus não é comprada pela construção da arca. A fé se expressa em uma resposta concreta ao que Deus ordena. Hebreus retoma Noé como exemplo dessa confiança obediente.", "caution": "Não explique tragédias atuais como castigo divino específico sem fundamento no texto. A narrativa do dilúvio não autoriza acusar vítimas.", "intro": "A ruptura do jardim alcança a família e a sociedade. A narrativa acompanha violência crescente, juízo e preservação.", "nodes": [{"ref": "Gn 4:1-7", "text": "Caim é advertido. Antes do assassinato, Deus o confronta sobre a ira e o pecado.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 4 na BKJ Fiel 1611 (requer internet)\">Gn 4:1-7<\/a>"}, {"ref": "Gn 4:8-16", "text": "A violência atinge o irmão. A morte de Abel expõe a recusa da responsabilidade pelo próximo.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 4 na BKJ Fiel 1611 (requer internet)\">Gn 4:8-16<\/a>"}, {"ref": "Gn 5", "text": "As gerações se sucedem. A genealogia registra continuidade da vida e a presença da morte; Enoque se destaca.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 5 na BKJ Fiel 1611 (requer internet)\">Gn 5<\/a>"}, {"ref": "Gn 6:5-22", "text": "A corrupção se generaliza. Deus vê a maldade e a violência; Noé encontra graça e recebe uma missão.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 6 na BKJ Fiel 1611 (requer internet)\">Gn 6:5-22<\/a>"}, {"ref": "Gn 7", "text": "Noé entra na arca. A obediência à ordem divina antecede a chegada das águas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 7 na BKJ Fiel 1611 (requer internet)\">Gn 7<\/a>"}], "links": [{"label": "Gênesis 4", "url": "https://bkjfiel.com.br/genesis-4/"}, {"label": "Gênesis 5", "url": "https://bkjfiel.com.br/genesis-5/"}, {"label": "Gênesis 6", "url": "https://bkjfiel.com.br/genesis-6/"}, {"label": "Gênesis 7", "url": "https://bkjfiel.com.br/genesis-7/"}], "explain_html": "A pergunta sobre o irmão atravessa o capítulo 4: o pecado tem efeitos sociais. O avanço de atividades humanas não impede a expansão da violência. Em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 6 na BKJ Fiel 1611 (requer internet)\">Gênesis 6<\/a>, a preservação de Noé é apresentada junto à graça divina e à sua resposta obediente. A arca é parte de uma história de juízo e preservação, não uma fórmula de imunidade a toda dificuldade.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 11 na BKJ Fiel 1611 (requer internet)\">Hb 11:4-7<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-joao-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 João 3 na BKJ Fiel 1611 (requer internet)\">1Jo 3:11-18<\/a>", "focus_html": "Observe a ordem do relato: a graça de Deus não é comprada pela construção da arca. A fé se expressa em uma resposta concreta ao que Deus ordena. Hebreus retoma Noé como exemplo dessa confiança obediente.", "caution_html": "Não explique tragédias atuais como castigo divino específico sem fundamento no texto. A narrativa do dilúvio não autoriza acusar vítimas."}, {"day": 3, "week": 1, "weekday": 3, "reading": "Gênesis 8-11", "passages": [["Gênesis", "8-11"]], "extra": false, "title": "Recomeço, aliança e dispersão", "explain": "O recomeço depois do dilúvio não elimina automaticamente a fragilidade humana: o episódio de Noé e seus filhos já mostra tensões familiares. A aliança de Gênesis 9 tem alcance amplo, incluindo os seres vivos. A lista das nações e o episódio de Babel ajudam a compreender povos e línguas; não precisam ser lidos como dois blocos estritamente consecutivos em cada detalhe.", "question": "Meu desejo de construir algo está a serviço das pessoas ou de tornar meu próprio nome importante?", "action": "Registre uma bênção do seu recomeço e escolha uma forma de colocá-la a serviço de outra pessoa.", "cross": "Gn 12:1-3; At 2:5-11", "focus": "Promessa e alcance: Gn 9:11 promete que não haverá outro dilúvio para destruir toda carne. Isso não equivale a prometer que nunca mais haverá enchentes locais ou sofrimento. Em Gn 11, a história prepara Abrão; seu chamado será lido na semana 3.", "caution": "Gênesis 9:25 menciona Canaã, não uma cor de pele. Não use essa passagem para justificar racismo, escravidão ou superioridade étnica.", "intro": "As águas baixam e a vida recomeça. A aliança preserva a esperança, enquanto a humanidade continua enfrentando o pecado.", "nodes": [{"ref": "Gn 8:1-19", "text": "Deus se lembra de Noé. As águas recuam e a saída da arca acontece segundo a orientação divina.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 8 na BKJ Fiel 1611 (requer internet)\">Gn 8:1-19<\/a>"}, {"ref": "Gn 8:20-22", "text": "A gratidão acompanha o recomeço. Noé edifica um altar; Deus anuncia a continuidade dos ciclos da terra.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 8 na BKJ Fiel 1611 (requer internet)\">Gn 8:20-22<\/a>"}, {"ref": "Gn 9:8-17", "text": "A aliança alcança os seres vivos. O arco nas nuvens é sinal da promessa de não destruir toda carne por um dilúvio.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 9 na BKJ Fiel 1611 (requer internet)\">Gn 9:8-17<\/a>"}, {"ref": "Gn 10; 11:1-9", "text": "Os povos se espalham. Famílias e nações são apresentadas; Babel expõe a busca de um nome e a resistência à dispersão.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-10/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 10 na BKJ Fiel 1611 (requer internet)\">Gn 10<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 11 na BKJ Fiel 1611 (requer internet)\">11:1-9<\/a>"}, {"ref": "Gn 11:10-32", "text": "A narrativa se aproxima de Abrão. A genealogia conduz à família de Terá, preparando a próxima etapa da história.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 11 na BKJ Fiel 1611 (requer internet)\">Gn 11:10-32<\/a>"}], "links": [{"label": "Gênesis 8", "url": "https://bkjfiel.com.br/genesis-8/"}, {"label": "Gênesis 9", "url": "https://bkjfiel.com.br/genesis-9/"}, {"label": "Gênesis 10", "url": "https://bkjfiel.com.br/genesis-10/"}, {"label": "Gênesis 11", "url": "https://bkjfiel.com.br/genesis-11/"}], "explain_html": "O recomeço depois do dilúvio não elimina automaticamente a fragilidade humana: o episódio de Noé e seus filhos já mostra tensões familiares. A aliança de <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 9 na BKJ Fiel 1611 (requer internet)\">Gênesis 9<\/a> tem alcance amplo, incluindo os seres vivos. A lista das nações e o episódio de Babel ajudam a compreender povos e línguas; não precisam ser lidos como dois blocos estritamente consecutivos em cada detalhe.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 12 na BKJ Fiel 1611 (requer internet)\">Gn 12:1-3<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/atos-dos-apostolos-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Atos dos Apóstolos 2 na BKJ Fiel 1611 (requer internet)\">At 2:5-11<\/a>", "focus_html": "Promessa e alcance: <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 9 na BKJ Fiel 1611 (requer internet)\">Gn 9:11<\/a> promete que não haverá outro dilúvio para destruir toda carne. Isso não equivale a prometer que nunca mais haverá enchentes locais ou sofrimento. Em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 11 na BKJ Fiel 1611 (requer internet)\">Gn 11<\/a>, a história prepara Abrão; seu chamado será lido na semana 3.", "caution_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/genesis-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Gênesis 9 na BKJ Fiel 1611 (requer internet)\">Gênesis 9:25<\/a> menciona Canaã, não uma cor de pele. Não use essa passagem para justificar racismo, escravidão ou superioridade étnica."}, {"day": 4, "week": 1, "weekday": 4, "reading": "Jó 1-5", "passages": [["Jó", "1-5"]], "extra": false, "title": "Fé diante da perda", "explain": "A abertura impede concluir que Jó sofre porque escondia uma culpa que os amigos descobrirão. Ele não recebe uma explicação sobre a cena celestial. Quando o lamento começa, o leitor acompanha alguém tentando falar de dentro da dor. Os amigos começam com presença e silêncio; o problema cresce quando passam a explicar a experiência de Jó sem conhecê-la.", "question": "Quando alguém sofre, ofereço companhia ou sinto necessidade de explicar imediatamente a causa?", "action": "Escute alguém com atenção. Pergunte de que ajuda concreta precisa, sem atribuir culpa à sua dor.", "cross": "Jó 42:7-8; Jo 9:1-3", "focus": "Perspectiva adventista: o conflito apresentado em Jó ajuda a pensar o grande conflito entre bem e mal. O episódio revela oposição à fidelidade e à imagem de Deus, mas não oferece um diagnóstico da causa de cada sofrimento individual.", "caution": "Jó aparece aqui por uma opção do plano, frequentemente associada a um cenário patriarcal. O livro não informa uma data que o situe exatamente depois de Babel.", "intro": "O leitor conhece um conflito que Jó não conhece. Essa diferença impede respostas fáceis para seu sofrimento.", "nodes": [{"ref": "Jó 1:1-5", "text": "O narrador apresenta Jó. Ele é descrito como íntegro e temente a Deus antes das perdas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 1 na BKJ Fiel 1611 (requer internet)\">Jó 1:1-5<\/a>"}, {"ref": "Jó 1:6-12; 2:1-6", "text": "O acusador questiona sua fé. A acusação sugere que a fidelidade depende dos benefícios recebidos.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 1 na BKJ Fiel 1611 (requer internet)\">Jó 1:6-12<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 2 na BKJ Fiel 1611 (requer internet)\">2:1-6<\/a>"}, {"ref": "Jó 1:13-22; 2:7-10", "text": "Jó sofre perdas e enfermidade. Sua fidelidade é provada em meio à perda dos bens, dos filhos e da saúde.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 1 na BKJ Fiel 1611 (requer internet)\">Jó 1:13-22<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 2 na BKJ Fiel 1611 (requer internet)\">2:7-10<\/a>"}, {"ref": "Jó 2:11-13; 3", "text": "A presença antecede o lamento. Os amigos choram e ficam em silêncio; depois Jó lamenta seu nascimento.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 2 na BKJ Fiel 1611 (requer internet)\">Jó 2:11-13<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 3 na BKJ Fiel 1611 (requer internet)\">3<\/a>"}, {"ref": "Jó 4-5", "text": "Elifaz tenta explicar. Sua fala associa sofrimento e culpa, mas precisa ser avaliada à luz do livro inteiro.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 4 na BKJ Fiel 1611 (requer internet)\">Jó 4-5<\/a>"}], "links": [{"label": "Jó 1", "url": "https://bkjfiel.com.br/jo-1/"}, {"label": "Jó 2", "url": "https://bkjfiel.com.br/jo-2/"}, {"label": "Jó 3", "url": "https://bkjfiel.com.br/jo-3/"}, {"label": "Jó 4", "url": "https://bkjfiel.com.br/jo-4/"}, {"label": "Jó 5", "url": "https://bkjfiel.com.br/jo-5/"}], "explain_html": "A abertura impede concluir que Jó sofre porque escondia uma culpa que os amigos descobrirão. Ele não recebe uma explicação sobre a cena celestial. Quando o lamento começa, o leitor acompanha alguém tentando falar de dentro da dor. Os amigos começam com presença e silêncio; o problema cresce quando passam a explicar a experiência de Jó sem conhecê-la.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-42/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 42 na BKJ Fiel 1611 (requer internet)\">Jó 42:7-8<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 9 na BKJ Fiel 1611 (requer internet)\">Jo 9:1-3<\/a>", "focus_html": "Perspectiva adventista: o conflito apresentado em Jó ajuda a pensar o grande conflito entre bem e mal. O episódio revela oposição à fidelidade e à imagem de Deus, mas não oferece um diagnóstico da causa de cada sofrimento individual.", "caution_html": "Jó aparece aqui por uma opção do plano, frequentemente associada a um cenário patriarcal. O livro não informa uma data que o situe exatamente depois de Babel."}, {"day": 5, "week": 1, "weekday": 5, "reading": "Jó 6-9", "passages": [["Jó", "6-9"]], "extra": false, "title": "Uma dor que pede escuta", "explain": "A fala de Bildade contém afirmações sobre a justiça de Deus, mas sua aplicação ao caso de Jó é problemática. Uma ideia verdadeira pode ser usada de modo injusto quando alguém presume conhecer a culpa de outra pessoa. Jó não oferece um tratado sereno: sua linguagem nasce de uma experiência extrema e precisa ser ouvida dentro do diálogo.", "question": "Já usei uma frase religiosa correta de uma maneira que feriu alguém?", "action": "Troque um conselho automático por uma pergunta sincera e por tempo de escuta.", "cross": "Jó 42:7; 1Tm 2:5; Rm 12:15", "focus": "Conexão cristã: o desejo de mediação em Jó 9 pode ser colocado em diálogo com 1Tm 2:5. Isso não significa que Jó já formule ali toda a doutrina neotestamentária sobre Jesus. Primeiro ouça a pergunta do personagem; depois compare as passagens.", "caution": "A acusação de Bildade em Jó 8:4 não deve ser ensinada como a explicação de Deus para a morte dos filhos de Jó.", "intro": "Jó pede compreensão. Bildade insiste em uma explicação moral simples; a distância entre ambos aumenta.", "nodes": [{"ref": "Jó 6", "text": "Jó explica o peso da dor. Suas palavras expressam aflição e decepção com os amigos.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 6 na BKJ Fiel 1611 (requer internet)\">Jó 6<\/a>"}, {"ref": "Jó 7", "text": "Jó fala a Deus. Ele descreve a brevidade da vida e apresenta suas perguntas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 7 na BKJ Fiel 1611 (requer internet)\">Jó 7<\/a>"}, {"ref": "Jó 8", "text": "Bildade oferece uma resposta. Defende a justiça divina, mas aplica a lógica de culpa ao sofrimento da família de Jó.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 8 na BKJ Fiel 1611 (requer internet)\">Jó 8<\/a>"}, {"ref": "Jó 9:1-24", "text": "Jó reconhece a grandeza divina. O poder de Deus torna mais aguda sua dificuldade de apresentar a própria causa.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 9 na BKJ Fiel 1611 (requer internet)\">Jó 9:1-24<\/a>"}, {"ref": "Jó 9:25-35", "text": "Surge o desejo de mediação. Jó deseja alguém que faça a ponte entre sua fragilidade e Deus.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 9 na BKJ Fiel 1611 (requer internet)\">Jó 9:25-35<\/a>"}], "links": [{"label": "Jó 6", "url": "https://bkjfiel.com.br/jo-6/"}, {"label": "Jó 7", "url": "https://bkjfiel.com.br/jo-7/"}, {"label": "Jó 8", "url": "https://bkjfiel.com.br/jo-8/"}, {"label": "Jó 9", "url": "https://bkjfiel.com.br/jo-9/"}], "explain_html": "A fala de Bildade contém afirmações sobre a justiça de Deus, mas sua aplicação ao caso de Jó é problemática. Uma ideia verdadeira pode ser usada de modo injusto quando alguém presume conhecer a culpa de outra pessoa. Jó não oferece um tratado sereno: sua linguagem nasce de uma experiência extrema e precisa ser ouvida dentro do diálogo.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-42/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 42 na BKJ Fiel 1611 (requer internet)\">Jó 42:7<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-timoteo-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Timóteo 2 na BKJ Fiel 1611 (requer internet)\">1Tm 2:5<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/romanos-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Romanos 12 na BKJ Fiel 1611 (requer internet)\">Rm 12:15<\/a>", "focus_html": "Conexão cristã: o desejo de mediação em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 9 na BKJ Fiel 1611 (requer internet)\">Jó 9<\/a> pode ser colocado em diálogo com <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-timoteo-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Timóteo 2 na BKJ Fiel 1611 (requer internet)\">1Tm 2:5<\/a>. Isso não significa que Jó já formule ali toda a doutrina neotestamentária sobre Jesus. Primeiro ouça a pergunta do personagem; depois compare as passagens.", "caution_html": "A acusação de Bildade em <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-8/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 8 na BKJ Fiel 1611 (requer internet)\">Jó 8:4<\/a> não deve ser ensinada como a explicação de Deus para a morte dos filhos de Jó."}, {"day": 6, "week": 1, "weekday": 6, "reading": "Jó 10-13", "passages": [["Jó", "10-13"]], "extra": false, "title": "Perguntas que continuam diante de Deus", "explain": "Os amigos confundem defender Deus com explicar tudo o que acontece em seu nome. Jó recusa essa pretensão. Sua fala mistura coragem, angústia e perguntas difíceis; não é necessário transformar cada formulação em uma conclusão doutrinária. O diálogo mostra que uma pessoa pode continuar se dirigindo a Deus enquanto luta para compreender sua experiência.", "question": "Consigo admitir que não sei explicar uma situação sem deixar de oferecer cuidado e esperança?", "action": "Escreva uma oração honesta com três partes: o que dói, o que você pergunta e a ajuda de que precisa.", "cross": "Sl 13; Hb 4:14-16", "focus": "Leia Jó 13:15 dentro dos versículos 13-19, preservando a redação da tradução escolhida. A confiança aparece em tensão com a defesa de sua integridade; não use a passagem para exigir que pessoas feridas escondam seus sentimentos.", "caution": "Questionamentos e lamentos devem ser interpretados no conjunto do livro. Nem Jó nem seus amigos conhecem toda a situação apresentada ao leitor.", "intro": "O debate se intensifica. Jó contesta os amigos e insiste em apresentar sua causa diante de Deus.", "nodes": [{"ref": "Jó 10", "text": "Jó procura compreender. Ele recorda sua formação e pergunta por que atravessa tamanha aflição.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-10/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 10 na BKJ Fiel 1611 (requer internet)\">Jó 10<\/a>"}, {"ref": "Jó 11", "text": "Zofar acusa e aconselha. Sua explicação pressupõe que Jó precisa abandonar uma culpa que ele presume conhecer.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 11 na BKJ Fiel 1611 (requer internet)\">Jó 11<\/a>"}, {"ref": "Jó 12", "text": "Jó contesta a superioridade dos amigos. Reconhece a sabedoria e o poder de Deus, sem aceitar a conclusão deles.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-12/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 12 na BKJ Fiel 1611 (requer internet)\">Jó 12<\/a>"}, {"ref": "Jó 13:1-19", "text": "Jó deseja falar diretamente. Denuncia a defesa enganosa feita pelos amigos e pede espaço para sua causa.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-13/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 13 na BKJ Fiel 1611 (requer internet)\">Jó 13:1-19<\/a>"}, {"ref": "Jó 13:20-28", "text": "A oração permanece aberta. Jó pede que Deus revele suas transgressões e não se oculte.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-13/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 13 na BKJ Fiel 1611 (requer internet)\">Jó 13:20-28<\/a>"}], "links": [{"label": "Jó 10", "url": "https://bkjfiel.com.br/jo-10/"}, {"label": "Jó 11", "url": "https://bkjfiel.com.br/jo-11/"}, {"label": "Jó 12", "url": "https://bkjfiel.com.br/jo-12/"}, {"label": "Jó 13", "url": "https://bkjfiel.com.br/jo-13/"}], "explain_html": "Os amigos confundem defender Deus com explicar tudo o que acontece em seu nome. Jó recusa essa pretensão. Sua fala mistura coragem, angústia e perguntas difíceis; não é necessário transformar cada formulação em uma conclusão doutrinária. O diálogo mostra que uma pessoa pode continuar se dirigindo a Deus enquanto luta para compreender sua experiência.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-13/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 13 na BKJ Fiel 1611 (requer internet)\">Sl 13<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/hebreus-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Hebreus 4 na BKJ Fiel 1611 (requer internet)\">Hb 4:14-16<\/a>", "focus_html": "Leia <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-13/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 13 na BKJ Fiel 1611 (requer internet)\">Jó 13:15<\/a> dentro dos versículos 13-19, preservando a redação da tradução escolhida. A confiança aparece em tensão com a defesa de sua integridade; não use a passagem para exigir que pessoas feridas escondam seus sentimentos.", "caution_html": "Questionamentos e lamentos devem ser interpretados no conjunto do livro. Nem Jó nem seus amigos conhecem toda a situação apresentada ao leitor."}, {"day": 7, "week": 1, "weekday": 7, "reading": "Jó 14-16", "passages": [["Jó", "14-16"]], "extra": false, "title": "Esperança em meio ao silêncio", "explain": "A semana termina no meio da conversa, não na solução do livro. As perguntas de Jó sobre morte e esperança devem ser lidas como parte desse percurso. Sua crítica aos consoladores mostra que a maneira de falar importa: palavras podem aliviar ou aumentar a solidão. O apelo a uma testemunha expressa sua busca por justiça e reconhecimento.", "question": "Que palavras minhas fortalecem quem está sofrendo, e quais apenas aumentam a pressão?", "action": "Ofereça um gesto concreto de apoio. Ao encerrar a semana, registre também uma pergunta que continuará acompanhando a leitura de Jó.", "cross": "Jo 11:11-25; 1Ts 4:13-18; Tg 5:11", "focus": "Perspectiva adventista: a esperança da ressurreição é explicada de forma mais direta em outros textos. Compare Jó 14 com Jo 11:11-25 e 1Ts 4:13-18, sem transformar uma pergunta do poema em uma exposição completa sobre a morte.", "caution": "Jó 16:19 não identifica nominalmente sua testemunha como Jesus. A conexão cristã deve ser apresentada como leitura à luz do conjunto bíblico, não como identificação explícita do versículo.", "intro": "A fragilidade da vida e a necessidade de consolo ocupam o centro. O debate permanece sem resolução nesta semana.", "nodes": [{"ref": "Jó 14:1-12", "text": "Jó considera a vida breve. A imagem da árvore contrasta com a experiência humana de morte e fragilidade.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-14/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 14 na BKJ Fiel 1611 (requer internet)\">Jó 14:1-12<\/a>"}, {"ref": "Jó 14:13-22", "text": "Jó deseja ser lembrado. O lamento inclui a pergunta sobre viver novamente e o desejo de uma mudança.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-14/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 14 na BKJ Fiel 1611 (requer internet)\">Jó 14:13-22<\/a>"}, {"ref": "Jó 15", "text": "Elifaz volta a falar. A segunda fala aumenta a pressão e descreve o destino dos ímpios.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 15 na BKJ Fiel 1611 (requer internet)\">Jó 15<\/a>"}, {"ref": "Jó 16:1-5", "text": "Jó rejeita o consolo que fere. Ele diz que poderia fortalecer os amigos se as posições fossem invertidas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-16/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 16 na BKJ Fiel 1611 (requer internet)\">Jó 16:1-5<\/a>"}, {"ref": "Jó 16:18-22", "text": "Jó apela a uma testemunha. Em sua angústia, procura reconhecimento de sua causa diante do céu.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-16/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 16 na BKJ Fiel 1611 (requer internet)\">Jó 16:18-22<\/a>"}], "links": [{"label": "Jó 14", "url": "https://bkjfiel.com.br/jo-14/"}, {"label": "Jó 15", "url": "https://bkjfiel.com.br/jo-15/"}, {"label": "Jó 16", "url": "https://bkjfiel.com.br/jo-16/"}], "explain_html": "A semana termina no meio da conversa, não na solução do livro. As perguntas de Jó sobre morte e esperança devem ser lidas como parte desse percurso. Sua crítica aos consoladores mostra que a maneira de falar importa: palavras podem aliviar ou aumentar a solidão. O apelo a uma testemunha expressa sua busca por justiça e reconhecimento.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 11 na BKJ Fiel 1611 (requer internet)\">Jo 11:11-25<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-tessalonicenses-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Tessalonicenses 4 na BKJ Fiel 1611 (requer internet)\">1Ts 4:13-18<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/tiago-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Tiago 5 na BKJ Fiel 1611 (requer internet)\">Tg 5:11<\/a>", "focus_html": "Perspectiva adventista: a esperança da ressurreição é explicada de forma mais direta em outros textos. Compare <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-14/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 14 na BKJ Fiel 1611 (requer internet)\">Jó 14<\/a> com <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/joao-11/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir João 11 na BKJ Fiel 1611 (requer internet)\">Jo 11:11-25<\/a> e <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/1-tessalonicenses-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir 1 Tessalonicenses 4 na BKJ Fiel 1611 (requer internet)\">1Ts 4:13-18<\/a>, sem transformar uma pergunta do poema em uma exposição completa sobre a morte.", "caution_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-16/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 16 na BKJ Fiel 1611 (requer internet)\">Jó 16:19<\/a> não identifica nominalmente sua testemunha como Jesus. A conexão cristã deve ser apresentada como leitura à luz do conjunto bíblico, não como identificação explícita do versículo."}, {"day": 8, "week": 2, "weekday": 1, "reading": "Jó 17-20", "passages": [["Jó", "17-20"]], "extra": false, "title": "Quando as respostas ferem", "nodes": [{"ref": "Jó 17", "text": "Jó pede reconhecimento em meio ao abandono.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-17/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 17 na BKJ Fiel 1611 (requer internet)\">Jó 17<\/a>"}, {"ref": "Jó 18", "text": "Bildade descreve o destino dos perversos.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-18/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 18 na BKJ Fiel 1611 (requer internet)\">Jó 18<\/a>"}, {"ref": "Jó 19-20", "text": "Jó espera um defensor; Zofar insiste no castigo.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-19/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 19 na BKJ Fiel 1611 (requer internet)\">Jó 19-20<\/a>"}], "explain": "O desacordo cresce porque os amigos tratam a experiência de Jó como prova de culpa. Sua esperança não elimina o lamento.", "question": "Tenho ouvido a dor antes de julgar?", "action": "Ofereça presença sem exigir explicações.", "cross": "Jó 19:25-27; Jó 42:7", "links": [{"label": "Jó 17", "url": "https://bkjfiel.com.br/jo-17/"}, {"label": "Jó 18", "url": "https://bkjfiel.com.br/jo-18/"}, {"label": "Jó 19", "url": "https://bkjfiel.com.br/jo-19/"}, {"label": "Jó 20", "url": "https://bkjfiel.com.br/jo-20/"}], "explain_html": "O desacordo cresce porque os amigos tratam a experiência de Jó como prova de culpa. Sua esperança não elimina o lamento.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-19/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 19 na BKJ Fiel 1611 (requer internet)\">Jó 19:25-27<\/a>; <a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-42/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 42 na BKJ Fiel 1611 (requer internet)\">Jó 42:7<\/a>"}, {"day": 9, "week": 2, "weekday": 2, "reading": "Jó 21-23", "passages": [["Jó", "21-23"]], "extra": false, "title": "A prosperidade dos injustos", "nodes": [{"ref": "Jó 21", "text": "Jó observa ímpios que prosperam.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-21/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 21 na BKJ Fiel 1611 (requer internet)\">Jó 21<\/a>"}, {"ref": "Jó 22", "text": "Elifaz faz acusações concretas contra ele.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-22/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 22 na BKJ Fiel 1611 (requer internet)\">Jó 22<\/a>"}, {"ref": "Jó 23", "text": "Jó procura Deus e deseja apresentar sua causa.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-23/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 23 na BKJ Fiel 1611 (requer internet)\">Jó 23<\/a>"}], "explain": "A realidade desafia a fórmula de recompensa imediata. As acusações de Elifaz pertencem ao debate, não ao veredito do narrador.", "question": "Confundo prosperidade com aprovação divina?", "action": "Examine um julgamento precipitado que você fez.", "cross": "Sl 73:1-17", "links": [{"label": "Jó 21", "url": "https://bkjfiel.com.br/jo-21/"}, {"label": "Jó 22", "url": "https://bkjfiel.com.br/jo-22/"}, {"label": "Jó 23", "url": "https://bkjfiel.com.br/jo-23/"}], "explain_html": "A realidade desafia a fórmula de recompensa imediata. As acusações de Elifaz pertencem ao debate, não ao veredito do narrador.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/salmos-73/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Salmos 73 na BKJ Fiel 1611 (requer internet)\">Sl 73:1-17<\/a>"}, {"day": 10, "week": 2, "weekday": 3, "reading": "Jó 24-28", "passages": [["Jó", "24-28"]], "extra": false, "title": "Onde se encontra a sabedoria?", "nodes": [{"ref": "Jó 24", "text": "A injustiça parece permanecer sem resposta.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-24/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 24 na BKJ Fiel 1611 (requer internet)\">Jó 24<\/a>"}, {"ref": "Jó 25-27", "text": "A discussão contrasta grandeza divina e integridade humana.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-25/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 25 na BKJ Fiel 1611 (requer internet)\">Jó 25-27<\/a>"}, {"ref": "Jó 28", "text": "A sabedoria não se compra como metais preciosos.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-28/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 28 na BKJ Fiel 1611 (requer internet)\">Jó 28<\/a>"}], "explain": "O poema da mineração distingue habilidade técnica de discernimento moral. Temer a Deus e abandonar o mal orienta a busca da sabedoria.", "question": "O que sei fazer é também o que devo fazer?", "action": "Identifique uma decisão que exige integridade.", "cross": "Pv 9:10", "links": [{"label": "Jó 24", "url": "https://bkjfiel.com.br/jo-24/"}, {"label": "Jó 25", "url": "https://bkjfiel.com.br/jo-25/"}, {"label": "Jó 26", "url": "https://bkjfiel.com.br/jo-26/"}, {"label": "Jó 27", "url": "https://bkjfiel.com.br/jo-27/"}, {"label": "Jó 28", "url": "https://bkjfiel.com.br/jo-28/"}], "explain_html": "O poema da mineração distingue habilidade técnica de discernimento moral. Temer a Deus e abandonar o mal orienta a busca da sabedoria.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/proverbios-9/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Provérbios 9 na BKJ Fiel 1611 (requer internet)\">Pv 9:10<\/a>"}, {"day": 11, "week": 2, "weekday": 4, "reading": "Jó 29-31", "passages": [["Jó", "29-31"]], "extra": false, "title": "Memória, humilhação e integridade", "nodes": [{"ref": "Jó 29", "text": "Jó recorda respeito e cuidado pelos vulneráveis.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-29/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 29 na BKJ Fiel 1611 (requer internet)\">Jó 29<\/a>"}, {"ref": "Jó 30", "text": "Ele descreve sua humilhação atual.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-30/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 30 na BKJ Fiel 1611 (requer internet)\">Jó 30<\/a>"}, {"ref": "Jó 31", "text": "Apresenta um exame de sua conduta.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-31/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 31 na BKJ Fiel 1611 (requer internet)\">Jó 31<\/a>"}], "explain": "A defesa de Jó inclui relações, dinheiro e justiça. Integridade envolve como tratamos empregados, pobres e estrangeiros, não apenas reputação religiosa.", "question": "Quem depende da minha justiça cotidiana?", "action": "Reveja uma relação em que você possui mais poder.", "cross": "Jó 31:13-23", "links": [{"label": "Jó 29", "url": "https://bkjfiel.com.br/jo-29/"}, {"label": "Jó 30", "url": "https://bkjfiel.com.br/jo-30/"}, {"label": "Jó 31", "url": "https://bkjfiel.com.br/jo-31/"}], "explain_html": "A defesa de Jó inclui relações, dinheiro e justiça. Integridade envolve como tratamos empregados, pobres e estrangeiros, não apenas reputação religiosa.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-31/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 31 na BKJ Fiel 1611 (requer internet)\">Jó 31:13-23<\/a>"}, {"day": 12, "week": 2, "weekday": 5, "reading": "Jó 32-34", "passages": [["Jó", "32-34"]], "extra": false, "title": "Uma nova voz no debate", "nodes": [{"ref": "Jó 32", "text": "Eliú explica por que decide falar.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-32/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 32 na BKJ Fiel 1611 (requer internet)\">Jó 32<\/a>"}, {"ref": "Jó 33", "text": "Propõe que Deus instrui e adverte.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/jo-33/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Jó 33 na BKJ Fiel 1611 (requer internet)\">Jó 33<\/a>"}, {"ref": "Jó 34", "text": "Defende a justiça divina e cri tle": "Obediência em meio à resistência", "nodes": [{"ref": "Êx 4", "text": "Moisés apresenta objeções e recebe ajuda.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 4 na BKJ Fiel 1611 (requer internet)\">Êx 4<\/a>"}, {"ref": "Êx 5", "text": "Faraó agrava o trabalho dos israelitas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 5 na BKJ Fiel 1611 (requer internet)\">Êx 5<\/a>"}, {"ref": "Êx 6", "text": "Deus reafirma sua aliança e libertação.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 6 na BKJ Fiel 1611 (requer internet)\">Êx 6<\/a>"}], "explain": "Dar o primeiro passo não resolve imediatamente a crise. A piora temporária não prova que a tarefa estava errada; o texto convida a ouvir novamente a promessa.", "question": "Desisto quando a primeira resposta é resistência?", "action": "Retome uma responsabilidade importante com ajuda adequada.", "cross": "Êx 6:6-8", "links": [{"label": "Êxodo 4", "url": "https://bkjfiel.com.br/exodo-4/"}, {"label": "Êxodo 5", "url": "https://bkjfiel.com.br/exodo-5/"}, {"label": "Êxodo 6", "url": "https://bkjfiel.com.br/exodo-6/"}], "explain_html": "Dar o primeiro passo não resolve imediatamente a crise. A piora temporária não prova que a tarefa estava errada; o texto convida a ouvir novamente a promessa.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 6 na BKJ Fiel 1611 (requer internet)\">Êx 6:6-8<\/a>"}, {"day": 32, "week": 5, "weekday": 4, "reading": "Êxodo 7-9", "passages": [["Êxodo", "7-9"]], "extra": false, "title": "O poder do império é confrontado", "nodes": [{"ref": "Êx 7", "text": "O confronto alcança o Nilo.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo et)\">Êx 14<\/a>"}, {"ref": "Êx 15", "text": "O cântico celebra a vitória; a sede testa a confiança.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 15 na BKJ Fiel 1611 (requer internet)\">Êx 15<\/a>"}], "explain": "A libertação é celebrada antes que a jornada termine. O cântico de Moisés e Miriã convive com as primeiras dificuldades do deserto.", "question": "Sei agradecer antes de pedir a próxima resposta?", "action": "Registre uma gratidão e uma necessidade atual.", "cross": "Êx 15:20-21", "links": [{"label": "Êxodo 13", "url": "https://bkjfiel.com.br/exodo-13/"}, {"label": "Êxodo 14", "url": "https://bkjfiel.com.br/exodo-14/"}, {"label": "Êxodo 15", "url": "https://bkjfiel.com.br/exodo-15/"}], "explain_html": "A libertação é celebrada antes que a jornada termine. O cântico de Moisés e Miriã convive com as primeiras dificuldades do deserto.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-15/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 15 na BKJ Fiel 1611 (requer internet)\">Êx 15:20-21<\/a>"}, {"day": 35, "week": 5, "weekday": 7, "reading": "Êxodo 16-18", "passages": [["Êxodo", "16-18"]], "extra": false, "title": "Pão, água e liderança compartilhada", "nodes": [{"ref": "Êx 16", "text": "O maná ensina dependência e descanso.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-16/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 16 na BKJ Fiel 1611 (requer internet)\">Êx 16<\/a>"}, {"ref": "Êx 17", "text": "A sede e o combate revelam necessidade de auxílio.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-17/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Êxodo 17 na BKJ Fiel 1611 (requer internet)\">Êx 17<\/a>"}, {"ref": "Êx 18", "text": "Jetro orienta Moisés a distribuir responsabilidades.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/exodo-18/\" target=\"_b s://bkjfiel.com.br/numeros-35/"}, {"label": "Números 36", "url": "https://bkjfiel.com.br/numeros-36/"}], "explain_html": "A proteção contra vingança precipitada não elimina a apuração dos fatos. Justiça exige ouvir, distinguir e responsabilizar com cuidado.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/numeros-35/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Números 35 na BKJ Fiel 1611 (requer internet)\">Nm 35:24-25<\/a>"}, {"day": 70, "week": 10, "weekday": 7, "reading": "Deuteronômio 1, 2", "passages": [["Deuteronômio", "1, 2"]], "extra": false, "title": "Recordar para recomeçar", "nodes": [{"ref": "Dt 1", "text": "Moisés relembra liderança, espias e recusa.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-1/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 1 na BKJ Fiel 1611 (requer internet)\">Dt 1<\/a>"}, {"ref": "Dt 2:1-23", "text": "A jornada passa por povos com territórios próprios.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 2 na BKJ Fiel 1611 (requer internet)\">Dt 2:1-23<\/a>"}, {"ref": "Dt 2:24-37", "text": "A narrativa retoma os confrontos a leste.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 2 na BKJ Fiel 1611 (requer internet)\">Dt 2:24-37<\/a>"}], "explain": "O discurso não é mera repetição: prepara uma nova geração para escolher melhor. Israel também precisa reconhecer limites diante de outros povos.", "question": "Aprendo com a história ou apenas a repito?", "action": "Registre um erro passado e uma mudança possível.", "cross": "Dt 2:4-5", "links": [{"label": "Deuteronômio 1", "url": "https://bkjfiel.com.br/deuteronomio-1/"}, {"label": "Deuteronômio 2", "url": "https://bkjfiel.com.br/deuteronomio-2/"}], "explain_html": "O discurso não é mera repetição: prepara uma nova geração para escolher melhor. Israel também precisa reconhecer limites diante de outros povos.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-2/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 2 na BKJ Fiel 1611 (requer internet)\">Dt 2:4-5<\/a>"}, {"day": 71, "week": 11, "weekday": 1, "reading": "Deuteronômio 3, 4", "passages": [["Deuteronômio", "3, 4"]], "extra": false, "title": "Memória e vigilância", "nodes": [{"ref": "Dt 3", "text": "Vitórias e sucessão de liderança são recordadas.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-3/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 3 na BKJ Fiel 1611 (requer internet)\">Dt 3<\/a>"}, {"ref": "Dt 4:1-31", "text": "Moisés adverte contra esquecimento e idolatria.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 4 na BKJ Fiel 1611 (requer internet)\">Dt 4:1-31<\/a>"}, {"ref": "Dt 4:32-49", "text": "A singularidade da libertação sustenta o apelo.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 4 na BKJ Fiel 1611 (requer internet)\">Dt 4:32-49<\/a>"}], "explain": "A memória da graça fundamenta a fidelidade. Moisés prepara Josué enquanto reconhece que não realizará pessoalmente toda a missão.", "question": "Consigo fortalecer quem continuará depois de mim?", "action": "Compartilhe um aprendizado com alguém mais novo.", "cross": "Dt 4:9", "links": [{"label": "Deuteronômio 3", "url": "https://bkjfiel.com.br/deuteronomio-3/"}, {"label": "Deuteronômio 4", "url": "https://bkjfiel.com.br/deuteronomio-4/"}], "explain_html": "A memória da graça fundamenta a fidelidade. Moisés prepara Josué enquanto reconhece que não realizará pessoalmente toda a missão.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-4/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 4 na BKJ Fiel 1611 (requer internet)\">Dt 4:9<\/a>"}, {"day": 72, "week": 11, "weekday": 2, "reading": "Deuteronômio 5-7", "passages": [["Deuteronômio", "5-7"]], "extra": false, "title": "Amar com a vida inteira", "nodes": [{"ref": "Dt 5", "text": "Os mandamentos são reapresentados.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-5/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 5 na BKJ Fiel 1611 (requer internet)\">Dt 5<\/a>"}, {"ref": "Dt 6", "text": "O amor a Deus deve atravessar casa e caminho.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 6 na BKJ Fiel 1611 (requer internet)\">Dt 6<\/a>"}, {"ref": "Dt 7", "text": "A eleição é ligada ao amor e à fidelidade divina.", "ref_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-7/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 7 na BKJ Fiel 1611 (requer internet)\">Dt 7<\/a>"}], "explain": "A transmissão da fé acontece no cotidiano. A eleição não sustenta superioridade moral; chama à responsabilidade e à gratidão.", "question": "O que minha rotina ensina sobre minhas prioridades?", "action": "Converse em família sobre uma escolha de fé.", "cross": "Dt 6:4-9", "links": [{"label": "Deuteronômio 5", "url": "https://bkjfiel.com.br/deuteronomio-5/"}, {"label": "Deuteronômio 6", "url": "https://bkjfiel.com.br/deuteronomio-6/"}, {"label": "Deuteronômio 7", "url": "https://bkjfiel.com.br/deuteronomio-7/"}], "explain_html": "A transmissão da fé acontece no cotidiano. A eleição não sustenta superioridade moral; chama à responsabilidade e à gratidão.", "cross_html": "<a class=\"bible-ref\" href=\"https://bkjfiel.com.br/deuteronomio-6/\" target=\"_blank\" rel=\"noopener\" title=\"Abrir Deuteronômio 6 na BKJ Fiel 1611 (requer internet)\">Dt 6:4-9<\/a>"}, {"day": 73, "week": 1
